ситель": "Wedge damper", "По бокам от надрессорной балки — фрикционные клинья. Они опираются на пружины и прижимаются к фрикционным планкам на колонках рамы. Когда балка качается на пружинах, клинья трутся о планки и гасят колебания.": "On either side of the bolster are friction wedges. They rest on springs and press against the friction plates on the frame columns. When the bolster bounces on the springs, the wedges rub on the plates and damp the oscillation.", "У каждой колёсной пары — триангель с колодками на концах; он висит на подвесках. Вертикальные рычаги связаны с триангелями и между собой затяжкой. Когда сверху тянет тормозной цилиндр вагона, колодки прижимаются ко всем четырём колёсам.": "Each wheelset has a brake beam with shoes at its ends; it hangs on hangers. Vertical levers are linked to the brake beams and to each other by the bottom rod. When the car's brake cylinder pulls from above, the shoes press against all four wheels.", "Разборка": "Exploded view", "Тележка разобрана": "Bogie taken apart", "Тележка разобрана на основные части: надрессорная балка поднята, пружины и клинья вынуты, боковые рамы и буксовые узлы отведены в стороны, колёсные пары раздвинуты, тормозная передача опущена.": "The bogie is taken apart into its main parts: the bolster lifted, springs and wedges removed, side frames and axle boxes moved aside, wheelsets pushed apart, brake rigging lowered.", "В движении": "In motion", "Тележка в работе": "The bogie at work", "Колёсные пары катятся, а надрессорная балка покачивается на пружинах. Клинья гасят эти колебания, и вагон идёт плавно.": "The wheelsets roll and the bolster bounces on the springs. The wedges damp these oscillations, and the car rides smoothly.", "Колёса катятся": "Wheels rolling", "Колебания": "Oscillation", "Отлично: основные узлы вы уже знаете.": "Excellent: you already know the main assemblies.", "Хорошее начало. Пройдите экскурсию ещё раз и повторите.": "Good start. Take the tour again and review.", "Посмотрите экскурсию по шагам, а потом попробуйте снова.": "Go through the tour step by step, then try again.", "Верно!": "Correct!", "Не совсем. Правильный ответ: ": "Not quite. The right answer: ", "Следующий вопрос": "Next question", "Показать итог": "Show result", "Ночь": "Night", "Графит": "Graphite", "Чертёж": "Blueprint", "Цех": "Workshop", "Белый": "White", "Полувагон<small>открытый</small>": "Gondola<small>open</small>", "Думпкар<small>самосвал</small>": "Dump car<small>tipping</small>", "Хоппер<small>крытый</small>": "Hopper<small>covered</small>", "Платформа<small>универсальная</small>": "Flat car<small>general</small>", "Цистерна<small>нефтепродукты</small>": "Tank car<small>petroleum</small>", "Крытый<small>вагон</small>": "Boxcar<small>covered</small>", "Рефрижератор<small>АРВ</small>": "Reefer<small>autonomous</small>", "Транспортёр<small>пониженный</small>": "Well car<small>low deck</small>", "Тележка<small>23,5 т/ось</small>": "Bogie<small>23.5 t/axle</small>", "Собрать": "Assemble", "Разобрать": "Explode", "Узлы вагона": "Assemblies", "Все": "All", "Фон стенда": "Background", "Проверь себя · 8 вопросов": "Test yourself · 8 questions", "Вернуть исходный вид": "Reset view", "Перетаскивание — вращать. Колесо или два пальца — масштаб. Правая кнопка или <kbd>Shift</kbd> — сдвиг. <kbd>←</kbd> <kbd>→</kbd> — шаги экскурсии.": "Drag to rotate. Wheel or two fingers to zoom. Right button or <kbd>Shift</kbd> to pan. <kbd>←</kbd> <kbd>→</kbd> to step through the tour.", "О стенде": "About", "Вариант груза": "Load variant", "Управление": "Controls", "Экскурсия": "Tour", "Предыдущий шаг": "Previous step", "Следующий шаг": "Next step", "Грузовые вагоны в разборе": "Freight Cars Explained", "Свой цвет": "Custom colour", "Свой цвет фона": "Custom background colour"};

Object.assign(I18N_EN,{"Как замедлитель обжимает колесо": "How the retarder squeezes the wheel", "Платформа показана прозрачной, видны колёса — камера едет вместе с ними. Колесо входит между двумя тормозными шинами замедлителя: одна стоит с внутренней стороны колеса, другая — с наружной. Привод сводит шины, и они обжимают колесо с двух сторон, как клещи (оранжевые стрелки). Трение шин о боковые грани колеса гасит скорость — колесо крутится всё медленнее. Когда скорость падает примерно до 5 км/ч, шины разводятся. Этот момент показан замедленно.": "The flat car is shown see-through so the wheels are visible — the camera travels with them. The wheel enters between the retarder's two brake beams: one on the inner side of the wheel, the other on the outer side. The drive closes the beams, and they squeeze the wheel from both sides like pincers (orange arrows). Friction of the beams on the wheel faces takes speed off — the wheel turns slower and slower. When the speed drops to about 5 km/h, the beams open. This moment is shown in slow motion.", "показано замедленно": "shown in slow motion", "Колесо": "Wheel", "об/мин": "rpm"});
Object.assign(I18N_EN,{"Сортировочная горка": "Hump yard", "Платформа с контейнерами скатывается с сортировочной горки, тормозится вагонным замедлителем и сцепляется с вагонами, стоящими на пути. Видно, какие силы при этом действуют на вагон.": "A flat car with containers rolls down a hump, is slowed by a car retarder and couples onto cars standing on the track. You can see the forces acting on the car.", "Упрощённая модель: горка укорочена и сделана круче, замедлитель показан один; силы посчитаны по упрощённой модели поглощающих аппаратов и дают порядок величин, а не точные значения.": "Simplified model: the hump is shorter and steeper, only one retarder is shown; forces come from a simplified draft-gear model and give orders of magnitude, not exact values.", "Горка и путь": "Hump and track", "Насыпь сортировочной горки, рельсы и шпалы.": "The hump embankment, rails and sleepers.", "Вагонный замедлитель": "Car retarder", "Тормозная позиция: шины замедлителя зажимают колёса с боков и гасят скорость отцепа.": "Braking position: the retarder's brake beams squeeze the wheels from the sides and take speed off the cut.", "Вагоны на пути": "Cars on the track", "Вагоны, уже стоящие на пути сортировочного парка: полувагон, цистерна и крытый вагон.": "Cars already standing on a classification track: a gondola, a tank car and a boxcar.", "Горка": "Hump", "Насыпь с вершиной и спускной частью. Состав надвигают на вершину, расцепляют, и отцепы скатываются под уклон сами.": "An embankment with a crest and a descent. The train is pushed over the crest, uncoupled, and the cuts roll down the grade by themselves.", "Высота горок — несколько метров. Отцеп разгоняется на спуске, а нужную скорость ему задают замедлители.": "Humps are a few metres high. A cut speeds up on the descent, and the retarders give it the right speed.", "Рельсы и шпалы": "Rails and sleepers", "Путь с горки на сортировочный путь парка.": "The track from the hump to a classification track.", "Сортировочные пути делают с небольшим уклоном, чтобы вагоны докатывались до стоящих.": "Classification tracks have a slight grade so the cars roll on until they reach the standing ones.", "Тормозные шины": "Brake beams", "Длинные балки вдоль рельсов с обеих сторон колёс. При торможении сдвигаются и зажимают колёса с боков.": "Long beams along the rails on both sides of the wheels. When braking they move in and squeeze the wheels from the sides.", "Трение шин о колёса превращает энергию движения в тепло — отсюда искры и визг на горке.": "Friction between the beams and the wheels turns the energy of motion into heat — hence the sparks and squeal at a hump.", "Привод замедлителя": "Retarder drive", "Пневмоцилиндры и рычаги, которые сводят и разводят тормозные шины.": "Pneumatic cylinders and levers that close and open the brake beams.", "Оператор горки или автоматика задаёт скорость выхода отцепа из замедлителя — так, чтобы он докатился и сцепился мягко.": "The hump operator or automation sets the speed at which the cut leaves the retarder, so that it rolls on and couples gently.", "Стоящие вагоны": "Standing cars", "Полувагон, цистерна и крытый вагон на сортировочном пути.": "A gondola, a tank car and a boxcar on the classification track.", "Они принимают удар скатившегося отцепа: сила проходит через их автосцепки и поглощающие аппараты.": "They take the impact of the rolling cut: the force passes through their couplers and draft gears.", "Состав надвигают на вершину горки и расцепляют на отцепы. Каждый отцеп скатывается под уклон сам и уходит на свой путь сортировочного парка. Внизу, на тормозной позиции, стоит вагонный замедлитель, а на пути уже стоят вагоны — полувагон, цистерна и крытый вагон.": "The train is pushed onto the hump crest and uncoupled into cuts. Each cut rolls down the grade by itself onto its own classification track. At the bottom, on the braking position, is a car retarder, and cars are already standing on the track — a gondola, a tank car and a boxcar.", "Роспуск": "Humping", "Скатить ещё раз": "Roll again", "Роспуск: отцеп скатывается": "Humping: the cut rolls down", "Платформа с контейнерами отцеплена на вершине. На спуске она разгоняется — скорость растёт до 25 км/ч и больше. Если её не затормозить, она врежется в стоящие вагоны слишком сильно. Поэтому на пути стоит замедлитель: он снижает скорость так, чтобы отцеп докатился и сцепился мягко.": "The container flat car is uncoupled at the crest. It speeds up on the descent — up to 25 km/h and more. If it isn't slowed down, it will hit the standing cars far too hard. That's why there is a retarder on the track: it lowers the speed so the cut rolls on and couples gently.", "Замедлитель": "Retarder", "Ещё раз": "Again", "Когда колёса заходят в замедлитель, его тормозные шины сдвигаются и зажимают колёса с обеих сторон. Трение гасит скорость. Как только скорость падает до заданной — около 5 км/ч, — шины разводятся, и платформа катится дальше сама.": "When the wheels enter the retarder, its brake beams move in and squeeze the wheels from both sides. Friction takes speed off. As soon as the speed drops to the set value — about 5 km/h — the beams open and the flat car rolls on by itself.", "Соударение 5 км/ч": "Coupling at 5 km/h", "Мягкое соударение — до 5 км/ч": "Gentle coupling — up to 5 km/h", "Платформа подходит к стоящим вагонам со скоростью около 5 км/ч. Автосцепки сцепляются, поглощающие аппараты сжимаются и гасят удар. Сила в автосцепке — порядка 1 МН (около 100 тс), и аппараты ещё не исчерпали свой ход. Стоящие вагоны немного откатываются.": "The flat car reaches the standing cars at about 5 km/h. The couplers engage, the draft gears compress and absorb the impact. The coupler force is about 1 MN (around 100 tonnes-force), and the draft gears still have travel left. The standing cars roll back a little.", "Удар 12 км/ч": "Impact at 12 km/h", "Жёсткий удар — превышение скорости": "Hard impact — overspeed", "Замедлитель не дотормозил: платформа подходит со скоростью 12 км/ч. Энергия удара растёт как квадрат скорости — почти в шесть раз больше, чем при 5 км/ч. Поглощающие аппараты сжимаются до упора и «закрываются», дальше удар идёт почти жёстко. Сила в автосцепке вырастает в несколько раз, груз и рама получают сильный толчок — так повреждают автосцепки, раму и груз.": "The retarder didn't brake enough: the flat car arrives at 12 km/h. Impact energy grows with the square of speed — almost six times more than at 5 km/h. The draft gears compress fully and go solid, after which the impact is almost rigid. The coupler force grows several times, and the cargo and frame get a heavy jolt — this is how couplers, frames and cargo get damaged.", "Путь нагрузки": "Load path", "Куда идёт нагрузка при ударе": "Where the impact load goes", "Удар принимает автосцепка → её хвостовик через упорную плиту сжимает поглощающий аппарат → аппарат упирается в задние упоры хребтовой балки → хребтовая балка передаёт силу на всю раму. Груз по инерции продолжает двигаться вперёд и давит на свои крепления — у контейнеров на фитинговые упоры платформы. Красные стрелки — сила в автосцепках, оранжевая — инерция груза.": "The coupler takes the impact → its shank compresses the draft gear through the follower plate → the draft gear bears on the rear stops of the centre sill → the centre sill passes the force to the whole frame. By inertia the cargo keeps moving forward and pushes on its securing — for containers, on the flat car's fitting stops. Red arrows show the coupler forces, the orange one the cargo inertia.", "тормозит": "braking", "отпущен": "released", "Скорость платформы": "Flat car speed", "удар показан замедленно": "impact shown in slow motion", "Сила в автосцепке": "Coupler force", "МН": "MN", "пик": "peak", "Ход поглощающих аппаратов": "Draft gear travel", "мм": "mm", "аппараты закрылись!": "draft gears went solid!", "Перегрузка платформы и груза": "Load factor on car and cargo", "В пути<small>поезд, кривые, горка</small>": "On the move<small>train, curves, hump</small>"});
Object.assign(I18N_EN,{"В пути<small>поезд и кривые</small>": "On the move<small>train &amp; curves</small>", "Поезд: волна торможения": "Train: braking wave", "Тележки в кривой": "Bogies in a curve", "Сцена": "Scene"});
Object.assign(I18N_EN,{"Тележки в кривой": "Bogies in a curve", "Как вагон на двух тележках 23,5 т/ось проходит кривую: тележки поворачиваются под кузовом, колёсные пары подруливают за счёт конических колёс, а гребни удерживают их на рельсах.": "How a car on two 23.5 t/axle bogies goes through a curve: the bogies turn under the body, the wheelsets steer thanks to coned wheels, and the flanges keep them on the rails.", "Упрощённая модель: радиус кривой уменьшен до 30 м, чтобы поворот тележек был хорошо виден; в действительности радиусы кривых — сотни метров. Кольца катания и возвышение рельса показаны условно.": "Simplified model: the curve radius is reduced to 30 m so the bogie rotation is easy to see; real curve radii are hundreds of metres. Rolling circles and superelevation are shown schematically.", "Кузов полувагона опирается пятниками на подпятники двух тележек.": "The gondola body rests on the centre bowls of the two bogies through its centre plates.", "Колесо и рельс": "Wheel and rail", "Круги катания колёс и место контакта гребня с рельсом.": "Wheel rolling circles and the point where the flange touches the rail.", "Путь": "Track", "Рельсы и шпалы. В кривой наружный рельс приподнят.": "Rails and sleepers. In a curve the outer rail is raised.", "Кузов вагона": "Car body", "Кузов с рамой. В кривой он идёт по хорде между центрами тележек.": "The body with its frame. In a curve it runs along the chord between the bogie centres.", "Середина кузова в кривой смещается внутрь кривой, а его концы — наружу. Это учитывают в габарите подвижного состава.": "In a curve the middle of the body shifts towards the inside of the curve and its ends towards the outside. This is accounted for in the rolling-stock loading gauge.", "Опора на раме кузова. Входит в подпятник надрессорной балки, через шкворень.": "A support on the body frame. It sits in the bogie bolster's centre bowl, over the king pin.", "Тележка поворачивается вокруг пятника: пара «пятник — подпятник» работает как большой шарнир.": "The bogie turns about the centre plate: the centre plate and bowl work as a large pivot.", "Скользуны рамы": "Body side bearers", "Опоры на раме кузова над скользунами тележки.": "Supports on the body frame above the bogie side bearers.", "При повороте тележки скользуны тележки и рамы проскальзывают друг по другу — их трение немного «успокаивает» тележку и уменьшает виляние.": "When the bogie turns, the bogie and body side bearers slide over each other — their friction slightly calms the bogie and reduces hunting.", "Рельсы": "Rails", "Два рельса колеи 1520 мм. В кривой наружный рельс длиннее внутреннего.": "Two rails of 1520 mm gauge. In a curve the outer rail is longer than the inner one.", "В кривой наружный рельс укладывают выше внутреннего — возвышение компенсирует центробежную силу. Оно не превышает 150 мм.": "In a curve the outer rail is laid higher than the inner one — the superelevation offsets the centrifugal force. It does not exceed 150 mm.", "Круг катания наружного колеса": "Outer wheel rolling circle", "Условное кольцо: по какому радиусу колесо катится по рельсу. Наружное колесо смещено к рельсу и катится по большему радиусу.": "A schematic ring: the radius at which the wheel rolls on the rail. The outer wheel is shifted towards the rail and rolls on a larger radius.", "Поверхность катания колеса коническая (уклон 1:10): чем ближе к гребню, тем больше радиус. Поэтому наружное колесо за оборот проходит больший путь.": "The wheel tread is coned (1:10 taper): the closer to the flange, the larger the radius. So the outer wheel covers more distance per revolution.", "Круг катания внутреннего колеса": "Inner wheel rolling circle", "Условное кольцо: внутреннее колесо катится по меньшему радиусу.": "A schematic ring: the inner wheel rolls on a smaller radius.", "Разница радиусов наружного и внутреннего колёс поворачивает колёсную пару в сторону кривой — она подруливает сама, хоть колёса и сидят на оси наглухо.": "The difference in rolling radii of the outer and inner wheels turns the wheelset into the curve — it steers itself, even though the wheels are fixed on the axle.", "Контакт гребня": "Flange contact", "Место, где гребень набегающего колеса прижимается к боковой грани наружного рельса.": "The point where the flange of the leading wheel presses against the side of the outer rail.", "В крутых кривых гребни набегающих колёс прижимаются к рельсу и изнашиваются; рельсы в таких кривых смазывают лубрикаторами.": "In sharp curves the flanges of the leading wheels press on the rail and wear; rails in such curves are greased by lubricators.", "Прямой участок": "Straight track", "Вагон на прямом участке": "Car on straight track", "На прямом пути обе тележки стоят соосно с кузовом, колёсные пары катятся по середине колеи. Кузов опирается пятниками на подпятники тележек; между пятниками — база вагона, у полувагона 8650 мм.": "On straight track both bogies are in line with the body and the wheelsets roll along the middle of the track. The body rests on the bogie centre bowls through its centre plates; the distance between them is the car's bogie centres, 8650 mm for a gondola.", "Вход в кривую": "Entering the curve", "Тележки поворачиваются под кузовом": "The bogies turn under the body", "В кривой кузов идёт по хорде, а каждая тележка поворачивается вдоль рельсов вокруг своего пятника. Передняя и задняя тележки повёрнуты в разные стороны. Посмотрите сверху: кузов прямой, а тележки стоят под углом к нему.": "In a curve the body runs along the chord, and each bogie turns along the rails about its centre plate. The front and rear bogies turn in opposite directions. Look from above: the body is straight while the bogies are at an angle to it.", "Пятник и скользуны": "Centre plate and bearers", "Поворот на пятнике": "Turning on the centre plate", "Тележка поворачивается вокруг шкворня: пятник кузова вращается в подпятнике надрессорной балки по износостойкой прокладке. Скользуны тележки при этом проскальзывают под скользунами рамы и не дают кузову сильно раскачиваться.": "The bogie turns about the king pin: the body's centre plate rotates in the bolster's centre bowl on a wear liner. The bogie side bearers slide under the body side bearers and keep the body from rocking too much.", "Конические колёса": "Coned wheels", "Конические колёса подруливают": "Coned wheels steer", "Поверхность катания колеса не цилиндр, а конус. В кривой колёсная пара смещается к наружному рельсу: наружное колесо катится ближе к гребню — по большему радиусу (оранжевое кольцо), внутреннее — по меньшему (синее). За один оборот наружное колесо проходит больший путь, и колёсная пара сама поворачивает вдоль кривой.": "The wheel tread is not a cylinder but a cone. In a curve the wheelset shifts towards the outer rail: the outer wheel rolls closer to the flange — on a larger radius (orange ring), the inner one on a smaller radius (blue). In one revolution the outer wheel covers more distance, and the wheelset steers itself along the curve.", "Гребень у рельса": "Flange at the rail", "Гребень удерживает колёсную пару": "The flange keeps the wheelset on track", "В крутой кривой подруливания конусом не хватает. Тогда гребень набегающего колеса передней колёсной пары прижимается к боковой грани наружного рельса и направляет тележку. В этом месте и гребень, и рельс изнашиваются сильнее всего.": "In a sharp curve the cone's steering is not enough. Then the flange of the leading wheel of the front wheelset presses against the side of the outer rail and guides the bogie. This is where both the flange and the rail wear the most.", "Возвышение рельса": "Superelevation", "Возвышение наружного рельса": "Superelevation of the outer rail", "Чтобы центробежная сила не прижимала вагон к наружному рельсу, наружный рельс укладывают выше внутреннего. Вагон в кривой немного наклоняется внутрь, и нагрузка на колёса распределяется ровнее. На модели наклон показан условно.": "So that centrifugal force doesn't push the car against the outer rail, the outer rail is laid higher than the inner one. In a curve the car leans slightly inwards, and the load on the wheels is spread more evenly. The tilt on the model is schematic.", "Под кузовом": "Under the body", "Обе тележки в кривой": "Both bogies in the curve", "Обе тележки повёрнуты вдоль рельсов, их колёсные пары катятся по кривой. Чем меньше радиус кривой, тем больше угол поворота тележек и тем сильнее работают гребни колёс.": "Both bogies are turned along the rails and their wheelsets roll through the curve. The smaller the curve radius, the larger the bogie rotation angle and the harder the wheel flanges work.", "Кривая": "Curve", "Движение": "Motion", "Радиус кривой на модели": "Model curve radius", "м": "m", "поворот каждой тележки относительно кузова": "rotation of each bogie relative to the body", "Тележки<small>в кривой</small>": "Bogies<small>in a curve</small>"});
Object.assign(I18N_EN,{"Торможение поезда": "Train braking", "Короткий грузовой поезд: локомотив и четыре вагона. Видно, как волна торможения бежит по магистрали от вагона к вагону и почему вагоны набегают друг на друга.": "A short freight train: a locomotive and four cars. You can see the braking wave run along the brake pipe from car to car and why the cars run into each other.", "Упрощённая модель: время замедлено, задержка волны — как у длинного поезда, зазоры в автосцепках и сдвиги вагонов увеличены; магистраль показана сбоку от рамы.": "Simplified model: time is slowed down, the wave delay is that of a long train, coupler slack and car movements are exaggerated; the brake pipe is drawn beside the frame.", "Локомотив": "Locomotive", "Тянет поезд. Из кабины машинист управляет тормозами всего состава.": "Pulls the train. From the cab the driver controls the brakes of the whole train.", "Вагоны": "Cars", "Четыре гружёных полувагона.": "Four loaded gondola cars.", "Тормоз поезда": "Train brake", "Общая тормозная магистраль, тормозные цилиндры и колодки каждого вагона.": "The common brake pipe, and each car's brake cylinder and shoes.", "Автосцепки": "Couplers", "Соединяют вагоны и имеют зазоры, из-за которых состав растягивается и сжимается.": "Connect the cars and have slack, which lets the train stretch and bunch up.", "Тянет поезд. Из кабины машинист управляет тормозами всего состава краном машиниста.": "Pulls the train. From the cab the driver controls the brakes of the whole train with the driver's brake valve.", "Кран машиниста снижает или повышает давление в магистрали — так подаётся команда на торможение и отпуск.": "The driver's brake valve lowers or raises the brake-pipe pressure — that is how the brake and release commands are given.", "Полувагоны": "Gondola cars", "Четыре гружёных вагона в составе.": "Four loaded cars in the train.", "Каждый вагон тормозит своим тормозом, но команду получает по общей магистрали.": "Each car brakes with its own brake, but gets the command through the common brake pipe.", "Тормозная магистраль поезда": "Train brake pipe", "Магистрали всех вагонов, соединённые рукавами в одну трубу от локомотива до хвоста. Яркий цвет — магистраль заряжена, тёмный — давление снижено.": "The brake pipes of all cars, joined by hoses into one pipe from the locomotive to the tail. Bright colour — the pipe is charged; dark — the pressure is reduced.", "Снижение давления бежит по магистрали волной примерно 250–300 м/с. В поезде длиной полтора километра хвостовые вагоны начинают тормозить на несколько секунд позже головных.": "The pressure drop runs along the brake pipe as a wave of roughly 250–300 m/s. In a train 1.5 km long, the rear cars start braking several seconds later than the front ones.", "Тормозные цилиндры": "Brake cylinders", "Цилиндр каждого вагона. Чем ярче оранжевый цвет, тем больше в нём воздуха.": "Each car's cylinder. The brighter the orange, the more air in it.", "Цилиндры грузовых вагонов наполняются не мгновенно, а за несколько секунд — это сделано специально, чтобы смягчить набегание вагонов.": "Freight car cylinders don't fill instantly but over several seconds — this is deliberate, to soften the run-in of the cars.", "Провод ЭПТ": "EP brake wire", "Электрическая линия вдоль поезда. По ней команда на торможение приходит на все вагоны одновременно.": "An electric line along the train. Through it the brake command reaches all cars at the same time.", "Электропневматический тормоз (ЭПТ) работает на пассажирских поездах; на грузовых его применяют пока редко.": "The electro-pneumatic brake (EP brake) is used on passenger trains; on freight trains it is still rare.", "Соединяют вагоны. В автосцепке и поглощающем аппарате есть зазоры, поэтому состав может немного растягиваться и сжиматься.": "Connect the cars. There is slack in the coupler and draft gear, so the train can stretch and bunch up a little.", "Когда задние вагоны набегают на передние, зазоры выбираются рывком — это и есть продольный удар. Цвет показывает: зелёный — растянута, серый — свободный зазор, красный — сжата.": "When the rear cars run into the front ones, the slack is taken up with a jolt — that is an in-train impact. Colour shows: green — stretched, grey — free slack, red — compressed.", "Поезд в движении": "Train on the move", "Локомотив тянет четыре гружёных полувагона. В тяге все автосцепки растянуты: каждый вагон тянет за собой следующий. Тормоза отпущены, магистраль заряжена сжатым воздухом.": "The locomotive pulls four loaded gondola cars. Under traction all couplers are stretched: each car pulls the next one. The brakes are released and the brake pipe is charged with compressed air.", "Магистраль поезда": "Train brake pipe", "Одна магистраль на весь поезд": "One brake pipe for the whole train", "Магистрали всех вагонов соединены рукавами в одну трубу — от крана машиниста до хвостового вагона. По ней идёт команда на торможение: машинист снижает давление, и снижение бежит по трубе от головы к хвосту.": "The brake pipes of all cars are joined by hoses into one pipe — from the driver's brake valve to the last car. It carries the brake command: the driver lowers the pressure, and the drop runs along the pipe from head to tail.", "Волна торможения": "Braking wave", "Машинист снижает давление в магистрали. Снижение доходит до вагонов не сразу, а волной: сначала тормозит локомотив и первый вагон, потом второй и так до хвоста. В настоящем длинном поезде эта задержка — несколько секунд, а цилиндры к тому же наполняются постепенно.": "The driver lowers the brake-pipe pressure. The drop doesn't reach the cars at once but as a wave: first the locomotive and the first car brake, then the second, and so on to the tail. In a real long train this delay is several seconds, and the cylinders also fill gradually.", "Продольные удары": "In-train impacts", "Откуда берутся продольные удары": "Where in-train impacts come from", "Головные вагоны уже тормозят, а хвостовые ещё нет — они продолжают катиться и набегают на передние. Зазоры в автосцепках выбираются, и в момент, когда они закрываются, происходит удар. Чем дальше от головы, тем больше разница скоростей и тем сильнее удар.": "The front cars are already braking but the rear ones aren't yet — they keep rolling and run into the front ones. Coupler slack is taken up, and when it closes there is an impact. The farther from the head, the bigger the speed difference and the harder the impact.", "ЭПТ": "EP brake", "Электропневматический тормоз": "Electro-pneumatic brake", "У электропневматического тормоза команда приходит по проводу на все вагоны одновременно. Все вагоны начинают тормозить вместе, никто ни на кого не набегает — автосцепки остаются растянутыми, ударов нет. Так тормозят пассажирские поезда.": "With an electro-pneumatic brake the command comes through a wire to all cars at once. All cars start braking together, nobody runs into anybody — the couplers stay stretched and there are no impacts. This is how passenger trains brake.", "Как смягчают удары": "Softening impacts", "Как машинист смягчает удары": "How the driver softens impacts", "Перед торможением машинист может сначала сжать состав, например слегка подтормозив локомотивом. Вагоны мягко, на малой скорости набегают друг на друга, зазоры выбираются заранее. Когда затем срабатывает пневматический тормоз, вагонам уже некуда набегать — удары гораздо слабее.": "Before braking, the driver can first bunch the train, for example by braking the locomotive slightly. The cars run into each other gently, at low speed, and the slack is taken up in advance. When the air brake then applies, the cars have nowhere to run — the impacts are much weaker.", "Поезд идёт в тяге, автосцепки растянуты. Сейчас машинист затормозит…": "The train is running under traction, couplers stretched. The driver is about to brake…", "Машинист снизил давление в магистрали. Волна разрядки бежит от локомотива к хвосту — вагоны начинают тормозить по очереди.": "The driver has lowered the brake-pipe pressure. The pressure-drop wave runs from the locomotive to the tail — the cars start braking one after another.", "Голова поезда уже тормозит, а хвост ещё катится — задние вагоны набегают на передние, зазоры в автосцепках закрываются с ударом.": "The head of the train is already braking while the tail is still rolling — the rear cars run into the front ones, and coupler slack closes with a jolt.", "ЭПТ: команда на торможение пришла по проводу на все вагоны сразу. Вагоны тормозят вместе и не набегают друг на друга.": "EP brake: the brake command came through the wire to all cars at once. The cars brake together and don't run into each other.", "Сначала локомотив слегка подтормаживает: вагоны мягко, без ударов набегают друг на друга и сжимают состав (этот этап показан ускоренно).": "First the locomotive brakes slightly: the cars gently, without impacts, run into each other and bunch the train (this stage is sped up).", "Теперь пневматическое торможение: зазоры уже выбраны, поэтому удары слабые.": "Now the air brake: the slack is already taken up, so the impacts are weak.", "Поезд остановился.": "The train has stopped.", "Лок.": "Loco", "Л–1": "L–1", "Цилиндры": "Cylinders", "Сцепки": "Couplers", "Ударов в автосцепках не было.": "There were no coupler impacts.", "Самый сильный удар — в сцепке": "The hardest impact was at coupler", "удар!": "impact!", "растянута": "stretched", "сжата": "compressed", "зазор": "slack", "Скорость": "Speed", "км/ч": "km/h", "время замедлено": "time slowed down", "Поезд<small>волна торможения</small>": "Train<small>braking wave</small>"});
Object.assign(I18N_EN,{"← к локомотиву": "← to the locomotive", "Воздух от локомотива заполняет магистраль и через воздухораспределитель заряжает запасный резервуар.": "Air from the locomotive fills the brake pipe and charges the auxiliary reservoir through the control valve."});
Object.assign(I18N_EN,{"Движение воздуха": "Air flow", "Сначала": "From the start", "С чего начинается торможение": "Where braking begins", "Всё начинается не в вагоне, а на локомотиве. Сначала магистраль и запасные резервуары всех вагонов заряжаются сжатым воздухом. Чтобы затормозить, машинист краном выпускает часть воздуха из магистрали — по поезду бежит волна снижения давления. Воздухораспределитель каждого вагона замечает её и пускает воздух из своего запасного резервуара через авторежим в тормозной цилиндр. Чтобы отпустить тормоз, давление в магистрали снова повышают.": "It all starts on the locomotive, not on the car. First the brake pipe and the auxiliary reservoirs of all cars are charged with compressed air. To brake, the driver uses the brake valve to let some air out of the brake pipe — a pressure-drop wave runs along the train. Each car's control valve senses it and lets air from its own auxiliary reservoir through the empty/load device into the brake cylinder. To release the brake, the brake-pipe pressure is raised again.", "1 · Зарядка": "1 · Charging", "Воздух от локомотива (слева) заполняет магистраль и через воздухораспределитель заряжает запасный резервуар.": "Air from the locomotive (on the left) fills the brake pipe and charges the auxiliary reservoir through the control valve.", "2 · Начало торможения": "2 · Braking begins", "Машинист краном снижает давление в магистрали — воздух уходит из неё в сторону локомотива.": "The driver lowers the brake-pipe pressure with the brake valve — air leaves the pipe towards the locomotive.", "3 · Торможение": "3 · Braking", "Воздухораспределитель пускает воздух из запасного резервуара через авторежим в тормозной цилиндр — шток выдвигается, колодки прижимаются к колёсам.": "The control valve lets air from the auxiliary reservoir through the empty/load device into the brake cylinder — the piston rod extends and the shoes press against the wheels.", "4 · Вагон заторможен": "4 · Car braked", "Давление в цилиндре держится, пока машинист не начнёт отпуск.": "The cylinder pressure holds until the driver starts the release.", "5 · Отпуск": "5 · Release", "Давление в магистрали повышают — воздухораспределитель выпускает воздух из цилиндра в атмосферу и подзаряжает запасный резервуар.": "The brake-pipe pressure is raised — the control valve vents the cylinder to atmosphere and recharges the auxiliary reservoir.", "воздух магистрали": "brake-pipe air", "воздух в тормозной цилиндр": "air to the brake cylinder", "выпуск в атмосферу": "exhaust to atmosphere"});
Object.assign(I18N_EN,{"Тормоз грузового вагона": "Freight car brake", "Расположение тормозного оборудования на четырёхосном грузовом вагоне: воздушная часть, тормозной цилиндр с авторегулятором и рычажная передача до колодок обеих тележек.": "Layout of the brake equipment on a four-axle freight car: the air system, the brake cylinder with the slack adjuster, and the rigging down to the brake shoes of both bogies.", "Упрощённая модель: рама вагона показана прозрачной, тележки упрощены, ход рычагов и колодок при торможении для наглядности увеличен.": "Simplified model: the car frame is see-through, the bogies are simplified, and the travel of the levers and shoes during braking is exaggerated for clarity.", "Контур рамы показан прозрачным: всё тормозное оборудование крепится к ней снизу.": "The frame outline is shown see-through: all the brake equipment is mounted underneath it.", "Тележки": "Bogies", "Колёсные пары, боковые рамы и надрессорные балки двух тележек — к ним подводится тормозное усилие.": "Wheelsets, side frames and bolsters of the two bogies — this is where the braking force is delivered.", "Пневматическая часть": "Air system", "Магистраль, воздухораспределитель, запасный резервуар, авторежим и трубопроводы: управляют тормозом сжатым воздухом.": "Brake pipe, control valve, auxiliary reservoir, empty/load device and piping: they control the brake with compressed air.", "Цилиндр и авторегулятор": "Cylinder and slack adjuster", "Тормозной цилиндр превращает давление воздуха в усилие, а авторегулятор поддерживает нужный выход штока.": "The brake cylinder turns air pressure into force, and the slack adjuster keeps the piston travel within limits.", "Рычажная передача вагона": "Car body rigging", "Горизонтальные рычаги, затяжка и тяги под рамой: передают усилие штока на обе тележки.": "Horizontal levers, the tie rod and the pull rods under the frame: they carry the piston force to both bogies.", "Рычажная передача тележки": "Bogie rigging", "Вертикальные рычаги, триангели, башмаки с колодками и подвески: прижимают колодки к колёсам.": "Vertical levers, brake beams, shoe heads with shoes and hangers: they press the shoes against the wheels.", "Хребтовая, шкворневые, поперечные и концевые балки. Показана прозрачной, чтобы было видно оборудование под ней.": "Centre sill, body bolsters, cross bearers and end sills. Shown see-through so the equipment underneath is visible.", "Тормозной цилиндр, запасный резервуар и воздухораспределитель крепят к раме на кронштейнах.": "The brake cylinder, auxiliary reservoir and control valve are bolted to the frame on brackets.", "Ось с двумя колёсами. Тормозные колодки прижимаются к кругу катания колёс.": "An axle with two wheels. The brake shoes press against the wheel treads.", "При торможении колодки трением забирают энергию вращения колёс — и колёса, и колодки при этом нагреваются.": "When braking, the shoes take away the wheels' rotational energy through friction — both wheels and shoes heat up.", "Литые рамы тележки. На них — кронштейны подвесок башмаков и полки под концами триангелей.": "Cast frames of the bogie. They carry the shoe-hanger brackets and the ledges under the ends of the brake beams.", "У каждой тележки своя рычажная передача, а усилие к ней приходит сверху — от тормозного цилиндра на раме вагона.": "Each bogie has its own rigging, and the force reaches it from above — from the brake cylinder on the car frame.", "Надрессорные балки": "Bolsters", "Поперечные балки тележек. На надрессорной балке — кронштейн мёртвой точки рычажной передачи.": "Cross beams of the bogies. The bolster carries the dead-lever bracket of the rigging.", "К кронштейну на надрессорной балке на серьге подвешен верх второго вертикального рычага — это неподвижная «мёртвая точка» передачи.": "The top of the second vertical lever hangs on a link from a bracket on the bolster — this is the fixed 'dead point' of the rigging.", "Стальная труба вдоль всего вагона. Через рукава соединяется с магистралями соседних вагонов в одну линию на весь поезд.": "A steel pipe along the whole car. Via hoses it joins the pipes of the neighbouring cars into one line through the whole train.", "В отпущенном состоянии магистраль заряжена сжатым воздухом. Тормоз срабатывает, когда машинист снижает в ней давление.": "When released, the brake pipe is charged with compressed air. The brake applies when the driver lowers the pressure in it.", "Концевые краны № 190": "Angle cocks No. 190", "Краны на концах магистрали. Между вагонами они открыты, на хвостовом вагоне поезда — закрыты.": "Cocks at the ends of the brake pipe. Between cars they are open; on the last car of the train they are closed.", "Ручка вдоль трубы — кран открыт, поперёк трубы — закрыт.": "Handle along the pipe — the cock is open; across the pipe — closed.", "Соединительные рукава": "Air hoses", "Гибкие резиновые рукава с головками. Соединяют магистрали соседних вагонов.": "Flexible rubber hoses with couplings. They connect the brake pipes of neighbouring cars.", "Если поезд разорвётся, рукава разъединятся, воздух из магистрали выйдет — и обе части поезда затормозят сами.": "If the train breaks apart, the hoses pull apart, the air escapes from the brake pipe — and both parts of the train brake by themselves.", "Пылеловка-тройник": "Dirt collector tee", "Ответвление от магистрали к воздухораспределителю. В нём оседают пыль и влага.": "The branch from the brake pipe to the control valve. Dust and moisture settle in it.", "К воздухораспределителю воздух приходит очищенным: грязь мешала бы работе его клапанов.": "Air reaches the control valve clean: dirt would interfere with its valves.", "Двухкамерный резервуар 295.001": "Two-chamber reservoir 295.001", "Кронштейн-резервуар воздухораспределителя № 483, закреплённый на раме. С одной стороны к нему привёрнута магистральная часть, с другой — главная.": "The bracket-reservoir of control valve No. 483, fixed to the frame. The pipe portion is bolted to one side of it and the main portion to the other.", "Все трубы подводятся к двухкамерному резервуару, поэтому главную и магистральную части снимают для ремонта, не трогая трубопроводы.": "All pipes connect to the two-chamber reservoir, so the main and pipe portions can be removed for repair without touching the piping.", "Магистральная часть 483.010": "Pipe portion 483.010", "Часть воздухораспределителя, которая следит за давлением в магистрали и при его снижении запускает торможение.": "The part of the control valve that watches the brake-pipe pressure and starts braking when it drops.", "Переключателем на магистральной части выбирают равнинный или горный режим отпуска тормоза.": "A switch on the pipe portion selects the flat-country or mountain release mode.", "Главная часть 270.023": "Main portion 270.023", "Часть воздухораспределителя, которая наполняет тормозной цилиндр воздухом из запасного резервуара и выпускает его при отпуске.": "The part of the control valve that fills the brake cylinder with air from the auxiliary reservoir and exhausts it on release.", "На главной части есть переключатель грузовых режимов; если на вагоне стоит авторежим, режим подбирается автоматически.": "The main portion has a load-mode switch; if the car has an empty/load device, the mode is set automatically.", "Запасный резервуар Р7-78": "Auxiliary reservoir R7-78", "Баллон на 78 литров. Хранит запас сжатого воздуха для торможения этого вагона.": "A 78-litre tank. It stores the compressed air this car needs for braking.", "Грузовой авторежим № 265А-1": "Empty/load device No. 265A-1", "Прибор между воздухораспределителем и тормозным цилиндром. Подбирает давление в цилиндре по загрузке вагона.": "A device between the control valve and the brake cylinder. It sets the cylinder pressure according to the car's load.", "Порожний вагон тормозится слабее, гружёный — сильнее: так колёса порожнего вагона не идут юзом.": "An empty car brakes more gently and a loaded one harder: this way the wheels of an empty car don't skid.", "Опорная балка авторежима": "Empty/load device support beam", "Балка на боковых рамах тележки. В неё упирается упор авторежима.": "A beam on the bogie side frames. The plunger of the empty/load device rests on it.", "Чем тяжелее груз, тем сильнее сжаты пружины тележки и тем ближе рама вагона к опорной балке — по этому ходу авторежим и узнаёт загрузку.": "The heavier the load, the more the bogie springs are compressed and the closer the car frame comes to the support beam — that travel tells the device the load.", "Трубопроводы": "Piping", "Трубы от тройника к воздухораспределителю, к запасному резервуару, авторежиму и тормозному цилиндру.": "Pipes from the tee to the control valve, the auxiliary reservoir, the empty/load device and the brake cylinder.", "Трубы крепят к раме скобами, чтобы в пути они не тёрлись и не вибрировали.": "Pipes are clamped to the frame so that they don't rub or vibrate on the move.", "Тормозной цилиндр № 188Б": "Brake cylinder No. 188B", "Цилиндр с поршнем, закреплённый на раме. Сжатый воздух давит на поршень, и шток выдвигается.": "A cylinder with a piston, fixed to the frame. Compressed air pushes the piston and the rod extends.", "Диаметр цилиндра — 356 мм (14 дюймов). Когда воздух выпускают, поршень возвращает назад отпускная пружина.": "Cylinder diameter is 356 mm (14 inches). When the air is released, a release spring pushes the piston back.", "Шток": "Piston rod", "Полый шток поршня. Выходит из передней крышки цилиндра и толкает горизонтальный рычаг.": "The hollow piston rod. It comes out of the cylinder front cover and pushes a horizontal lever.", "Ход штока при торможении называют выходом штока — на схеме это размер A.": "The rod's travel during braking is called piston travel — dimension A on the diagram.", "Авторегулятор № 574Б": "Slack adjuster No. 574B", "Встроен в одну из тяг. По мере износа колодок сам укорачивает тягу, чтобы выход штока оставался в норме.": "Built into one of the pull rods. As the shoes wear, it shortens the rod by itself to keep the piston travel within limits.", "Без авторегулятора колодки по мере износа отходили бы всё дальше от колёс, ход штока рос бы, а тормозное усилие падало.": "Without a slack adjuster, worn shoes would sit ever farther from the wheels, piston travel would grow and braking force would drop.", "Регулирующий винт": "Adjuster screw", "Винт авторегулятора, выходящий из его корпуса. При регулировке он уходит в корпус, и тяга укорачивается.": "The slack adjuster screw coming out of its housing. During adjustment it goes into the housing and the rod gets shorter.", "Сколько резьбы винта ещё осталось — это запас регулятора, размер a. Когда запас исчерпан, регулятор больше не может компенсировать износ.": "How much thread is left on the screw is the adjuster's reserve, dimension a. Once it is used up, the adjuster can no longer make up for wear.", "Упорный рычаг": "Stop lever", "Рычаг привода авторегулятора. Связан тягой с горизонтальным рычагом и при торможении поворачивается к корпусу регулятора.": "The lever of the slack-adjuster drive. A rod links it to a horizontal lever, and it swings towards the adjuster housing when braking.", "Если ход штока стал слишком большим, упорный рычаг упирается в корпус регулятора — и тот укорачивает тягу.": "If piston travel gets too long, the stop lever hits the adjuster housing — and the adjuster shortens the rod.", "Кронштейн и регулировочный винт привода": "Drive bracket and adjusting screw", "Кронштейн на раме, на котором качается упорный рычаг, и винт на тяге привода, которым настраивают его положение.": "The bracket on the frame that the stop lever swings on, and the screw on the drive rod used to set its position.", "Регулировочным винтом привода задают, при каком выходе штока регулятор начнёт работать.": "The drive's adjusting screw sets the piston travel at which the slack adjuster starts working.", "Размер a": "Dimension a", "Запас резьбы регулирующего винта авторегулятора.": "Thread reserve of the slack adjuster screw.", "Если запас мал, колодки сильно изношены или передача собрана неверно — её перерегулируют.": "If the reserve is small, the shoes are badly worn or the rigging is set up wrong — it gets readjusted.", "Размер A": "Dimension A", "Выход штока тормозного цилиндра при торможении.": "Brake cylinder piston travel when braking.", "Выход штока проверяют при опробовании тормозов: и слишком малый, и слишком большой — неисправность.": "Piston travel is checked during the brake test: both too short and too long are faults.", "Горизонтальные рычаги": "Horizontal levers", "Два рычага у цилиндра: один на штоке, другой на кронштейне задней крышки. Передают усилие на две тяги — к каждой тележке.": "Two levers at the cylinder: one on the piston rod, the other on the rear-cover bracket. They pass the force to two pull rods — one per bogie.", "Соотношение плеч рычагов подбирают так, чтобы нажатие колодок подходило для данного вагона.": "The lever arm ratio is chosen so that the shoe force suits the particular car.", "Затяжка горизонтальных рычагов": "Horizontal lever tie rod", "Тяга, связывающая концы двух горизонтальных рычагов.": "The rod connecting the ends of the two horizontal levers.", "Благодаря затяжке оба рычага работают вместе, и усилие делится между тележками.": "Thanks to the tie rod, both levers work together and the force is shared between the bogies.", "Кронштейн горизонтального рычага": "Horizontal lever bracket", "Кронштейн на задней крышке цилиндра. В нём на валике качается второй горизонтальный рычаг.": "A bracket on the cylinder rear cover. The second horizontal lever swings in it on a pin.", "Этот рычаг не двигается вместе со штоком — он только поворачивается вокруг своего валика.": "This lever doesn't travel with the piston rod — it only pivots about its pin.", "Тяги": "Pull rods", "Длинные тяги от горизонтальных рычагов к вертикальным рычагам тележек.": "Long rods from the horizontal levers to the bogie vertical levers.", "Одна из тяг составная: в неё встроен авторегулятор.": "One of the rods is built-up: the slack adjuster is fitted into it.", "Предохранительные скобы": "Safety brackets", "Скобы на раме под тягами.": "Brackets on the frame under the pull rods.", "Если тяга или валик оборвутся, деталь ляжет на скобу и не упадёт на путь.": "If a rod or pin breaks, the part drops onto the bracket instead of onto the track.", "Валики": "Pins", "Стальные пальцы в шарнирах рычагов и тяг.": "Steel pins in the joints of levers and rods.", "Валики фиксируют шайбами и шплинтами: без шплинта валик может выпасть на ходу.": "Pins are secured with washers and cotter pins: without a cotter pin a pin can drop out on the move.", "Два рычага в каждой тележке. Верх первого соединён с тягой от вагона, верх второго — через серьгу с надрессорной балкой.": "Two levers in each bogie. The top of the first is linked to the rod from the car, the top of the second to the bolster via a link.", "Средней частью каждый рычаг соединён с триангелем, а нижние концы рычагов связаны затяжкой.": "Each lever is connected to a brake beam in the middle, and the lower ends of the levers are joined by a tie rod.", "Затяжка вертикальных рычагов": "Vertical lever tie rod", "Тяга между нижними концами вертикальных рычагов тележки.": "The rod between the lower ends of the bogie's vertical levers.", "Через затяжку усилие от первого рычага переходит на второй, и тормозят обе колёсные пары тележки.": "Through the tie rod the force passes from the first lever to the second, so both wheelsets of the bogie brake.", "Серьга мёртвой точки": "Dead-lever link", "Серьга, на которой верх второго вертикального рычага подвешен к кронштейну на надрессорной балке.": "The link by which the top of the second vertical lever hangs from a bracket on the bolster.", "Это неподвижная опора передачи: рычаг поворачивается вокруг неё и прижимает свой триангель к колёсам.": "It is the fixed support of the rigging: the lever pivots about it and presses its brake beam against the wheels.", "Треугольные балки у каждой колёсной пары. На концах — башмаки с колодками, в вершине — связь с вертикальным рычагом.": "Triangular beams at each wheelset. At the ends are shoe heads with shoes; at the apex is the connection to the vertical lever.", "Один триангель прижимает колодки сразу к обоим колёсам оси.": "One brake beam presses shoes onto both wheels of an axle at once.", "Тормозные башмаки": "Brake shoe heads", "Литые башмаки на концах триангеля. В них вставлены колодки.": "Cast heads at the ends of the brake beam. The shoes are inserted into them.", "Колодку держит в башмаке чека — её вынимают, чтобы заменить изношенную колодку.": "A key holds the shoe in the head — it is pulled out to replace a worn shoe.", "Композиционные колодки, которые прижимаются к кругу катания колёс.": "Composition shoes that are pressed against the wheel treads.", "Изношенные колодки меняют, а пока они изнашиваются, авторегулятор не даёт зазору до колеса расти.": "Worn shoes are replaced, and while they wear, the slack adjuster keeps the gap to the wheel from growing.", "Подвески башмаков": "Shoe hangers", "Предохранительные полки": "Safety ledges", "Полки боковых рам под концами триангелей.": "Ledges of the side frames under the ends of the brake beams.", "Если подвеска оборвётся, триангель ляжет на полку и не упадёт на путь.": "If a hanger breaks, the brake beam drops onto the ledge instead of onto the track.", "Так расположено тормозное оборудование под четырёхосным грузовым вагоном. Рама показана прозрачной. Воздушная часть управляет тормозом, тормозной цилиндр создаёт усилие, а рычажная передача доводит его до колодок всех восьми колёс.": "This is how the brake equipment is laid out under a four-axle freight car. The frame is shown see-through. The air system controls the brake, the brake cylinder produces the force, and the rigging delivers it to the shoes of all eight wheels.", "Магистраль": "Brake pipe", "Вдоль всего вагона идёт тормозная магистраль. На её концах — концевые краны № 190 и соединительные рукава: так магистрали всех вагонов собираются в одну линию. От магистрали через пылеловку-тройник воздух идёт к воздухораспределителю.": "The brake pipe runs along the whole car. At its ends are angle cocks No. 190 and air hoses: this joins the pipes of all the cars into one line. From the brake pipe, air goes through the dirt collector tee to the control valve.", "Воздухораспределитель № 483": "Control valve No. 483", "Воздухораспределитель собран из трёх частей: на двухкамерном резервуаре 295.001 с одной стороны стоит магистральная часть 483.010, с другой — главная часть 270.023. Когда давление в магистрали снижается, он пускает воздух из запасного резервуара Р7-78 к тормозному цилиндру, а когда повышается — выпускает воздух из цилиндра в атмосферу.": "The control valve is made of three parts: the two-chamber reservoir 295.001 carries the pipe portion 483.010 on one side and the main portion 270.023 on the other. When the brake-pipe pressure drops, it lets air from the R7-78 auxiliary reservoir into the brake cylinder; when the pressure rises, it vents the cylinder to atmosphere.", "Воздух к тормозному цилиндру идёт через грузовой авторежим. Он закреплён на раме, а его упор опирается на опорную балку на боковых рамах тележки. Чем больше груз, тем сильнее сжаты пружины тележки — и тем выше давление, которое авторежим пропускает в цилиндр.": "Air reaches the brake cylinder through the empty/load device. It is fixed to the frame, and its plunger rests on a support beam on the bogie side frames. The heavier the load, the more the bogie springs are compressed — and the higher the pressure the device lets into the cylinder.", "Цилиндр и рычаги": "Cylinder and levers", "Цилиндр и горизонтальные рычаги": "Cylinder and horizontal levers", "Тормозной цилиндр № 188Б закреплён на раме. Его шток соединён с одним горизонтальным рычагом, кронштейн задней крышки — с другим. Рычаги связаны затяжкой, а от их концов к тележкам идут тяги. Под тягами — предохранительные скобы.": "Brake cylinder No. 188B is fixed to the frame. Its piston rod is connected to one horizontal lever, the rear-cover bracket to the other. The levers are joined by a tie rod, and pull rods run from their ends to the bogies. Safety brackets sit under the rods.", "Авторегулятор": "Slack adjuster", "В тягу ко второй тележке встроен авторегулятор. Его привод — упорный рычаг на кронштейне, связанный тягой с горизонтальным рычагом. Когда колодки изнашиваются и ход штока растёт, упорный рычаг упирается в корпус регулятора, и тот укорачивает тягу. На схеме: a — запас резьбы регулирующего винта, A — выход штока тормозного цилиндра.": "A slack adjuster is built into the rod to the second bogie. Its drive is a stop lever on a bracket, linked by a rod to a horizontal lever. As the shoes wear and piston travel grows, the stop lever hits the adjuster housing and the adjuster shortens the rod. On the diagram: a is the thread reserve of the adjuster screw, A is the brake cylinder piston travel.", "В каждой тележке — два вертикальных рычага. Верх первого тянет тяга от вагона, верх второго подвешен на серьге к надрессорной балке. Средней частью рычаги соединены с триангелями, а нижними концами — затяжкой. Триангели висят на подвесках и несут башмаки с колодками.": "Each bogie has two vertical levers. The top of the first is pulled by the rod from the car; the top of the second hangs on a link from the bolster. In the middle the levers are connected to the brake beams, and at the bottom to a tie rod. The brake beams hang on hangers and carry the shoe heads with shoes.", "Торможение": "Braking", "Затормозить": "Apply brake", "Отпустить": "Release", "Как работает торможение": "How braking works", "Машинист снижает давление в магистрали → воздухораспределитель пускает воздух из запасного резервуара через авторежим в цилиндр → шток выдвигается и поворачивает горизонтальные рычаги → тяги тянут вертикальные рычаги тележек → триангели прижимают колодки к колёсам. При отпуске воздух выходит из цилиндра, и отпускная пружина возвращает всё назад.": "The driver lowers the brake-pipe pressure → the control valve lets air from the auxiliary reservoir through the empty/load device into the cylinder → the piston rod extends and swings the horizontal levers → the pull rods pull the bogie vertical levers → the brake beams press the shoes against the wheels. On release, the air leaves the cylinder and the release spring returns everything.", "Оборудование по группам": "Equipment by group", "Рама поднята, а воздушная часть отодвинута в сторону. На месте остались тормозной цилиндр с авторегулятором и рычажная передача — от штока до колодок.": "The frame is lifted and the air system is moved aside. The brake cylinder with the slack adjuster and the rigging — from the piston rod to the shoes — stay in place.", "Тормоз<small>рычажная передача</small>": "Brake<small>rigging</small>"});let LANG='ru';

  side_frame:{sys:'bogie',name:'Боковая рама',what:'Литая стальная рама сбоку тележки. Концами опирается на буксы, а в её центральное окно входит надрессорная балка.',fact:'Боковые рамы и надрессорную балку отливают из стали — это самые массивные детали тележки.'},

/* ================= Blender models (GLB) =================
   Detailed parts are modelled in Blender by the scripts in blender/ and exported to models/*.glb.
   glbPart() puts such a model into a wagon: until the file has loaded, or if it fails to load
   (e.g. the page is opened straight from disk), the primitive meshes passed as `fallback` stay.
   Each mesh takes its part id from the "part" custom property set in Blender, else opts.part. */
const GLB={loader:THREE.GLTFLoader?new THREE.GLTFLoader():null,cache:{},gen:0};
function loadGLB(url){
  if(!GLB.loader)return Promise.reject(new Error('GLTFLoader missing'));
  return GLB.cache[url]||(GLB.cache[url]=new Promise((res,rej)=>GLB.loader.load(url,g=>res(g.scene),undefined,rej)));

function unregMesh(m){
  const p=m.userData.part;

  const j=REG.pickables.indexOf(m);if(j>=0)REG.pickables.splice(j,1);
  if(m.parent)m.parent.remove(m);
  if(m.geometry)m.geometry.dispose();
  (Array.isArray(m.material)?m.material:[m.material]).forEach(mt=>mt&&mt.dispose());
}
function partAnchorOf(pid){
  const m=REG.meshesOf[pid]&&REG.meshesOf[pid][0];if(!m)return;
  m.geometry.computeBoundingBox();const c=new V3();m.geometry.boundingBox.getCenter(c);
  REG.partAnchor[pid]=anchor(m,c.x,c.y,c.z);

function glbPart(parent,url,opts={}){
  const g=new THREE.Group();parent.add(g);
  if(opts.pos)g.position.set(...opts.pos);
  if(opts.rot)g.rotation.set(...opts.rot);
  const gen=GLB.gen,fallback=opts.fallback||[];
  loadGLB(url).then(src=>{
    if(gen!==GLB.gen||!g.parent)return;            /* another wagon is shown by now */
    const inst=src.clone(true),parts=new Set();
    inst.traverse(o=>{
      if(!o.isMesh)return;
      o.userData.glb=true;                          /* geometry is shared with the cache */
      o.material=Array.isArray(o.material)?o.material.map(mt=>mt.clone()):o.material.clone();
      o.castShadow=o.receiveShadow=true;
      let pid=null;for(let n=o;n&&!pid;n=n.parent)pid=n.userData&&n.userData.part;
      pid=pid||opts.part;
      if(pid&&W.P[pid]){o.userData.part=pid;(REG.meshesOf[pid]=REG.meshesOf[pid]||[]).push(o);REG.pickables.push(o);parts.add(pid);}
    });
    fallback.forEach(m=>{if(m.userData.part)parts.add(m.userData.part);unregMesh(m);});
    g.add(inst);
    parts.forEach(partAnchorOf);

  }).catch(e=>console.warn('GLB model not loaded, primitives kept:',url,e));
  return g;
}

function heapPlane(w,d,segX,segZ,base,mounds,amp){
  const top=new THREE.PlaneGeometry(w,d,segX,segZ);top.rotateX(-PI/2);
  const pos=top.attributes.position,hw=w/2-.04,hd=d/2-.03;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i);let h=0;
    mounds.forEach(c=>{h+=amp*Math.exp(-((x-c)*(x-c))/1.6);});
    h*=1-Math.pow(Math.abs(z)/(d/2),3)*.6;
    h+=(Math.sin(x*7.3+z*3.1)*.5+Math.sin(x*13.1-z*9.7)*.5)*.035;
    if(Math.abs(z)>hd||Math.abs(x)>hw)h=0;
    pos.setY(i,base+h);
  }
  top.computeVertexNormals();return top;
}

  anim(ctx,dt,e,w){

        else if(t<11.5)cy=dn;
        else cy=dn+(up-dn)*smooth(clamp(t-11.5,0,1));
        if(t>=1&&t<5)ang=A*smooth((t-1)/4);else if(t>=5&&t<7.5)ang=A;else if(t>=7.5&&t<11.5)ang=A*(1-smooth((t-7.5)/4));

      }
      if(e>=.03){ang=0;}
      ctx.piv.rotation.x=reduce&&ctx.dumping?(ctx.dT>1&&ctx.dT<11.5?2.97:0):ang;
      ctx.clamps.forEach(c=>c.position.y=cy);
      ctx.clampRods.forEach(r=>{r.position.y=(cy+ctx.yTB)/2;r.scale.y=Math.max(.01,ctx.yTB-cy);});
      if(w.cargo&&ctx.piv.rotation.x>1.75&&ctx.level>0&&e<.03){
        spilling=true;ctx.level=Math.max(0,ctx.level-dt*.4);

  },
  applyStep(s,w,ctx){w.cargo=!!s.cargo;if('hatch' in w)w.hatch=!!s.hatch;if(w.cargo)ctx.level=1;ctx.dumpOn=!!s.dump;ctx.dumping=false;ctx.dT=0;ctx.piv.rotation.x=0;if(s.unload)this.action('replay',w,ctx);if(s.dump)this.action('dump',w,ctx);},

    HHX.forEach(x=>{const g=group(root,x,0,0);const t=new THREE.Mesh(Cy(.16,.2,1,20),spMat);t.position.y=.5;g.add(t);const r=new THREE.Mesh(Cy(.24,.24,.08,20),spMat);r.position.y=0;g.add(r);g.position.y=7.2;g.visible=false;ctx.spouts.push(g);});

    REG.sysAnchor={body:anchor(sideN[1],-1.0,2.6,HZ+.1),roof:anchor(roofN,1.4,yH+.2,0),unload:anchor(unloadN,0,.45,.78),frame:anchor(F,6.42,1.4,-.6),bogie:anchor(bp,0,.62,1.12),coupler:anchor(cN[1],7.45,1.1,0),brake:anchor(br,-1.3,1.28,0)};

  anim(ctx,dt,e,w){
    const k=Math.min(1,dt*2.4),tt=w.top?1:0,gt=w.gate?1:0;

    ctx.gateCur=reduce?gt:ctx.gateCur+(gt-ctx.gateCur)*k;
    for(const c of ctx.covers)c.rotation.z=-1.9*ctx.topCur;
    for(const f of ctx.flaps)f.g.rotation.x=-f.s*1.15*ctx.gateCur;
    const unloading=w.cargo&&ctx.gateCur>.6&&e<.03&&ctx.level>0;
    if(unloading){
      ctx.level=Math.max(0,ctx.level-dt*.09);
      const n=Math.ceil(dt*900);
      for(let i=0;i<n;i++){const b=BUNK[i%6];spawnP(b[0]+(Math.random()-.5)*.5,.42,b[1]+(Math.random()-.5)*.3,(Math.random()-.5)*.15,-.4-Math.random()*.8,(Math.random()-.5)*.15);}
    }
    const loading=w.cargo&&ctx.topCur>.85&&ctx.gateCur<.3&&e<.03&&ctx.level<1;
    const sv=loading?1:0;ctx.spoutCur=reduce?sv:ctx.spoutCur+(sv-ctx.spoutCur)*Math.min(1,dt*2.5);
    const spY=ctx.yHatch+.35+2.6*(1-ctx.spoutCur);
    for(const g of ctx.spouts){g.visible=ctx.spoutCur>.02&&e<.03;g.position.y=spY;g.scale.y=1+.4*(1-ctx.spoutCur);}
    const lvlY=.62+(4.4-.62)*ctx.level;
    if(loading&&ctx.spoutCur>.9){
      ctx.level=Math.min(1,ctx.level+dt*.075);
      const n=Math.ceil(dt*700);
      for(let i=0;i<n;i++){const x=HHX[i%4];spawnP(x+(Math.random()-.5)*.22,spY-.02,(Math.random()-.5)*.22,(Math.random()-.5)*.25,-1.2-Math.random()*.8,(Math.random()-.5)*.25,lvlY);}
    }
    ctx.clip.constant=lvlY;
    ctx.cargo.visible=w.cargo&&e<.03&&ctx.level>.002;
    return unloading||loading;
  },
  applyStep(s,w,ctx){w.cargo=!!s.cargo;w.top=!!s.top;w.gate=!!s.gate;if(w.cargo&&!s.load)ctx.level=1;if(s.load)ctx.level=0;if(s.unload)this.action('unload',w,ctx);},
  onCargo(w,ctx){if(ctx.level<=0)ctx.level=1;},
  action(name,w,ctx){
    clearTimeout(actTimer);

    else if(name==='load'){w.gate=false;w.cargo=true;w.top=true;ctx.level=0;setExplode(0);state.xray=true;applyVisual();}
    else{if(ctx.level<=0)ctx.level=1;w.cargo=true;w.gate=false;setExplode(0);actTimer=setTimeout(()=>{w.gate=true;renderCtrl();},1100);}
    renderCtrl();
  }
};

    container:{sys:'cargo',name:'Контейнеры 20 футов',what:'Два двадцатифутовых контейнера стоят на платформе один за другим.',fact:'Двадцатифутовый контейнер длиной около 6 м — поэтому на универсальную платформу помещаются два.'},

  },BOGIE_P,COUPLER_P,BRAKE_P,{

  init(){return PL_VAR==='ws'?{cargo:true,boards:false}:PL_VAR==='sheet'?{cargo:true,tilt:true}:{cargo:true};},
  build(root){
    const wood=PL_VAR==='wood',cont=PL_VAR==='cont',ws=PL_VAR==='ws',sheet=PL_VAR==='sheet';
    const ctx={bCur:0,loadT:99,loading:false,sides:[],ends:[],items:[]};
    const frameN=node(root,e=>[0,1.2*st(e,0,.4),0]);
    const deckN=node(frameN,e=>[0,.9*st(e,.3,.65),0]);
    const F=frameN;
    /* fish-belly sills */
    const cs=new THREE.ExtrudeGeometry(fishShape(6.74,1.22,.96,.55,2.6,3.9),{depth:.42,bevelEnabled:false});cs.translate(0,0,-.21);
    add(F,cs,C.DFR,'center_sill');
    const ss=new THREE.ExtrudeGeometry(fishShape(6.74,1.22,.98,.72,2.6,3.9),{depth:.14,bevelEnabled:false});ss.translate(0,0,-.07);
    [1,-1].forEach(s=>add(F,ss,C.DFR,'side_sill',0,0,s*1.40));
    [1,-1].forEach(s=>{
      add(F,Bx(.44,.26,2.8),C.DFR,'body_bolster',s*PL_BOG,1.09,0);
      add(F,Cy(.17,.17,.08,24),C.STEEL,'center_plate',s*PL_BOG,.92,0,{r:.4,m:.6});
      add(F,Bx(.24,.28,2.94),C.DFR,'end_sill',s*6.62,1.08,0);
    });
    [-3.2,-1.7,0,1.7,3.2].forEach(x=>add(F,Bx(.14,.22,2.7),C.DFR,'cross_bearer',x,1.1,0));
    if(!sheet)STAKE_X.forEach(x=>[1,-1].forEach(s=>{add(F,Bx(.16,.22,.08),C.DFR,'stake_pocket',x,1.07,s*1.51);add(F,Bx(.16,.04,.12),C.DFR,'stake_pocket',x,1.18,s*1.49);}));
    [1,-1].forEach(ex=>[1,-1].forEach(s=>{
      [.86,.58].forEach(y=>add(F,Bx(.3,.04,.22),C.DFR,'ladder',ex*6.62,y,s*1.3));
      [6.54,6.7].forEach(x=>add(F,Cy(.016,.016,.46,6),C.DFR,'ladder',ex*x,.79,s*1.3));
      add(F,Cy(.018,.018,.42,8),C.DFR,'ladder',ex*6.8,1.12,s*1.1,{rx:PI/2});
      [.92,1.28].forEach(z=>add(F,Bx(.08,.03,.03),C.DFR,'ladder',ex*6.77,1.12,s*z));
    }));
    /* hand brake */
    add(F,Bx(.3,.12,.26),C.DFR,'hand_brake',-6.3,1.0,1.5);
    add(F,Cy(.035,.035,.24,10),C.CAST2,'hand_brake',-6.3,.98,1.66,{rx:PI/2});
    add(F,new THREE.TorusGeometry(.24,.028,10,36),PL.RED,'hand_brake',-6.3,.98,1.78);
    [0,1,2].forEach(k=>add(F,Cy(.016,.016,.48,6),PL.RED,'hand_brake',-6.3,.98,1.78,{rz:k*PI/3}));
    add(F,Cy(.05,.05,.06,12),PL.RED,'hand_brake',-6.3,.98,1.78,{rx:PI/2});
    /* floor */
    if(!sheet){const fl=add(deckN,Bx(13.1,.08,2.78),0xffffff,'floor',0,PL_FL-.04,0);
    fl.material.map=woodTexture();fl.material.roughness=.9;fl.material.metalness=0;}
    if(ws){
      [1,-1].forEach(s=>{
        [-4.875,-1.625,1.625,4.875].forEach(xc=>{
          const pv=group(deckN,xc,PL_FL-.01,s*1.45);ctx.sides.push({g:pv,s});
          add(pv,Bx(3.2,.5,.04),PL.B,'side_board',0,.25,0);
          add(pv,Bx(3.2,.06,.09),PL.B2,'side_board',0,.5,s*.02);
          add(pv,Bx(3.2,.06,.07),PL.B2,'side_board',0,.03,s*.02);
          [-1.2,-.4,.4,1.2].forEach(x=>add(pv,Bx(.07,.44,.06),PL.B2,'side_board',x,.26,s*.04));
          [-1.47,1.47].forEach(x=>{add(pv,Bx(.12,.22,.07),PL.B2,'board_lock',x,.36,s*.06);add(pv,Bx(.04,.12,.1),C.CAST2,'board_lock',x,.18,s*.08);});
          [-1.2,0,1.2].forEach(x=>add(pv,Cy(.03,.03,.16,10),C.CAST2,'side_board',x,0,s*.02,{rz:PI/2}));
        });
        const pe=group(deckN,s*6.56,PL_FL-.01,0);ctx.ends.push({g:pe,s});
        add(pe,Bx(.04,.4,2.78),PL.B,'end_board',0,.2,0);
        add(pe,Bx(.08,.06,2.78),PL.B2,'end_board',s*.02,.4,0);
        [-1,0,1].forEach(z=>add(pe,Bx(.06,.36,.07),PL.B2,'end_board',s*.04,.2,z));
        [-1.3,1.3].forEach(z=>add(pe,Bx(.07,.18,.12),PL.B2,'board_lock',s*.06,.3,z));
      });
    }
    /* bogies, couplers, brake */
    const bp=bogie(root,PL_BOG);bogie(root,-PL_BOG);
    const cN=couplers(F,PL_H);
    const br=node(F,e=>[0,0,-2.4*st(e,.45,.85)]);
    add(br,Cy(.03,.03,13.4,10),C.PIPE,'brake_pipe',0,.9,.34,{rz:PI/2,m:.5});
    endHoses(br,'end_cock',6.8,.34,1);
    add(br,Cy(.18,.18,.5,24),C.BRK,'brake_cylinder',1.2,.78,-.75,{rz:PI/2});
    add(br,Cy(.05,.05,.3,10),C.STEEL,'brake_cylinder',1.52,.78,-.75,{rz:PI/2});
    add(br,Cy(.2,.2,.9,24),C.BRK,'reservoir',-.85,.76,-.8,{rz:PI/2});
    add(br,Bx(.3,.3,.26),C.BRK,'distributor',.5,.8,-.75);
    add(br,Cy(.018,.018,.42,6),C.PIPE,'distributor',.5,.9,-.45,{rx:PI/2});
    add(br,Cy(.02,.02,7.6,8),C.STEEL,'rigging',0,.7,-.45,{rz:PI/2});
    [3.6,-3.6].forEach(x=>add(br,Bx(.05,.4,.06),C.STEEL,'rigging',x,.72,-.45));
    const cargo=group(deckN,0,0,0);ctx.cargo=cargo;
    const hk=group(root,0,0,0);hk.visible=false;ctx.hook=hk;
    const hm=new THREE.MeshStandardMaterial({color:lin(0xd9a520),roughness:.5,metalness:.4});
    const cm=new THREE.MeshStandardMaterial({color:lin(0x2a2f34),roughness:.6,metalness:.5});
    const line=(a,b)=>{const m=new THREE.Mesh(Cy(.012,.012,1,5),cm);seg(m,a,b);hk.add(m);};
    let eqAnchor=null;
    if(ws){
      /* wheelsets across the deck */
      const yc=PL_FL+R;
      WS_X.forEach((x,i)=>{
        const g=group(cargo,x,0,0);
        add(g,Cy(.085,.085,2.24,16),C.STEEL,'ws_load',0,yc,0,{rx:PI/2,r:.4,m:.6});
        [1,-1].forEach(s=>{
          add(g,Cy(R,R,.13,40),C.WHEEL,'ws_load',0,yc,s*.785,{rx:PI/2,r:.32,m:.75});
          add(g,Cy(R+.028,R+.028,.03,40),C.WHEEL,'ws_load',0,yc,s*.735,{rx:PI/2,r:.32,m:.75});
          add(g,Cy(.2,.2,.16,24),C.HUB,'ws_load',0,yc,s*.81,{rx:PI/2});
          add(g,Cy(.13,.13,.22,20),C.CAST2,'ws_load',0,yc,s*1.02,{rx:PI/2});
          add(g,Bx(.3,.08,.2),C.CAST2,'ws_load',0,yc+.17,s*1.02);
        });
        const ch=group(cargo,0,0,0);
        const mids=[];if(i<WS_N-1)mids.push(x+WS_DX/2);if(i===0)mids.push(x-.66);if(i===WS_N-1)mids.push(x+.66);
        mids.forEach(mx=>[1,-1].forEach(s=>add(ch,Bx(.34,.11,.16),PL.WOOD,'chock',mx,PL_FL+.055,s*.785,{r:.9,m:0})));
        if(i===0||i===WS_N-1){const dir=i===0?-1:1;[1,-1].forEach(s=>{const m=add(ch,Cy(.012,.012,1,5),C.STEEL,'tie');seg(m,new V3(x,yc,s*1.13),new V3(x+dir*.75,PL_FL+.02,s*1.32));});}
        ctx.items.push({obj:g,by:0,hx:x,top:yc,after:ch});
      });
      const sp=new THREE.Mesh(Bx(.12,.12,2.5),hm);sp.position.y=.75;hk.add(sp);
      [1,-1].forEach(s=>{line(new V3(0,0,s*1.02),new V3(0,.75,s*1.02));line(new V3(0,.75,s*1.2),new V3(0,1.45,0));});
      const blk=new THREE.Mesh(Bx(.22,.3,.22),hm);blk.position.y=1.5;hk.add(blk);
    }else if(wood){
      /* stakes, stake ties and lattice end walls */
      const stN={},ewN={};
      [1,-1].forEach(s=>{stN[s]=node(deckN,e=>[0,.4*st(e,.4,.75),s*.8*st(e,.4,.75)]);ewN[s]=node(deckN,e=>[s*.9*st(e,.4,.75),.4*st(e,.4,.75),0]);});
      const yTop=3.45;
      STAKE_X.forEach(x=>[1,-1].forEach(s=>{
        add(stN[s],Bx(.13,yTop-1.0,.11),PL.EQ,'stake',x,(yTop+1.0)/2,s*1.51);
        add(stN[s],Bx(.17,.06,.15),PL.EQ2,'stake',x,yTop,s*1.51);
        add(stN[s],Bx(.03,.5,.14),PL.EQ2,'stake',x,PL_FL+.25,s*1.47);
      }));

  }
};

  flowAt(t){
    const B=0x5fd4ff,O=0xffa040,G=0xc9d1d8;

    if(t<5.5)return [1,{MAG:[-1,B]}];

  },
  anim(ctx,dt,e,w){

    {const on=e<.02;ctx.arrow.visible=on;let hid=!on;
     if(on){ctx.arrowTip.getWorldPosition(tmpV);tmpV.project(camera);hid=tmpV.z>1||Math.abs(tmpV.x)>1||Math.abs(tmpV.y)>1;
       if(!hid)locoTag.style.transform=`translate(${((tmpV.x+1)/2*viewport.clientWidth).toFixed(1)}px,${((1-tmpV.y)/2*viewport.clientHeight).toFixed(1)}px) translate(-50%,-150%)`;}
     const txt=tr('← к локомотиву');if(locoTag.textContent!==txt)locoTag.textContent=txt;locoTag.hidden=hid;}

      if(!reduce||ctx.st<ctx.stop)ctx.st+=dt;
      if(ctx.st>=ctx.stop){if(ctx.loop)ctx.st=3;else ctx.st=ctx.stop-1e-3;}

      const wb=b>.5;if(w.brake!==wb){w.brake=wb;renderCtrl();}
      const [ph,act]=this.flowAt(t),hold=!ctx.loop&&ctx.st>=ctx.stop-2e-3;
      for(const k in ctx.flows){const F=ctx.flows[k],a=(e<.02&&!hold)?act[k]:null;
        if(!a){F.ds.forEach(m=>m.visible=false);continue;}
        F.mat.color.setHex(a[1]);const n=F.ds.length,sp=1.7/F.len;
        F.ds.forEach((m,i)=>{let u=((ctx.t*sp*a[0]+i/n)%1+1)%1;F.c.getPointAt(u,m.position);m.visible=true;});}

  },

          add(g,Bx(2*d.body,.22,.04),TRN.STRIPE,P,0,1.62,s*1.52,{r:.5});});
        add(g,Bx(1.2,.5,1.1),0x3a4148,P,4,4.1,0);
        add(g,Cy(.32,.32,.5,20),0x3a4148,P,5.6,4.1,0);

      }else{

        add(g,Bx(2*d.body,.3,2.9),0x3a3f44,P,0,1.18,0);
        add(g,Bx(2*d.body,2.15,3.12),TRN.CAR,P,0,2.4,0,{r:.7,m:.2});
        add(g,Bx(2*d.body+.04,.12,3.18),TRN.CAR2,P,0,3.5,0);
        [1,-1].forEach(s=>{for(let k=-5;k<=5;k++)add(g,Bx(.12,2.1,.07),TRN.CAR2,P,k*1.15,2.4,s*1.59);});
        add(g,Bx(2*d.body-.3,.25,2.9),0x2b2b2b,P,0,3.36,0,{r:1});
      }
      /* couplers at both ends */
      [-1,1].forEach(s=>{add(g,Bx(.6,.2,.22),TRN.COUP,'train_coupler',s*(d.half-.3),1.06,0,MET);add(g,Bx(.25,.34,.4),TRN.COUP,'train_coupler',s*(d.half-.12),1.06,0,MET);});
      /* brake pipe (moved to the side for clarity) and cylinder */
      V.pipe=add(g,Cy(.055,.055,2*d.half-.3,12),TRN.PIPE,'train_pipe',0,1.0,1.68,{rz:PI/2,r:.4,m:.3});
      V.cyl=add(g,Cy(.2,.2,.55,24),TRN.CYL,'train_cyl',1.4,.78,1.5,{rz:PI/2,r:.5,m:.3});
      add(g,Cy(.03,.03,.5,8),0x9aa3aa,'train_cyl',1.4,.92,1.62);

    for(let j=0;j<ctx.veh.length-1;j++){

        flash:new THREE.Mesh(new THREE.SphereGeometry(.45,18,12),new THREE.MeshBasicMaterial({color:0xffd27a,transparent:true,opacity:.0,toneMapped:false,depthWrite:false})),fl:0,max:0};
      J.flash.visible=false;root.add(J.flash);ctx.junc.push(J);

    ctx.wave=new THREE.Mesh(new THREE.SphereGeometry(.22,18,12),new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false}));ctx.wave.visible=false;root.add(ctx.wave);
    ctx.reset=()=>{ctx.u=ctx.veh.map(()=>0);ctx.v=ctx.veh.map(()=>TN_V0);ctx.e=ctx.junc.map(()=>TN_G);ctx.st=-1.6;ctx.phase='run';ctx.preT=null;ctx.dist=ctx.dist||0;ctx.stopT=0;
      ctx.junc.forEach(J=>{J.fl=0;J.max=0;J.hit=0;});};
    ctx.reset();
