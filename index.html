e bulkheads stand at the ends of the car. In shocks and braking the logs tend to slide along the car by inertia — the bulkhead takes that blow. The lattice keeps the load visible and is lighter than solid plate.", "Погрузка леса": "Loading timber", "Брёвна грузят краном пачками: каждую пачку обвязывают двумя стропами и опускают между стойками. Слои кладут поочерёдно в оба штабеля, чтобы платформа нагружалась равномерно.": "Logs are loaded by crane in bundles: each bundle is slung with two slings and lowered between the stakes. Layers are placed alternately in both piles so the car is loaded evenly.", "Штабель": "Stack", "Штабель брёвен": "Log stack", "Брёвна кладут вдоль платформы, плотно, комлями в разные стороны — так штабель получается ровным по высоте. Верх штабеля не должен выходить выше стоек и за габарит погрузки.": "Logs are laid lengthwise, tightly, with butts alternating — this keeps the stack level. The top of the stack must not rise above the stakes or beyond the loading gauge.", "Платформа с контейнерами": "Container flat car", "Универсальную платформу используют и для контейнеров: на ней помещаются два двадцатифутовых контейнера. Каждый стоит на фитинговых упорах — по одному под каждым углом.": "The general-purpose flat car is also used for containers: it takes two twenty-foot containers. Each sits on fitting stops — one under each corner.", "Упоры": "Stops", "Фитинговые упоры": "Fitting stops", "Под углами контейнеров на платформе стоят упоры со штырями. Штыри входят в нижние угловые фитинги контейнера и не дают ему сдвинуться ни вдоль, ни поперёк вагона. На модели средние упоры держат сразу оба контейнера.": "Under the container corners the car has stops with spigots. The spigots enter the container's bottom corner fittings and stop it moving along or across the car. On the model, the middle stops hold both containers at once.", "Погрузка контейнеров": "Loading containers", "Контейнер поднимают спредером — рамой с поворотными замками, которые входят в верхние фитинги. Его опускают точно на упоры, чтобы штыри вошли в нижние фитинги.": "A container is lifted by a spreader — a frame with twistlocks that engage the top fittings. It is lowered exactly onto the stops so the spigots enter the bottom fittings.", "Контейнеры": "Containers", "Контейнеры и фитинги": "Containers and fittings", "По углам каждого контейнера — литые фитинги с овальными отверстиями. Они одинаковы у всех стандартных контейнеров, поэтому контейнер переставляют с судна на поезд и на автомобиль, не трогая груз. Два контейнера ставят дверями друг к другу: так двери нельзя открыть в пути.": "At each corner of a container is a cast fitting with oval holes. They are the same on all standard containers, so a container moves from ship to train to truck without touching the cargo. The two containers are placed doors facing each other: then the doors can't be opened in transit.", "Платформа": "Flat car", "Колёсные пары": "Wheelsets", "Лес": "Timber", "Универсальная платформа с двумя двадцатифутовыми контейнерами на фитинговых упорах.": "General-purpose flat car with two twenty-foot containers on fitting stops.", "Универсальная платформа, оборудованная для леса: стойки по бокам, решётчатые стены на концах, брёвна в два штабеля.": "General-purpose flat car equipped for timber: stakes along the sides, lattice bulkheads at the ends, logs in two stacks.", "Вагон без кузова: открытый деревянный пол и невысокие откидные борта. Возит тяжёлые и длинные грузы. Здесь груз — колёсные пары.": "A car without a body: an open wooden deck and low drop sides. Carries heavy and long loads. Here the load is wheelsets.", "Упрощённая модель: показывает общее устройство универсальной платформы, без точных размеров.": "Simplified model: shows the general design of a general-purpose flat car, without exact dimensions.", "У платформы нет кузова, поэтому всю нагрузку от груза несёт рама: хребтовая, боковые, шкворневые, поперечные и концевые балки.": "A flat car has no body, so the frame carries the whole load: centre, side, bolster, cross and end beams.", "Деревянный настил пола и откидные борта — продольные и торцевые — с запорами.": "Wooden deck planking and drop sides — longitudinal and end — with locks.", "Упоры для контейнеров": "Container stops", "Фитинговые упоры со штырями под углами контейнеров.": "Fitting stops with spigots under the container corners.", "Стойки и торцевые стены": "Stakes and end bulkheads", "Съёмное оборудование для леса: стойки в стоечных скобах, стяжки и решётчатые торцевые стены.": "Removable timber equipment: stakes in the stake pockets, ties and lattice end bulkheads.", "Груз и крепление": "Load and securing", "Груз на платформе и детали его крепления.": "The load on the car and the parts that secure it.", "Главная продольная балка рамы. В середине она выше, к концам ниже — такую форму называют рыбообразной.": "The main longitudinal beam of the frame. It is deeper in the middle and shallower at the ends — this is called a fish-belly shape.", "Сильнее всего рама изгибается посередине между тележками, поэтому там балку делают выше.": "The frame bends most in the middle between the bogies, so the beam is made deeper there.", "Боковые балки": "Side sills", "Продольные балки по краям рамы, тоже рыбообразные. На них закреплены шарниры бортов и стоечные скобы.": "Longitudinal beams along the edges of the frame, also fish-belly shaped. The side hinges and stake pockets are mounted on them.", "У платформы нет стен, которые помогали бы раме, как у полувагона: весь груз держат балки рамы.": "A flat car has no walls to help the frame, as a gondola does: the frame beams carry all the load.", "Поперечные балки над тележками. Передают вес рамы и груза на тележки через пятники.": "Cross beams above the bogies. They transfer the weight of the frame and load to the bogies through the centre plates.", "Связывают хребтовую балку с боковыми и держат настил пола.": "They connect the centre sill to the side sills and support the deck.", "Поперечные балки заставляют три продольные балки работать вместе, как одно целое.": "Cross bearers make the three longitudinal beams work together as one.", "Концевые балки": "End sills", "Замыкают раму с торцов. На них ударные розетки автосцепок, кронштейны расцепного привода и поручни.": "Close the frame at the ends. They carry the coupler strikers, uncoupling lever brackets and grab irons.", "Стоечные скобы": "Stake pockets", "Гнёзда на боковых балках. В них вставляют стойки, когда везут лес, трубы или прокат.": "Sockets on the side sills. Stakes are inserted in them when carrying timber, pipe or rolled steel.", "Стоечные скобы есть на каждой универсальной платформе, поэтому её можно быстро переоборудовать под лес.": "Every general-purpose flat car has stake pockets, so it can quickly be converted for timber.", "Подножки под углами рамы и поручни на концевых балках — для составителей при манёврах.": "Steps under the frame corners and grab irons on the end sills — for shunters during switching.", "Деревянный настил пола": "Wooden deck", "Доски, уложенные поперёк на балки рамы. На пол ставят груз.": "Planks laid crosswise on the frame beams. The load is placed on the deck.", "Пол деревянный не случайно: к нему прибивают гвоздями бруски и подкладки, которыми крепят груз.": "The deck is wooden for a reason: the blocks and packing that secure the load are nailed to it.", "Невысокие стальные борта по бокам пола, на шарнирах снизу. Если груз шире пола, борта опускают вниз вдоль рамы.": "Low steel sides along the deck, hinged at the bottom. If the load is wider than the deck, the sides are dropped down along the frame.", "В опущенном положении борта упираются в стоечные скобы и не раскачиваются в пути.": "When dropped, the sides rest against the stake pockets and don't swing in transit.", "Торцевые борта": "End boards", "Борта на концах платформы. Откидываются наружу и ложатся горизонтально.": "Boards at the ends of the car. They fold outwards and lie flat.", "Откинутые торцевые борта служат переездными мостиками: по ним техника переезжает с платформы на платформу через весь состав.": "Folded end boards act as bridge plates: vehicles drive from car to car along the whole train over them.", "Запоры бортов": "Side locks", "Держат борта в поднятом положении.": "Hold the sides in the raised position.", "Перед отправкой проверяют, что все запоры закрыты: открывшийся в пути борт может задеть встречный поезд или сооружения у пути.": "Before departure all locks are checked: a side opening in transit can hit an oncoming train or lineside structures.", "Вертикальные стойки, вставленные в стоечные скобы по обеим сторонам платформы. Удерживают брёвна от раскатывания в стороны.": "Vertical stakes inserted in the stake pockets on both sides of the car. They stop logs rolling off sideways.", "Брёвна укладывают не выше верха стоек: иначе верхний ряд может скатиться через них.": "Logs are stacked no higher than the top of the stakes: otherwise the top row may roll over them.", "Стяжки стоек": "Stake ties", "Проволочные стяжки между верхушками противоположных стоек, поверх штабеля.": "Wire ties between the tops of opposite stakes, over the stack.", "Под давлением брёвен стойки стремятся разойтись в стороны; стяжка держит их вместе.": "Under the pressure of the logs the stakes tend to spread apart; the tie holds them together.", "Решётчатые стены на концах платформы. Не дают брёвнам сдвинуться вдоль вагона при толчках и торможении.": "Lattice bulkheads at the ends of the car. They stop logs sliding along the car in shocks and braking.", "При резком торможении груз по инерции стремится вперёд — торцевая стена принимает этот удар на себя.": "In hard braking the load tends to move forward by inertia — the end bulkhead takes that blow.", "Колёсные пары (груз)": "Wheelsets (load)", "Частый груз платформ: колёсные пары везут в ремонт и из ремонта. Их ставят поперёк платформы, вплотную друг к другу, колёсами на пол.": "A common flat car load: wheelsets travel to and from repair. They are placed across the car, tight against each other, wheels on the deck.", "Колёсная пара стоит на колёсах и легко катится, поэтому главное в креплении — не дать ей сдвинуться вдоль вагона.": "A wheelset stands on its wheels and rolls easily, so the key to securing it is to stop it moving along the car.", "Упорные бруски": "Chocks", "Деревянные бруски, прибитые к полу между колёсами и у крайних колёс. Не дают колёсным парам покатиться при толчках.": "Wooden blocks nailed to the deck between the wheels and at the end wheels. They stop the wheelsets rolling in shocks.", "Сколько брусков и гвоздей нужно, задают технические условия размещения и крепления грузов.": "How many chocks and nails are needed is set by the technical rules for loading and securing cargo.", "Растяжки": "Lashings", "Проволочные растяжки от осей крайних колёсных пар к раме. Дополнительно держат всю группу груза.": "Wire lashings from the axles of the end wheelsets to the frame. They additionally hold the whole group.", "Растяжка работает только на растяжение, поэтому их ставят парами в противоположные стороны.": "A lashing only works in tension, so they are fitted in pairs pulling in opposite directions.", "Контейнеры 20 футов": "20 ft containers", "Два двадцатифутовых контейнера стоят на платформе один за другим.": "Two twenty-foot containers stand on the car one behind the other.", "Двадцатифутовый контейнер длиной около 6 м — поэтому на универсальную платформу помещаются два.": "A twenty-foot container is about 6 m long — that's why two fit on a general-purpose flat car.", "Угловые фитинги": "Corner fittings", "Литые коробки по углам контейнера с овальными отверстиями. За верхние контейнер поднимают, нижними ставят на упоры платформы.": "Cast boxes with oval holes at the container corners. The container is lifted by the top ones and set onto the car's stops by the bottom ones.", "Фитинги одинаковы у всех стандартных контейнеров мира, поэтому контейнер перегружают с судна на поезд и на автомобиль, не трогая груз.": "Fittings are the same on every standard container in the world, so a container is transferred from ship to train to truck without touching the cargo.", "Двери контейнера": "Container doors", "Двустворчатые двери в торце контейнера с запорными штангами.": "Double doors at the end of the container with locking bars.", "Два контейнера на платформе ставят дверями друг к другу: так двери нельзя открыть в пути.": "The two containers are placed doors facing each other: then the doors can't be opened in transit.", "Упоры под углами контейнеров. Их штыри входят в нижние фитинги и не дают контейнеру сдвинуться.": "Stops under the container corners. Their spigots enter the bottom fittings and stop the container from moving.", "Контейнер держится на платформе своим весом и штырями упоров — дополнительная увязка ему не нужна.": "A container stays on the car by its own weight and the spigots — it needs no extra lashing.", "Брёвна (круглый лес)": "Logs (roundwood)", "Брёвна уложены вдоль платформы в два штабеля, между стойками и торцевыми стенами.": "Logs are laid lengthwise in two stacks, between the stakes and the end bulkheads.", "Брёвна кладут комлями в разные стороны, чтобы штабель был ровным по высоте.": "Logs are laid with butts alternating so the stack is level in height.", "Штурвал на углу рамы, у тележки. Через винт и рычаги прижимает колодки без сжатого воздуха.": "A wheel at the corner of the frame, by the bogie. Through a screw and levers it applies the brake shoes without compressed air.", "Стояночный тормоз удерживает платформу во время погрузки, когда локомотив отцеплен.": "The hand brake holds the flat car during loading when the locomotive is uncoupled.", "Листы": "Sheets", "Рама повёрнута": "Frame raised", "Цистерна": "Tank car", "Вагон с котлом для бензина, дизельного топлива и других светлых нефтепродуктов. Наливают сверху через люк-лаз, сливают снизу через сливной прибор.": "A car with a tank for petrol, diesel and other light petroleum products. Filled from the top through the manhole, discharged from the bottom through the bottom outlet valve.", "Упрощённая модель: показывает общее устройство цистерны для нефтепродуктов, без точных размеров.": "Simplified model: shows the general design of a petroleum tank car, without exact dimensions.", "Котёл": "Tank", "Цилиндрическая обечайка с двумя выпуклыми днищами, внутренняя лестница и надписи на котле.": "Cylindrical shell with two dished heads, an internal ladder and markings on the tank.", "Верх котла": "Tank top", "Люк-лаз, предохранительно-впускной клапан, площадка с ограждением и наружные лестницы.": "Manhole, pressure-vacuum relief valve, platform with railings and external ladders.", "Сливной прибор": "Bottom outlet", "Устройство в нижней точке котла: корпус с клапаном, сливной патрубок с крышкой и штанга управления клапаном.": "A device at the lowest point of the tank: a body with a valve, an outlet pipe with a cap and a valve operating rod.", "Рама и крепление котла": "Frame and tank mounting", "Рама, лежни, на которых лежит котёл, стяжные хомуты и средние опоры.": "Frame, saddles the tank rests on, tie bands and middle anchors.", "Обечайка котла": "Tank shell", "Цилиндрическая часть котла, сваренная из стальных листов. В ней перевозят жидкий груз.": "The cylindrical part of the tank, welded from steel plates. It carries the liquid cargo.", "Пары бензина создают в котле избыточное давление, поэтому котёл испытывают на прочность и герметичность.": "Petrol vapour builds up pressure in the tank, so the tank is tested for strength and tightness.", "Днища": "Heads", "Выпуклые торцы котла.": "The dished ends of the tank.", "Выпуклое днище держит давление лучше плоского — поэтому плоских торцов у котлов почти не бывает.": "A dished head holds pressure better than a flat one — that's why tanks almost never have flat ends.", "Внутренняя лестница": "Internal ladder", "Лестница от люка-лаза до дна котла — для осмотра, очистки и ремонта.": "A ladder from the manhole to the bottom of the tank — for inspection, cleaning and repair.", "Спускаться в котёл из-под нефтепродуктов можно только после очистки и проверки воздуха: пары бензина ядовиты и взрывоопасны.": "You may enter a tank that carried petroleum only after cleaning and air testing: petrol vapour is toxic and explosive.", "Номер вагона, грузоподъёмность, объём котла, название груза и знаки опасности.": "Car number, load capacity, tank volume, cargo name and hazard signs.", "По надписям и знакам опасности спасатели при аварии сразу понимают, какой груз в цистерне.": "From the markings and hazard signs, rescuers know at once what's in the tank after an accident.", "Люк-лаз": "Manhole", "Горловина с откидной крышкой наверху котла. Через неё наливают груз и проникают внутрь для осмотра.": "An opening with a hinged cover on top of the tank. Cargo is filled through it and people enter it for inspection.", "Крышку прижимают к горловине через уплотнение, чтобы пары груза не выходили наружу.": "The cover is pressed onto the opening over a seal so cargo vapour doesn't escape.", "Предохранительно-впускной клапан": "Pressure-vacuum relief valve", "Выпускает пары, если давление в котле поднялось выше допустимого, и впускает воздух, если в котле возникло разрежение.": "Releases vapour if tank pressure rises above the limit, and lets air in if a vacuum forms in the tank.", "Без впуска воздуха при сливе котёл могло бы смять разрежением, как пустую пластиковую бутылку.": "Without air intake during discharge, the vacuum could crush the tank like an empty plastic bottle.", "Площадка с ограждением": "Platform with railings", "Площадка вокруг люка-лаза. С неё работают при наливе и осмотре.": "A platform around the manhole. Workers stand on it during filling and inspection.", "Ограждение защищает от падения: площадка находится выше четырёх метров над рельсами.": "The railing protects against falls: the platform is more than four metres above the rails.", "Наружные лестницы": "External ladders", "Лестницы по обеим сторонам котла — от низа рамы до площадки.": "Ladders on both sides of the tank — from the bottom of the frame to the platform.", "Верхняя часть лестницы повторяет изгиб котла, чтобы не выходить за габарит вагона.": "The upper part of the ladder follows the curve of the tank so it stays within the loading gauge.", "Корпус сливного прибора": "Bottom outlet body", "Устройство в нижней точке котла. Внутри — клапан, который открывают при сливе.": "A device at the lowest point of the tank. Inside is a valve that is opened for discharge.", "Сливной прибор ставят в самой нижней точке котла, чтобы груз вытекал полностью.": "The bottom outlet is placed at the very lowest point of the tank so all the cargo drains out.", "Сливной патрубок с крышкой": "Outlet pipe with cap", "Патрубок, направленный вниз из корпуса прибора. В пути он закрыт крышкой, при сливе к нему присоединяют трубу установки нижнего слива.": "A pipe pointing down from the valve body. In transit it is closed with a cap; for discharge, the pipe of the bottom unloading rig is connected to it.", "Крышка патрубка — второй барьер на случай, если клапан пропустит груз.": "The outlet cap is a second barrier in case the valve leaks.", "Штанга клапана": "Valve rod", "Штанга внутри котла соединяет клапан сливного прибора с рукояткой у люка-лаза: клапан открывают сверху.": "A rod inside the tank links the bottom outlet valve to a handle at the manhole: the valve is opened from the top.", "Пока клапан закрыт, груз не выйдет, даже если снять крышки патрубков.": "While the valve is closed, no cargo comes out, even with the outlet caps removed.", "Главная продольная балка рамы из двух швеллеров. Через неё от автосцепки передаются силы тяги и удара.": "The main longitudinal beam of the frame, made of two channels. Pulling and buffing forces from the coupler pass through it.", "Между швеллерами проходит сливной патрубок, а на концах внутри балки стоят поглощающие аппараты.": "The outlet pipe passes between the channels, and the draft gears sit inside the beam at the ends.", "Продольные балки": "Side sills", "Балки по краям рамы. На них крепятся кронштейны стяжных хомутов и подножки.": "Beams along the edges of the frame. The tie band brackets and steps are mounted on them.", "Рама цистерны легче, чем у полувагона: основную продольную нагрузку несёт хребтовая балка.": "A tank car frame is lighter than a gondola's: the centre sill carries the main longitudinal load.", "Поперечные балки над тележками. Передают вес котла и груза на тележки через пятники.": "Cross beams above the bogies. They transfer the weight of the tank and cargo to the bogies through the centre plates.", "Лежни": "Saddles", "Опоры на шкворневых балках с выемкой по форме котла. На них котёл лежит концевыми частями.": "Supports on the body bolsters, shaped to fit the tank. The tank rests on them at its ends.", "Между лежнем и котлом кладут деревянные прокладки, чтобы котёл не тёрся о металл.": "Wooden pads are placed between the saddle and the tank so the tank doesn't rub against metal.", "Стяжные хомуты": "Tie bands", "Стальные ленты, охватывающие котёл сверху. Притягивают его к лежням и раме.": "Steel straps going over the tank. They pull it down onto the saddles and the frame.", "Хомуты не дают котлу подняться или сместиться поперёк вагона.": "The bands stop the tank lifting or shifting across the car.", "Средние опоры": "Middle anchors", "Опоры в средней части, которыми котёл закреплён на хребтовой балке.": "Supports in the middle that fix the tank to the centre sill.", "Средние опоры не дают котлу сдвинуться вдоль рамы при толчках и торможении.": "The middle anchors stop the tank sliding along the frame in shocks and braking.", "Поручни и подножки нельзя загораживать или снимать — это требование безопасности.": "Grab irons and steps must not be blocked or removed — this is a safety requirement.", "Штурвал на боковой балке в середине рамы. Через винт и рычаги прижимает тормозные колодки без сжатого воздуха.": "A wheel on the side sill in the middle of the frame. Through a screw and levers it applies the brake shoes without compressed air.", "Стояночный тормоз удерживает цистерну на эстакаде во время налива и слива, когда локомотив отцеплен.": "The hand brake holds the tank car on the rack during filling and discharge when the locomotive is uncoupled.", "Цистерна: общий вид": "Tank car: overview", "Цистерна для нефтепродуктов — вагон с цилиндрическим котлом на раме. Груз наливают сверху через люк-лаз, а сливают снизу через сливной прибор. Нажмите на узел, чтобы рассмотреть его отдельно.": "A petroleum tank car is a cylindrical tank on a frame. Cargo is filled from the top through the manhole and discharged from the bottom through the bottom outlet. Tap an assembly to look at it separately.", "Котёл сварен из цилиндрической обечайки и двух выпуклых днищ. Выпуклая форма лучше держит давление паров груза. Внутри от люка-лаза до дна идёт лестница — для осмотра и очистки.": "The tank is welded from a cylindrical shell and two dished heads. The rounded shape holds vapour pressure better. Inside, a ladder runs from the manhole to the bottom — for inspection and cleaning.", "Крепление котла": "Tank mounting", "Как котёл держится на раме": "How the tank is held on the frame", "Концами котёл лежит на лежнях — опорах с выемкой по его форме — и притянут к ним стяжными хомутами. В средней части котёл закреплён на хребтовой балке средними опорами: они не дают ему сдвинуться вдоль рамы.": "At its ends the tank rests on saddles — supports shaped to fit it — and is pulled down onto them by tie bands. In the middle the tank is fixed to the centre sill by middle anchors: they stop it sliding along the frame.", "Люк-лаз и клапан": "Manhole and valve", "Наверху — люк-лаз с откидной крышкой: через него наливают груз. Рядом предохранительно-впускной клапан: выпускает пары при избыточном давлении и впускает воздух при разрежении. Вокруг люка — площадка с ограждением, к ней с обеих сторон ведут лестницы.": "On top is the manhole with a hinged cover: cargo is filled through it. Next to it is the pressure-vacuum relief valve: it releases vapour at overpressure and lets air in under vacuum. Around the manhole is a platform with railings, reached by ladders from both sides.", "В нижней точке котла стоит сливной прибор. Его клапан открывают штангой сверху, от люка-лаза. Снизу у прибора сливной патрубок, в пути закрытый крышкой. Патрубок проходит между швеллерами хребтовой балки.": "At the lowest point of the tank is the bottom outlet. Its valve is opened by a rod from above, at the manhole. Below the outlet is the discharge pipe, closed with a cap in transit. The pipe passes between the channels of the centre sill.", "Котёл поднят, чтобы показать раму: хребтовую балку, продольные, шкворневые и концевые балки. На шкворневых балках стоят лежни, в середине — средние опоры котла.": "The tank is lifted to show the frame: centre sill, side sills, body bolsters and end sills. The saddles sit on the bolsters, and the middle anchors are in the centre.", "Автосцепка СА-3, поглощающий аппарат и расцепной привод — такие же, как у других грузовых вагонов.": "The SA-3 coupler, draft gear and uncoupling lever are the same as on other freight cars.", "Автоматический пневматический тормоз устроен как у других грузовых вагонов; оборудование выдвинуто в сторону. Штурвал стояночного тормоза стоит на боковой балке в середине рамы.": "The automatic air brake works as on other freight cars; the equipment is moved aside. The hand brake wheel is on the side sill in the middle of the frame.", "Налив": "Filling", "Налить заново": "Fill again", "Налив через люк-лаз": "Top filling through the manhole", "Цистерну ставят под наливную эстакаду, открывают крышку люка-лаза и опускают в котёл наливной стояк. Рентген показывает, как поднимается уровень. Котёл не заливают доверху: оставляют место на тепловое расширение груза.": "The tank car is placed under a loading rack, the manhole cover is opened and a loading arm is lowered into the tank. X-ray shows the level rising. The tank is never filled to the top: room is left for thermal expansion of the cargo.", "Слив": "Discharge", "Слить заново": "Discharge again", "Слив через сливной прибор": "Bottom discharge", "Цистерну ставят на сливную эстакаду. Снимают нижнюю крышку сливного прибора и подводят к нему трубу установки нижнего слива: она поворачивается из приямка сбоку от пути и герметично присоединяется к патрубку. Затем открывают клапан прибора и задвижку установки, поворачивая штурвал до упора, — груз уходит самотёком. Предохранительно-впускной клапан тем временем впускает в котёл воздух.": "The tank car is placed on an unloading rack. The bottom cap of the outlet is removed and the pipe of the bottom unloading rig is brought to it: it swings out of a pit beside the track and connects tightly to the outlet. Then the outlet valve and the rig's gate valve are opened by turning the handwheel all the way — the cargo drains by gravity. Meanwhile the relief valve lets air into the tank.", "Груз": "Cargo", "Люк открыт": "Manhole open", "Слив снизу": "Bottom discharge", "Крытый вагон": "Boxcar", "Вагон с закрытым кузовом для грузов, которые нужно беречь от погоды и хищений. Грузят через широкие раздвижные двери в боковых стенах.": "A car with an enclosed body for cargo that must be protected from weather and theft. Loaded through wide sliding doors in the side walls.", "Упрощённая модель: показывает общее устройство крытого вагона, без точных размеров.": "Simplified model: shows the general design of a boxcar, without exact dimensions.", "Боковые и торцевые стены, стойки, обвязка, дуговая крыша и пол.": "Side and end walls, stanchions, chords, curved roof and floor.", "Двери": "Doors", "Двустворчатые раздвижные двери, их направляющие и запоры.": "Double sliding doors, their tracks and locks.", "Хребтовая балка, нижняя обвязка, шкворневые, поперечные и концевые балки.": "Centre sill, side sills, body bolsters, cross bearers and end sills.", "Груз и размещение": "Cargo and stowage", "Поддоны с грузом и дверные заграждения.": "Pallets of cargo and door guards.", "Боковые стены": "Side walls", "Обшивка из стальных листов с горизонтальными выштамповками.": "Steel sheet panels with horizontal pressed ribs.", "Выштамповки делают тонкий лист жёстким без лишней массы.": "Pressed ribs make thin sheet stiff without adding weight.", "Вертикальные профили снаружи боковых стен. Связывают нижнюю и верхнюю обвязку.": "Vertical sections outside the side walls. They tie the bottom and top chords together.", "Стойки ставят снаружи, чтобы внутри стены были гладкими и не мешали укладке груза.": "Stanchions are placed outside so the inside walls stay smooth and don't get in the way of stowing cargo.", "Верхняя обвязка вместе с нижней работает как пояса балки: кузов несёт нагрузку вместе с рамой.": "The top chord works with the bottom one as the flanges of a beam: the body carries the load together with the frame.", "Закрывают кузов с торцов и усилены горизонтальными гофрами.": "Close the body at the ends and are reinforced with horizontal corrugations.", "При резком торможении груз давит на торцевую стену, поэтому её делают особенно прочной.": "In hard braking the cargo pushes against the end wall, so it is made especially strong.", "Дуговая крыша из стальных листов. Защищает груз от дождя и снега.": "A curved roof of steel sheets. It protects the cargo from rain and snow.", "Дуговая форма прочнее плоской, и на ней не скапливаются вода и снег.": "A curved shape is stronger than a flat one, and water and snow don't collect on it.", "Пол": "Floor", "Пол кузова на балках рамы. По нему груз завозят погрузчиком.": "The body floor on the frame beams. Cargo is driven in over it by forklift.", "Пол рассчитан на заезд погрузчика с грузом, поэтому его делают особенно прочным.": "The floor is designed for a loaded forklift to drive on, so it is made especially strong.", "Номер вагона, грузоподъёмность, объём кузова и сведения о ремонтах.": "Car number, load capacity, body volume and repair records.", "Номер крытого вагона на сети колеи 1520 мм начинается с цифры 2.": "A boxcar number on the 1520 mm network starts with 2.", "Створки двери": "Door leaves", "Двустворчатая раздвижная дверь в середине каждой боковой стены. Створки откатываются в стороны вдоль стены.": "A double sliding door in the middle of each side wall. The leaves roll apart along the wall.", "Широкий проём позволяет заезжать в вагон погрузчиком с поддоном.": "The wide opening lets a forklift with a pallet drive into the car.", "Направляющие": "Door tracks", "Верхняя направляющая, по которой катятся ролики створок, и нижняя, которая не даёт створкам отойти от стены.": "The upper track the door rollers run on, and the lower one that keeps the leaves against the wall.", "Двери не распахиваются наружу, а откатываются вдоль стены, поэтому не выходят за габарит вагона.": "The doors don't swing out but roll along the wall, so they stay within the car's clearance.", "Запор двери": "Door lock", "Запор на стыке створок. Закрытую дверь запирают и пломбируют.": "A lock where the leaves meet. The closed door is locked and sealed.", "По целой пломбе на станции назначения видно, что вагон в пути не открывали.": "An intact seal at the destination shows the car was not opened in transit.", "Продольные балки по краям рамы. На них стоят стойки боковых стен и нижние направляющие дверей.": "Longitudinal beams along the edges of the frame. The side wall stanchions and the lower door tracks stand on them.", "Нижняя обвязка — нижний пояс боковой стены: рама и кузов работают вместе.": "The side sill is the bottom chord of the side wall: frame and body work together.", "Расстояние между шкворневыми балками называют базой вагона. Крытый вагон длинный, поэтому и база у него большая.": "The distance between the body bolsters is called the car's base. A boxcar is long, so its base is long too.", "Связывают хребтовую балку с нижней обвязкой и держат пол.": "They connect the centre sill to the side sills and carry the floor.", "Чем чаще поперечные балки, тем больший вес выдерживает пол — например, погрузчик с грузом.": "The closer the cross bearers, the more weight the floor can take — for example a loaded forklift.", "Замыкают раму с торцов. На них ударные розетки автосцепок и кронштейны расцепного привода.": "Close the frame at the ends. They carry the coupler strikers and uncoupling lever brackets.", "Подножки под углами рамы и вертикальные поручни на боковых стенах над ними — для составителей.": "Steps under the frame corners and vertical grab irons on the side walls above them — for shunters.", "Поддоны с грузом": "Pallets of cargo", "Груз на поддонах ставят плотно, рядами от торцевых стен к дверям.": "Palletised cargo is stowed tightly, in rows from the end walls towards the doors.", "Сначала заполняют концы вагона, потом середину: иначе дальние места погрузчиком уже не достать.": "The ends of the car are filled first, then the middle: otherwise the far spots can't be reached by forklift.", "Дверные заграждения": "Door guards", "Доски поперёк дверного проёма изнутри. Не дают грузу навалиться на двери.": "Boards across the door opening on the inside. They stop the cargo leaning on the doors.", "Без заграждения сдвинувшийся груз прижмёт дверь, и её будет трудно открыть на станции назначения.": "Without a guard, shifted cargo would press against the door and it would be hard to open at the destination.", "Штурвал под боковой стеной, у тележки. Через винт и рычаги прижимает колодки без сжатого воздуха.": "A wheel under the side wall, by the bogie. Through a screw and levers it applies the brake shoes without compressed air.", "Стояночный тормоз удерживает вагон во время погрузки, когда локомотив отцеплен.": "The hand brake holds the car during loading when the locomotive is uncoupled.", "Крытый вагон: общий вид": "Boxcar: overview", "Крытый вагон — вагон с закрытым кузовом для грузов, которые нужно беречь от погоды и хищений: товаров на поддонах, бумаги, бытовой техники, грузов в мешках и ящиках. Грузят его через широкие раздвижные двери в боковых стенах.": "A boxcar is a car with an enclosed body for cargo that must be protected from weather and theft: palletised goods, paper, appliances, cargo in bags and boxes. It is loaded through wide sliding doors in the side walls.", "Боковые стены — стальные листы с горизонтальными выштамповками и наружными стойками. Сверху их связывает верхняя обвязка, на неё опирается дуговая крыша. Торцевые стены усилены гофрами: при торможении груз давит именно на них.": "The side walls are steel sheets with horizontal pressed ribs and external stanchions. At the top they are tied by the top chord, which carries the curved roof. The end walls are corrugated: in braking, the cargo pushes against them.", "Раздвижные двери": "Sliding doors", "В середине каждой боковой стены — двустворчатая дверь. Створки катятся на роликах по верхней направляющей, нижняя направляющая не даёт им отойти от стены. Закрытую дверь запирают запором и пломбируют.": "In the middle of each side wall is a double door. The leaves roll on rollers along the upper track, and the lower track keeps them against the wall. The closed door is locked and sealed.", "Кузов поднят, чтобы показать раму: хребтовую балку, нижнюю обвязку, шкворневые, поперечные и концевые балки. Поперечные балки стоят часто — пол должен выдерживать погрузчик с грузом.": "The body is lifted to show the frame: centre sill, side sills, body bolsters, cross bearers and end sills. The cross bearers are closely spaced — the floor has to carry a loaded forklift.", "Ходовая часть та же, что у других вагонов на стенде: две тележки 23,5 т/ось. Крытый вагон длиннее, поэтому тележки разнесены дальше друг от друга.": "The running gear is the same as on the other cars here: two 23.5 t/axle bogies. A boxcar is longer, so its bogies are further apart.", "Пневматический тормоз устроен как у других грузовых вагонов; оборудование выдвинуто в сторону. Штурвал стояночного тормоза стоит под боковой стеной, у тележки.": "The air brake works as on other freight cars; the equipment is moved aside. The hand brake wheel is under the side wall, by the bogie.", "Погрузка через двери": "Loading through the doors", "Двери открыты. Погрузчик завозит поддоны через дверной проём и расставляет их рядами: сначала у торцевых стен, потом ближе к дверям. Рентген показывает, как заполняется кузов. В конце дверной проём изнутри закрывают заграждением.": "The doors are open. A forklift brings pallets in through the doorway and stows them in rows: first at the end walls, then closer to the doors. X-ray shows the body filling up. Finally the doorway is closed off inside with a guard.", "Размещение груза": "Stowage", "Поддоны стоят плотно, без зазоров, двумя рядами по ширине вагона. У дверей оставлено место, а проём изнутри перекрыт досками: так груз не навалится на двери в пути.": "Pallets stand tightly, with no gaps, in two rows across the car. Space is left at the doors, and the opening is closed off with boards on the inside: this way the cargo won't lean on the doors in transit.", "Двери открыты": "Doors open", "Рефрижератор": "Refrigerator car", "Автономный рефрижераторный вагон: теплоизолированный кузов, своя холодильная установка и дизель-генератор. Возит грузы, которым нужна постоянная низкая температура.": "An autonomous refrigerator car: an insulated body, its own refrigeration unit and diesel generator. Carries cargo that needs a constant low temperature.", "Упрощённая модель: показывает общее устройство автономного рефрижераторного вагона, без точных размеров.": "Simplified model: shows the general design of an autonomous refrigerator car, without exact dimensions.", "Теплоизолированный кузов: наружная обшивка, слой теплоизоляции, внутренняя обшивка, крыша и пол.": "Insulated body: outer skin, insulation layer, inner lining, roof and floor.", "Прислонно-сдвижные двери грузового помещения с уплотнением и запором.": "Plug doors of the cargo compartment with a seal and lock.", "Холодильное оборудование": "Refrigeration equipment", "Машинное отделение с дизель-генератором и холодильной установкой, воздухоохладитель, воздуховод и напольные решётки.": "Machinery compartment with a diesel generator and refrigeration unit, air cooler, air duct and floor gratings.", "Коробки с мороженым грузом на поддонах.": "Boxes of frozen cargo on pallets.", "Наружная обшивка": "Outer skin", "Гофрированные стальные листы снаружи кузова.": "Corrugated steel sheets on the outside of the body.", "Светлый цвет кузова отражает солнце: летом установке приходится отводить меньше тепла.": "The light colour reflects sunlight: in summer the unit has less heat to remove.", "Теплоизоляция": "Insulation", "Толстый слой пенопласта или пенополиуретана между наружной и внутренней обшивкой — в стенах, крыше и полу.": "A thick layer of polystyrene or polyurethane foam between the outer skin and inner lining — in the walls, roof and floor.", "Кузов рефрижератора — «сэндвич»: чем лучше изоляция, тем меньше работы у холодильной установки.": "A reefer body is a \"sandwich\": the better the insulation, the less work for the refrigeration unit.", "Внутренняя обшивка": "Inner lining", "Гладкая обшивка грузового помещения, которую легко мыть.": "Smooth lining of the cargo compartment that is easy to wash.", "Гладкие стены без выступов не мешают воздуху обтекать груз и не собирают грязь.": "Smooth walls with no projections let air flow around the cargo and don't collect dirt.", "Закрывают кузов с торцов; внутри тоже утеплены.": "Close the body at the ends; also insulated inside.", "Со стороны машинного отделения торцевая стена закрывает оборудование, а не груз.": "On the machinery side, the end wall encloses the equipment, not the cargo.", "Закруглённая крыша с теплоизоляцией.": "A rounded, insulated roof.", "Через крышу летом приходит больше всего солнечного тепла, поэтому изоляция там особенно толстая.": "In summer the most solar heat comes in through the roof, so the insulation there is especially thick.", "Пол грузового помещения с изоляцией снизу.": "Cargo compartment floor with insulation underneath.", "Холод «уходит» вниз, поэтому изоляция пола не менее важна, чем стен.": "Cold \"sinks\" downwards, so floor insulation matters as much as wall insulation.", "Номер вагона, грузоподъёмность, тара и сведения о ремонтах.": "Car number, load capacity, tare and repair records.", "Номер рефрижераторного вагона на сети колеи 1520 мм начинается с цифры 8.": "A refrigerator car number on the 1520 mm network starts with 8.", "Прислонно-сдвижная дверь": "Plug door", "Утеплённая дверь грузового помещения на каждой боковой стене. При открытии сначала отходит от стены, затем сдвигается вдоль неё.": "An insulated cargo door in each side wall. When opening, it first moves out from the wall, then slides along it.", "Закрытая дверь прижимается к уплотнению по всему контуру — так холод не уходит через щели.": "The closed door presses against a seal all round — so no cold escapes through gaps.", "Направляющие и механизм": "Tracks and mechanism", "Верхняя и нижняя направляющие, по которым дверь сдвигается после отхода от стены.": "Upper and lower tracks the door slides along after moving out from the wall.", "Обычная раздвижная дверь катится вдоль стены с зазором, а прислонно-сдвижная в закрытом положении плотно прижата к проёму.": "A normal sliding door rolls along the wall with a gap, but a plug door is pressed tightly into the opening when closed.", "Запорный механизм": "Locking mechanism", "Рукоятка с тягами, которые прижимают дверь к уплотнению и запирают её.": "A handle with rods that press the door onto the seal and lock it.", "Запертую дверь пломбируют, как и у крытого вагона.": "The locked door is sealed, as on a boxcar.", "Перегородка": "Bulkhead", "Утеплённая стенка между машинным отделением и грузовым помещением.": "An insulated wall between the machinery compartment and the cargo compartment.", "Двигатель и компрессор выделяют тепло, поэтому их отделяют от груза изолированной стенкой.": "The engine and compressor give off heat, so they are separated from the cargo by an insulated wall.", "Дизель-генератор": "Diesel generator", "Двигатель с генератором в машинном отделении. Даёт электричество для холодильной установки и вентиляторов.": "An engine with a generator in the machinery compartment. It supplies power for the refrigeration unit and fans.", "Своя электростанция делает вагон автономным: ему не нужен электрический ток от локомотива.": "Its own power plant makes the car autonomous: it needs no electricity from the locomotive.", "Холодильная установка": "Refrigeration unit", "Компрессор и конденсатор с вентилятором. Отводят тепло из грузового помещения наружу.": "Compressor and condenser with a fan. They carry heat out of the cargo compartment.", "Холодильник не «производит холод», а переносит тепло изнутри наружу — так же, как домашний.": "A refrigerator doesn't \"make cold\" — it moves heat from inside to outside, just like a home fridge.", "Жалюзи": "Louvres", "Решётки в стенах машинного отделения. Через них вентилятор конденсатора и двигатель берут и выбрасывают воздух.": "Grilles in the walls of the machinery compartment. The condenser fan and engine take in and blow out air through them.", "Если жалюзи забиты грязью или снегом, установка перегревается и хуже охлаждает груз.": "If the louvres are clogged with dirt or snow, the unit overheats and cools the cargo less well.", "Дверь машинного отделения": "Machinery compartment door", "Отдельная дверь для обслуживания оборудования.": "A separate door for servicing the equipment.", "Механик обслуживает установку, не открывая грузовое помещение и не выпуская холод.": "The mechanic services the unit without opening the cargo compartment and letting the cold out.", "Воздухоохладитель": "Air cooler", "Испаритель с вентиляторами у перегородки, под потолком грузового помещения. Охлаждает воздух и гонит его в воздуховод.": "An evaporator with fans at the bulkhead, under the ceiling of the cargo compartment. It cools the air and blows it into the duct.", "На испарителе намерзает иней, поэтому его периодически оттаивают.": "Frost builds up on the evaporator, so it is defrosted periodically.", "Воздуховод": "Air duct", "Короб под потолком вдоль всего грузового помещения. Через щели в нём холодный воздух равномерно опускается на груз.": "A duct under the ceiling along the whole cargo compartment. Through slots in it, cold air descends evenly onto the cargo.", "Без воздуховода у воздухоохладителя было бы холодно, а в дальнем конце вагона — тепло.": "Without the duct it would be cold near the air cooler and warm at the far end of the car.", "Напольные решётки": "Floor gratings", "Решётки на полу, по которым воздух возвращается к воздухоохладителю.": "Gratings on the floor along which air returns to the air cooler.", "Груз ставят на решётки и не доводят до потолка: холодный воздух должен обтекать его со всех сторон.": "Cargo is placed on the gratings and not stacked to the ceiling: cold air must flow around it on all sides.", "Топливный бак": "Fuel tank", "Бак с дизельным топливом под рамой вагона.": "A diesel fuel tank under the car frame.", "Запас топлива рассчитан так, чтобы установка работала весь рейс без дозаправки.": "The fuel supply is sized so the unit runs the whole trip without refuelling.", "Продольные балки по краям рамы, на них стоит кузов.": "Longitudinal beams along the edges of the frame; the body stands on them.", "Опора под шкворневой балкой. Входит в подпятник тележки.": "Support under the body bolster. It sits in the bogie's centre bowl.", "На поперечные балки опирается и изолированный пол, и тяжёлое оборудование машинного отделения.": "The cross bearers carry both the insulated floor and the heavy machinery equipment.", "Подножки под углами рамы и поручни — для составителей.": "Steps under the frame corners and grab irons — for shunters.", "Мороженый груз": "Frozen cargo", "Коробки на поддонах, поставленные на напольные решётки с зазором до воздуховода.": "Boxes on pallets, placed on the floor gratings with a gap below the duct.", "Груз загружают уже охлаждённым: рефрижератор поддерживает температуру, а не замораживает тёплый груз.": "Cargo is loaded already chilled: a reefer maintains temperature, it doesn't freeze warm cargo.", "Рефрижераторный вагон": "Refrigerator car", "Автономный рефрижераторный вагон возит грузы, которым нужна постоянная низкая температура: мясо, рыбу, мороженое, фрукты. Кузов теплоизолирован, а в машинном отделении на одном конце стоят своя холодильная установка и дизель-генератор.": "An autonomous refrigerator car carries cargo that needs a constant low temperature: meat, fish, ice cream, fruit. The body is insulated, and the machinery compartment at one end holds its own refrigeration unit and diesel generator.", "Кузов и теплоизоляция": "Body and insulation", "Включён рентген. Стены, крыша и пол — «сэндвич»: наружная гофрированная обшивка, толстый слой теплоизоляции и гладкая внутренняя обшивка. Изоляция не даёт уличному теплу проникать к грузу.": "X-ray is on. The walls, roof and floor are a \"sandwich\": corrugated outer skin, a thick layer of insulation and smooth inner lining. The insulation keeps outside heat away from the cargo.", "Дверь грузового помещения сначала отходит от стены, а затем сдвигается вдоль неё по направляющим. Закрытая, она плотно прижата к уплотнению по всему контуру проёма — холод не уходит через щели.": "The cargo door first moves out from the wall, then slides along it on tracks. When closed, it is pressed tightly against a seal around the whole opening — no cold escapes through gaps.", "Машинное отделение": "Machinery compartment", "На одном конце вагона, за утеплённой перегородкой, — машинное отделение. Дизель-генератор вырабатывает электричество, холодильная установка с компрессором и конденсатором отводит тепло наружу через жалюзи. Механик заходит сюда через отдельную дверь.": "At one end of the car, behind an insulated bulkhead, is the machinery compartment. The diesel generator produces electricity; the refrigeration unit with compressor and condenser carries heat out through the louvres. The mechanic enters through a separate door.", "Охлаждение": "Cooling", "Как циркулирует холодный воздух": "How cold air circulates", "Воздухоохладитель у перегородки охлаждает воздух и гонит его в воздуховод под потолком. Через щели воздуховода холод опускается на груз по всей длине вагона, а нагретый воздух по напольным решёткам возвращается к воздухоохладителю. Груз скрыт, чтобы было видно движение воздуха — его можно включить переключателем «Груз».": "The air cooler at the bulkhead cools the air and blows it into the duct under the ceiling. Through the duct slots the cold descends onto the cargo along the whole car, and warmed air returns along the floor gratings to the air cooler. The cargo is hidden so you can see the airflow — turn it on with the «Cargo» switch.", "Кузов поднят, чтобы показать раму: хребтовую балку, нижнюю обвязку, шкворневые, поперечные и концевые балки. Под рамой — топливный бак дизель-генератора.": "The body is lifted to show the frame: centre sill, side sills, body bolsters, cross bearers and end sills. Under the frame is the diesel generator's fuel tank.", "Ходовая часть та же, что у других вагонов на стенде: две тележки 23,5 т/ось.": "The running gear is the same as on the other cars here: two 23.5 t/axle bogies.", "Пневматический тормоз устроен как у других грузовых вагонов; оборудование выдвинуто в сторону.": "The air brake works as on other freight cars; the equipment is moved aside.", "Вагон-автомобилевоз": "Autorack car", "Крытый двухъярусный вагон для легковых автомобилей. Сверху боковых стен — решётчатые панели, торцы закрыты распашными дверями; автомобили заезжают своим ходом.": "A covered bi-level car for passenger cars. The upper side walls are mesh panels and the ends are closed by swing doors; the cars are driven on under their own power.", "Упрощённая модель: показывает общее устройство крытого двухъярусного вагона для легковых автомобилей, без точных размеров.": "Simplified model: shows the general design of a covered bi-level autorack, without exact dimensions.", "Сплошная нижняя часть боковых стен, решётчатые панели сверху, стойки и двускатная крыша.": "Solid lower side walls, mesh panels above, stanchions and a high roof.", "Ярусы": "Decks", "Нижний ярус — пол вагона, второй ярус — настил на стойках. На концах — откидные переходные мостики.": "The lower deck is the car floor, the upper deck is a platform on posts. At the ends are hinged bridge plates.", "Торцевые двери": "End doors", "Распашные двустворчатые двери на обоих торцах и их запоры.": "Double swing doors at both ends and their locks.", "Автомобили и крепление": "Vehicles and securing", "Легковые автомобили на двух ярусах и колёсные упоры.": "Passenger cars on two decks and wheel chocks.", "Нижняя часть боковых стен": "Lower side walls", "Сплошная обшивка с горизонтальными рёбрами — по высоте нижнего яруса.": "Solid sheeting with horizontal ribs — the height of the lower deck.", "Сплошная нижняя часть защищает автомобили от камней и щебня из-под колёс.": "The solid lower part protects the vehicles from stones and ballast thrown up by the wheels.", "Решётчатые панели": "Mesh panels", "Панели из стальной сетки в верхней части боковых стен.": "Steel mesh panels in the upper part of the side walls.", "Сетка пропускает воздух и свет, но не даёт добраться до автомобилей и защищает их от камней.": "The mesh lets in air and light but keeps people out and protects the vehicles from stones.", "Вертикальные профили боковых стен, между ними закреплены решётчатые панели.": "Vertical sections of the side walls; the mesh panels are fixed between them.", "Стойки и обвязка — каркас кузова: сама сетка нагрузку не несёт.": "Stanchions and chords are the body frame: the mesh itself carries no load.", "Крыша из профилированного листа: крутые скаты по краям и плоская средняя часть — в сечении трапеция.": "A roof of profiled sheet: steep slopes at the sides and a flat middle — a trapezoid in section.", "Высокая крыша даёт место для автомобилей второго яруса.": "The high roof makes room for the upper-deck vehicles.", "Номер вагона, грузоподъёмность и сведения о ремонтах.": "Car number, load capacity and repair records.", "Грузоподъёмность автомобилевоза небольшая, зато вагон очень вместительный по объёму.": "An autorack's load capacity is small, but it carries a lot of volume.", "Нижний ярус": "Lower deck", "Пол вагона, на котором стоят автомобили нижнего яруса.": "The car floor on which the lower-deck vehicles stand.", "В полу есть места для крепления колёсных упоров по всей длине вагона.": "The floor has fixing points for wheel chocks along the whole car.", "Второй ярус": "Upper deck", "Стальной настил на высоте около полутора метров над полом, на всю длину вагона.": "A steel deck about one and a half metres above the floor, along the whole car.", "Второй ярус удваивает вместимость: на модели десять автомобилей вместо пяти.": "The upper deck doubles capacity: ten cars on the model instead of five.", "Стойки яруса": "Deck posts", "Вертикальные стойки у боковых стен, на которые опирается второй ярус.": "Vertical posts at the side walls that support the upper deck.", "Стойки стоят у стен, чтобы середина яруса оставалась свободной для проезда автомобилей.": "The posts stand at the walls so the middle of the deck stays clear for driving.", "Переходные мостики": "Bridge plates", "Откидные площадки на концах обоих ярусов. Опущенные, они перекрывают зазор между вагонами.": "Hinged plates at the ends of both decks. When lowered, they span the gap between cars.", "По мостикам автомобили своим ходом проезжают через весь состав, от эстакады до дальнего вагона.": "Over the bridge plates vehicles drive through the whole train, from the ramp to the farthest car.", "Распашные двустворчатые двери на обоих торцах вагона, во всю высоту кузова.": "Double swing doors at both ends of the car, the full height of the body.", "Двери на обоих концах позволяют загружать сразу весь состав сквозным проездом.": "Doors at both ends let the whole train be loaded by driving straight through.", "Запоры дверей": "Door locks", "Вертикальные запорные штанги и кронштейны на створках.": "Vertical locking bars and brackets on the door leaves.", "Штанги запирают створки сверху и снизу, двери пломбируют.": "The bars lock the leaves at the top and bottom; the doors are sealed.", "Вагон очень длинный, поэтому хребтовая балка и вся рама особенно жёсткие.": "The car is very long, so the centre sill and the whole frame are especially rigid.", "База автомобилевоза намного больше, чем у обычного крытого вагона.": "An autorack's base is much longer than an ordinary boxcar's.", "Поперечные балки заставляют продольные балки работать вместе.": "The cross bearers make the longitudinal beams work together.", "Ударная розетка принимает удар, если автосцепки сблизились сильнее допустимого.": "The striker takes the blow if the couplers close up more than allowed.", "Легковые автомобили": "Passenger cars", "По пять автомобилей на каждом ярусе. Заезжают своим ходом через торцевые двери.": "Five vehicles on each deck. They are driven in through the end doors.", "Автомобили ставят на ручной тормоз и включённую передачу, но этого мало — их дополнительно крепят упорами.": "Vehicles are left in gear with the handbrake on, but that's not enough — they are also secured with chocks.", "Колёсные упоры": "Wheel chocks", "Упоры спереди и сзади колёс, закреплённые на настиле яруса.": "Chocks in front of and behind the wheels, fixed to the deck.", "Упоры держат автомобиль за колёса, не касаясь кузова, — так он не получит повреждений.": "The chocks hold the vehicle by its wheels without touching the body — so it isn't damaged.", "Крытый двухъярусный вагон для перевозки легковых автомобилей. Он намного длиннее обычного крытого вагона. Нижняя часть стен сплошная, верхняя — решётчатая, торцы закрыты распашными дверями. Внутри — два яруса.": "A covered bi-level car for carrying passenger cars. It is much longer than an ordinary boxcar. The lower walls are solid, the upper ones are mesh, and the ends are closed by swing doors. Inside are two decks.", "Нижняя часть боковых стен сплошная — она защищает автомобили от камней из-под колёс. Выше — решётчатые панели между стойками: они пропускают воздух и свет, но не дают добраться до груза. Сверху — высокая двускатная крыша.": "The lower side walls are solid — they protect the vehicles from stones thrown up by the wheels. Above are mesh panels between stanchions: they let in air and light but keep people away from the cargo. On top is a high roof.", "Два яруса": "Two decks", "Включён рентген. Нижний ярус — пол вагона, второй — стальной настил на стойках у боковых стен. На концах обоих ярусов — откидные переходные мостики.": "X-ray is on. The lower deck is the car floor, the upper deck is a steel platform on posts at the side walls. At the ends of both decks are hinged bridge plates.", "На обоих торцах — распашные двустворчатые двери во всю высоту кузова. Створки запираются вертикальными штангами. Когда двери открыты, опускаются переходные мостики.": "At both ends are double swing doors the full height of the body. The leaves are locked with vertical bars. When the doors are open, the bridge plates are lowered.", "Кузов поднят, чтобы показать раму. Она устроена как у других вагонов, но намного длиннее.": "The body is lifted to show the frame. It is built like the other cars' frames, but much longer.", "Ходовая часть та же, что у других вагонов на стенде: две тележки 23,5 т/ось, разнесённые очень далеко друг от друга.": "The running gear is the same as on the other cars here: two 23.5 t/axle bogies, set very far apart.", "Погрузка своим ходом": "Driving on", "Вагон стоит у двухъярусной торцевой эстакады. Двери открыты, мостики опущены. Водители заезжают своим ходом — сначала на нижний ярус, потом на второй, — и ставят автомобили от дальнего конца к дверям. После каждого автомобиля ставят колёсные упоры.": "The car stands at a two-level end ramp. The doors are open and the bridge plates down. Drivers drive the vehicles in — first onto the lower deck, then the upper — parking them from the far end towards the doors. Chocks are fitted after each vehicle.", "Крепление автомобилей": "Securing the vehicles", "Каждый автомобиль стоит на ручном тормозе, а спереди и сзади колёс — упоры, закреплённые на настиле. Упоры держат автомобиль за колёса и не касаются кузова.": "Each vehicle has its handbrake on, and chocks fixed to the deck sit in front of and behind its wheels. The chocks hold the vehicle by the wheels and don't touch the body.", "Автомобили": "Vehicles", "Универсальный": "General", "Для автомобилей": "Autorack", "Тип": "Type", "Транспортёр": "Well car", "Вагон-транспортёр с пониженной погрузочной площадкой для тяжёлых и высоких грузов: трансформаторов, реакторов, станин и крупного оборудования.": "A well-type transporter with a lowered loading deck for heavy and tall loads: transformers, reactors, machine beds and large equipment.", "Упрощённая модель: показывает общее устройство четырёхосного транспортёра с пониженной площадкой, без точных размеров.": "Simplified model: shows the general design of a four-axle well-type transporter, without exact dimensions.", "Несущая рама": "Load-bearing frame", "Две главные балки с изогнутыми переходами, концевые консоли над тележками, шкворневые и концевые балки.": "Two main girders with curved transitions, end consoles over the bogies, body bolsters and end sills.", "Погрузочная площадка": "Loading deck", "Пониженная площадка между тележками и увязочные устройства для крепления груза.": "The lowered deck between the bogies and the lashing points for securing the load.", "Силовой трансформатор, растяжки и упорные бруски.": "Power transformer, lashings and chocks.", "Главные балки": "Main girders", "Две мощные продольные балки по бокам вагона. Они несут весь груз и передают его на концевые консоли.": "Two massive longitudinal girders along the sides of the car. They carry the entire load and transfer it to the end consoles.", "У транспортёра нет кузова и сплошного пола под грузом — вся нагрузка идёт через две главные балки.": "A transporter has no body and no solid floor under the load — the whole load goes through the two main girders.", "Изогнутые переходы": "Curved transitions", "Участки, где рама плавно опускается от консоли к пониженной площадке. Здесь четыре изогнутые продольные балки — две главные по краям и две внутренние, без настила.": "Sections where the frame drops smoothly from the console to the lowered deck. Here there are four curved longitudinal beams — two main girders at the sides and two inner ones, with no decking.", "Изгиб нагружен сильнее всего, поэтому его делают из нескольких мощных балок, а не из листа.": "The bend carries the highest stress, so it is made of several heavy beams rather than plate.", "Рёбра жёсткости": "Stiffening ribs", "Поперечные рёбра на стенках главных балок.": "Transverse ribs on the webs of the main girders.", "Рёбра не дают тонкой стенке высокой балки выпучиться под нагрузкой.": "The ribs stop the thin web of a deep girder from buckling under load.", "Концевые консоли": "End consoles", "Высокие концевые части рамы над тележками. Через них вес груза уходит на тележки, на них же стоят автосцепки.": "The raised end parts of the frame over the bogies. Through them the load goes to the bogies, and the couplers are mounted on them.", "Отверстия в настиле консолей облегчают конструкцию и дают доступ к узлам под ней.": "Holes in the console decks save weight and give access to the parts underneath.", "Хребтовые балки консолей": "Console centre sills", "Короткие хребтовые балки в концевых консолях. В них стоят поглощающие аппараты автосцепок.": "Short centre sills in the end consoles. They house the coupler draft gears.", "Тяговые и ударные силы идут от автосцепки через консоль в главные балки.": "Pulling and buffing forces go from the coupler through the console into the main girders.", "Поперечные балки консолей над тележками. Передают вес на тележки через пятники.": "Cross beams of the consoles above the bogies. They transfer the weight to the bogies through the centre plates.", "Замыкают консоли с торцов. На них ударные розетки автосцепок и кронштейны расцепного привода.": "Close the consoles at the ends. They carry the coupler strikers and uncoupling lever brackets.", "Подножки под углами консолей и поручни на концевых балках — для составителей.": "Steps under the console corners and grab irons on the end sills — for shunters.", "Поручни и подножки нельзя загораживать грузом или снимать.": "Grab irons and steps must not be blocked by the load or removed.", "Пониженная площадка": "Lowered deck", "Площадка между главными балками, опущенная почти к рельсам. На неё ставят груз.": "A deck between the main girders, lowered almost to the rails. The load is placed on it.", "Чем ниже площадка, тем более высокий груз можно провезти, не выходя за габарит погрузки.": "The lower the deck, the taller the load that can be carried without exceeding the loading gauge.", "Поперечные балки площадки": "Deck cross beams", "Балки под площадкой, связывающие главные балки между собой.": "Beams under the deck that tie the main girders together.", "Поперечные балки передают вес груза с площадки на главные балки.": "The cross beams transfer the load's weight from the deck to the main girders.", "Увязочные устройства": "Lashing points", "Проушины на главных балках, к которым крепят растяжки.": "Eyes on the main girders to which the lashings are attached.", "Проушины рассчитаны на определённое усилие, поэтому число и схему растяжек считают для каждого груза.": "Each eye is rated for a certain force, so the number and pattern of lashings are calculated for every load.", "Силовой трансформатор": "Power transformer", "Тяжёлый и высокий груз: бак с обмотками, вводы-изоляторы, радиаторы и расширительный бак.": "A heavy, tall load: a tank with windings, bushings, radiators and a conservator tank.", "Такие грузы часто негабаритные: для них заранее рассчитывают маршрут и условия пропуска.": "Such loads are often out-of-gauge: the route and clearance conditions are worked out in advance.", "Проволочные или цепные растяжки от проушин груза к увязочным устройствам вагона.": "Wire or chain lashings from the load's lifting eyes to the car's lashing points.", "Растяжки ставят парами в противоположные стороны, чтобы удерживать груз от сдвига в любую сторону.": "Lashings are fitted in pairs pulling in opposite directions to keep the load from moving any way.", "Бруски вплотную к основанию груза. Не дают ему сдвинуться вдоль и поперёк вагона.": "Blocks tight against the base of the load. They stop it moving along or across the car.", "Схему размещения и крепления негабаритного груза разрабатывают и согласовывают для каждой перевозки.": "The loading and securing scheme for an out-of-gauge load is developed and approved for every shipment.", "Транспортёр с пониженной площадкой": "Well-type transporter", "Транспортёр перевозит тяжеловесные и высокие грузы: трансформаторы, реакторы, станины прессов. Его главная особенность — погрузочная площадка между тележками опущена почти до рельсов, поэтому высокий груз вписывается в габарит. На стенде — простой четырёхосный транспортёр; для самых тяжёлых грузов строят транспортёры на шесть, восемь и больше осей.": "A transporter carries heavy and tall loads: transformers, reactors, press frames. Its key feature is a loading deck between the bogies lowered almost to the rails, so a tall load fits within the gauge. Shown here is a simple four-axle transporter; for the heaviest loads there are transporters with six, eight and more axles.", "Весь груз несут две главные балки по бокам вагона. Над тележками они высокие и образуют концевые консоли, а к середине плавно опускаются изогнутыми переходами. Стенки балок усилены поперечными рёбрами.": "The whole load is carried by two main girders along the sides of the car. Over the bogies they are deep and form the end consoles, and towards the middle they drop smoothly through curved transitions. The girder webs are stiffened with transverse ribs.", "Площадка между главными балками опущена почти к рельсам. Под ней — поперечные балки, по краям — увязочные устройства для растяжек.": "The deck between the main girders is lowered almost to the rails. Underneath are cross beams; along the edges are lashing points.", "Консоли": "Consoles", "Над каждой тележкой — высокая концевая консоль. Через неё вес груза уходит на тележку, а усилия от автосцепки — в главные балки. Настил консоли облегчён отверстиями.": "Above each bogie is a raised end console. Through it the load goes to the bogie, and coupler forces go into the main girders. The console deck is lightened with holes.", "На четырёхосном транспортёре стоят две тележки 23,5 т/ось — такие же, как у других вагонов на стенде.": "The four-axle transporter has two 23.5 t/axle bogies — the same as the other cars here.", "Автосцепка СА-3 и поглощающий аппарат стоят в хребтовой балке концевой консоли.": "The SA-3 coupler and draft gear sit in the centre sill of the end console.", "Пневматический тормоз устроен как у других грузовых вагонов. Магистраль проложена вдоль главной балки, оборудование выдвинуто в сторону.": "The air brake works as on other freight cars. The brake pipe runs along the main girder; the equipment is moved aside.", "Погрузка трансформатора": "Loading the transformer", "Трансформатор поднимают краном за проушины на траверсе и опускают точно на середину пониженной площадки. Затем к основанию подбивают упорные бруски и натягивают растяжки.": "The transformer is lifted by crane by its lifting eyes on a spreader beam and lowered exactly onto the middle of the deck. Then chocks are fitted against the base and the lashings are tensioned.", "Груз стоит на середине площадки, чтобы нагрузка поровну делилась между тележками. От продольного и поперечного сдвига его держат упорные бруски, а от опрокидывания — растяжки от проушин груза к увязочным устройствам на главных балках.": "The load stands in the middle of the deck so the weight is shared equally between the bogies. Chocks stop it moving along and across, and lashings from the load's eyes to the lashing points on the main girders stop it tipping.", "Трансформатор": "Transformer", "Двухосная тележка грузового вагона для колеи 1520 мм — та самая, что стоит под всеми вагонами на стенде. Здесь её можно разобрать до отдельных деталей.": "A two-axle freight car bogie for 1520 mm gauge — the same one that stands under every car here. Here you can take it apart down to individual parts.", "Упрощённая модель: показывает устройство тележки 23,5 т/ось; основные размеры взяты из чертежа, мелкие детали упрощены.": "Simplified model: shows the design of the 23.5 t/axle bogie; the main dimensions are taken from the drawing, small details are simplified.", "Две колёсные пары: ось и два колеса, напрессованных на неё.": "Two wheelsets: an axle with two wheels pressed onto it.", "Буксовые узлы": "Axle boxes", "Кассетные подшипники на шейках осей, торцевые крышки и адаптеры, на которые опираются боковые рамы.": "Cartridge bearings on the axle journals, end caps and adapters that the side frames rest on.", "Боковые рамы": "Side frames", "Две литые боковые рамы с буксовыми и рессорным проёмами, фрикционные планки на колонках.": "Two cast side frames with pedestal jaws and a spring window, and friction plates on the columns.", "Литая поперечная балка с подпятником, шкворнем и скользунами.": "Cast cross beam with a centre bowl, king pin and side bearers.", "Рессорное подвешивание": "Spring suspension", "Пружинные комплекты и клиновые фрикционные гасители колебаний.": "Spring sets and friction wedge dampers.", "Тормозная рычажная передача": "Bogie brake rigging", "Триангели с тормозными колодками, подвески, вертикальные рычаги и затяжка.": "Brake beams with shoes, hangers, vertical levers and a bottom rod.", "Колёса": "Wheels", "Цельнокатаные колёса с гребнем. Гребень с внутренней стороны удерживает колёсную пару на рельсах.": "Solid rolled wheels with a flange. The flange on the inside keeps the wheelset on the rails.", "Диаметр нового колеса по кругу катания — 957 мм, расстояние между внутренними гранями колёс — 1440 мм.": "A new wheel is 957 mm in diameter at the tread; the distance between inner wheel faces is 1440 mm.", "Ось": "Axle", "Стальная ось с подступичными частями под колёса и шейками под подшипники на концах.": "A steel axle with wheel seats for the wheels and bearing journals at the ends.", "Колёса напрессованы на ось наглухо и вращаются только вместе с ней.": "The wheels are pressed onto the axle tightly and turn only with it.", "Кассетный подшипник": "Cartridge bearing", "Подшипник в сборе, насаженный на шейку оси. Позволяет оси вращаться под нагрузкой.": "A complete bearing pressed onto the axle journal. It lets the axle turn under load.", "Кассетный подшипник поставляется готовым и смазанным на весь срок службы — его не разбирают в депо.": "A cartridge bearing arrives assembled and lubricated for life — it is not taken apart in the depot.", "Торцевая крышка": "End cap", "Крышка на торце оси, закреплённая болтами. Удерживает подшипник на шейке.": "A cap bolted to the end of the axle. It holds the bearing on the journal.", "По торцевой крышке осмотрщик видит, не сдвинулся ли подшипник и цел ли крепёж.": "From the end cap an inspector can see whether the bearing has shifted and the fasteners are intact.", "Адаптер": "Adapter", "Литая деталь между подшипником и боковой рамой. Передаёт нагрузку от рамы на подшипник.": "A cast part between the bearing and the side frame. It transfers the load from the frame to the bearing.", "Адаптер входит в буксовый проём боковой рамы и удерживает раму от сдвига вдоль оси.": "The adapter sits in the side frame's pedestal jaw and keeps the frame from sliding along the axle.", "Литые стальные рамы по бокам тележки. Концами опираются на буксовые узлы, в середине — рессорный проём для пружин и надрессорной балки.": "Cast steel frames on the sides of the bogie. Their ends rest on the axle boxes; in the middle is a spring window for the springs and bolster.", "Расстояние между центрами боковых рам — 2036 мм.": "The distance between the side frame centres is 2036 mm.", "Фрикционные планки": "Friction plates", "Износостойкие планки на колонках рессорного проёма. По ним скользят фрикционные клинья.": "Wear plates on the columns of the spring window. The friction wedges slide on them.", "Изнашивается сменная планка, а не сама литая рама: планку меняют при ремонте.": "The replaceable plate wears, not the cast frame itself: the plate is changed during repair.", "Литая поперечная балка. Концами лежит на пружинных комплектах, в середине несёт подпятник.": "Cast cross beam. Its ends rest on the spring sets; in the middle it carries the centre bowl.", "Боковые рамы и надрессорная балка — самые массивные литые детали тележки.": "The side frames and the bolster are the heaviest cast parts of the bogie.", "Чаша в центре надрессорной балки. В неё входит пятник вагона.": "A bowl in the middle of the bolster. The car's centre plate sits in it.", "Высота опорной поверхности подпятника над головкой рельса — около 806 мм.": "The bearing surface of the centre bowl is about 806 mm above the top of rail.", "Износостойкая прокладка": "Wear liner", "Прокладка на дне подпятника. Снижает трение и износ между пятником и подпятником.": "A liner in the bottom of the centre bowl. It reduces friction and wear between the centre plate and bowl.", "Прокладка позволяет тележке легче поворачиваться в кривых и бережёт литую чашу.": "The liner lets the bogie turn more easily on curves and protects the cast bowl.", "Шкворень": "King pin", "Вертикальный стержень в центре подпятника. Проходит через пятник вагона.": "A vertical pin in the centre of the bowl. It passes through the car's centre plate.", "Шкворень страхует: при сильном толчке пятник не выскочит из подпятника.": "The king pin is a safeguard: in a heavy shock the centre plate won't jump out of the bowl.", "Опоры на надрессорной балке по обе стороны от подпятника, под колпаками. Ограничивают боковую качку кузова.": "Supports on the bolster on either side of the centre bowl, under caps. They limit the sideways roll of the body.", "Зазор между скользунами тележки и рамы вагона для основных четырёхосных вагонов — 6–16 мм. Регулируют его прокладками под колпаком.": "The clearance between bogie and car body side bearers on standard four-axle cars is 6–16 mm. It is adjusted with shims under the cap.", "Наружные пружины": "Outer springs", "Крупные цилиндрические пружины в каждом рессорном комплекте.": "Large coil springs in each spring set.", "В комплекте — семь двухрядных пружин: наружная и вставленная в неё внутренняя.": "Each set has seven double springs: an outer one and an inner one fitted inside it.", "Внутренние пружины": "Inner springs", "Пружины меньшего диаметра, вставленные внутрь наружных.": "Smaller-diameter springs fitted inside the outer ones.", "Внутреннюю пружину навивают в другую сторону, чтобы витки двух пружин не заходили друг за друга.": "The inner spring is coiled the opposite way so the coils of the two springs don't interlock.", "Фрикционные клинья": "Friction wedges", "Клинья между надрессорной балкой и колонками боковой рамы. Опираются на пружины и прижимаются к фрикционным планкам.": "Wedges between the bolster and the side frame columns. They rest on springs and are pressed against the friction plates.", "Трение клина о планку гасит раскачивание вагона на пружинах — это и есть клиновой гаситель колебаний.": "The friction of the wedge on the plate damps the car's rocking on its springs — this is the friction wedge damper.", "Триангели": "Brake beams", "Треугольные тормозные балки у каждой колёсной пары. На концах — башмаки с тормозными колодками.": "Triangular brake beams at each wheelset. At the ends are heads with brake shoes.", "Триангель прижимает колодки сразу к обоим колёсам одной оси.": "A brake beam presses the shoes against both wheels of one axle at once.", "Колодки, прижимаемые к кругу катания колёс при торможении.": "Shoes pressed against the wheel treads when braking.", "На грузовых вагонах обычно ставят композиционные колодки.": "Freight cars usually use composition shoes.", "Подвески": "Hangers", "Подвески, на которых триангели висят на кронштейнах боковых рам.": "Hangers by which the brake beams hang from brackets on the side frames.", "Подвески позволяют триангелю свободно ходить к колесу и от него.": "The hangers let the brake beam move freely towards and away from the wheel.", "Вертикальные рычаги": "Vertical levers", "Рычаги, связанные с триангелями. Сверху к ним подходят тяги от тормозного цилиндра вагона.": "Levers linked to the brake beams. The rods from the car's brake cylinder come to them from above.", "Через рычаги усилие от одного цилиндра расходится на все колодки тележки.": "Through the levers the force from one cylinder is spread to all the bogie's shoes.", "Затяжка": "Bottom rod", "Тяга, соединяющая нижние концы вертикальных рычагов под надрессорной балкой.": "A rod connecting the lower ends of the vertical levers under the bolster.", "Затяжка заставляет оба триангеля тележки срабатывать одновременно.": "The bottom rod makes both brake beams of the bogie act at the same time.", "Двухосная тележка с осевой нагрузкой 23,5 т/ось — основная тележка грузовых вагонов колеи 1520 мм. Она несёт вагон, вписывает его в кривые и смягчает удары от пути. База тележки — 1850 мм.": "A two-axle bogie with a 23.5 t axle load — the main freight car bogie on 1520 mm gauge. It carries the car, steers it through curves and softens shocks from the track. The bogie wheelbase is 1850 mm.", "Две колёсные пары: на каждую ось наглухо напрессованы два колеса. Гребни колёс с внутренней стороны удерживают колёсную пару на рельсах. На концах оси — шейки под подшипники.": "Two wheelsets: two wheels pressed tightly onto each axle. The wheel flanges on the inside keep the wheelset on the rails. At the ends of the axle are the bearing journals.", "На шейке оси — кассетный подшипник, закрытый торцевой крышкой на болтах. Сверху на подшипник ложится адаптер, а на адаптер — буксовый проём боковой рамы.": "On the axle journal is a cartridge bearing closed by a bolted end cap. The adapter sits on top of the bearing, and the side frame's pedestal jaw sits on the adapter.", "Литые боковые рамы концами опираются на буксовые узлы. В середине рамы — рессорный проём: в нём стоят пружины и входит конец надрессорной балки. Колонки проёма облицованы фрикционными планками.": "The cast side frames rest at their ends on the axle boxes. In the middle of the frame is the spring window: it holds the springs and the end of the bolster. The window columns are lined with friction plates.", "Балка лежит концами на пружинах. В центре — подпятник с износостойкой прокладкой и шкворнем: в него входит пятник вагона. По бокам — скользуны под колпаками, они ограничивают качку кузова.": "The bolster rests on the springs at its ends. In the centre is the centre bowl with a wear liner and king pin: the car's centre plate sits in it. At the sides are side bearers under caps; they limit the body's roll.", "Пружины": "Springs", "Боковая рама показана прозрачной. В каждом рессорном проёме — комплект из семи двухрядных пружин: наружной и внутренней. Пружины смягчают толчки от неровностей пути.": "The side frame is shown transparent. Each spring window holds a set of seven double springs: outer and inner. The springs soften shocks from track irregularities.", "Клиновой га
