<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Интерактивные 3D-модели грузовых вагонов: устройство по узлам, экскурсия, погрузка и разгрузка, тест. Interactive 3D freight car models.">
<title>Грузовые вагоны в разборе</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-screen 3D test bench in a framed screen; info and controls float over it on desktop, stack under it on phones */
:root{
  --ink:#0d1620;
  --panel:rgba(13,22,31,.88);
  --line:rgba(150,185,210,.16);
  --line-strong:rgba(150,185,210,.32);
  --fg:#e4ebf0;
  --muted:#8c9fae;
  --accent:#f0b43c;
  --accent-ink:#1b1305;
  --ok:#5fc48a;
  --bad:#ef6b5b;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,.lbl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{position:relative;height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.viewport{position:absolute;inset:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));border-radius:22px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 50% 30%,#1c2d3c 0%,#0e1720 70%);touch-action:none;transition:background .4s}
.viewport canvas{display:block;width:100%;height:100%;cursor:grab}
.viewport canvas.drag{cursor:grabbing}
.viewport canvas.hot{cursor:pointer}
.viewport::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:22px;
  background-image:radial-gradient(circle,rgba(160,195,220,.22) 1px,transparent 1.2px);background-size:22px 22px;mask-image:linear-gradient(#000 0,transparent 18%,transparent 82%,#000 100%);-webkit-mask-image:linear-gradient(#000 0,transparent 18%,transparent 82%,#000 100%);opacity:.5}
.viewport[data-light="true"]::after{background-image:radial-gradient(circle,rgba(20,35,50,.25) 1px,transparent 1.2px)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.col-left{position:absolute;top:32px;left:calc(max(16px,env(safe-area-inset-left,0px)) + 16px);bottom:32px;width:330px;display:flex;flex-direction:column;gap:12px;pointer-events:none;z-index:3}
.col-left>*{pointer-events:auto}
.col-right{position:absolute;top:32px;right:calc(max(16px,env(safe-area-inset-right,0px)) + 16px);width:290px;max-height:calc(100% - 64px);overflow:auto;z-index:3;padding:16px;display:flex;flex-direction:column;gap:16px}
.tour{position:absolute;left:calc(max(16px,env(safe-area-inset-left,0px)) + 362px);right:calc(max(16px,env(safe-area-inset-right,0px)) + 322px);bottom:32px;z-index:3;display:flex;align-items:center;gap:8px;padding:8px}

/* Title card */
.title{padding:14px 18px 16px;flex:none}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;background:rgba(0,0,0,.22)}
.tabs button{border:0;background:transparent;border-radius:9px;padding:7px 6px;cursor:pointer;font-size:13px;line-height:1.2;color:var(--muted);text-align:center}
.tabs button small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;opacity:.85}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.langsw{display:flex;justify-content:flex-end;gap:2px;margin:-4px 0 8px}
.langsw button{border:1px solid var(--line);background:transparent;color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;padding:3px 9px;cursor:pointer}
.langsw button:first-child{border-radius:8px 0 0 8px}.langsw button:last-child{border-radius:0 8px 8px 0}
.langsw button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.subtabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.subtabs span{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.subtabs button{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.subtabs button:hover{color:var(--fg);border-color:var(--fg)}
.subtabs button[aria-selected="true"]{border-color:var(--accent);color:var(--fg);background:rgba(240,180,60,.16)}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.eyebrow i{width:8px;height:8px;border-radius:2px;background:var(--c,var(--accent));display:inline-block;flex:none}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.04;margin:8px 0 6px;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:0 0 12px;font-size:13px;text-wrap:pretty}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:rgba(255,255,255,.02)}
.stat small{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--fg);font-variant-numeric:tabular-nums}
.copy{margin:10px 0 0;font-size:11px;color:var(--muted,#8b9aa6);opacity:.85}
.applink{display:flex;align-items:center;gap:9px;margin-top:12px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:10px;color:var(--fg);text-decoration:none;font-size:13px;font-weight:500;background:rgba(240,180,60,.08);transition:background .15s,border-color .15s}
.applink:hover{background:rgba(240,180,60,.16);border-color:var(--accent)}
.applink svg{color:var(--accent);flex:none}
.applink span:last-child{margin-left:auto;color:var(--accent)}
.note{font-size:11.5px;color:var(--muted);margin:10px 0 0}

/* Info card */
.info{padding:18px;overflow:auto;min-height:0;flex:0 1 auto}
.info h2{font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.2;margin:8px 0 8px;text-wrap:balance}
.info p{margin:0 0 10px;color:#cdd7de;text-wrap:pretty}
.fact{border-left:2px solid var(--accent);padding:6px 0 6px 12px;margin:12px 0}
.fact b{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.fact p{margin:4px 0 0;color:var(--fg)}
.sect{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s}
.chip:hover{background:rgba(255,255,255,.06);border-color:var(--fg)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--accent))}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.btn{border:1px solid var(--line-strong);background:rgba(255,255,255,.03);border-radius:10px;padding:7px 12px;font-size:12.5px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn[aria-pressed="true"]{background:rgba(240,180,60,.2);border-color:var(--accent);color:var(--fg)}
.opts{display:grid;gap:6px;margin-top:6px}
.opt{text-align:left;border:1px solid var(--line-strong);background:rgba(255,255,255,.03);border-radius:10px;padding:9px 12px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--fg)}
.opt.ok{border-color:var(--ok);background:rgba(95,196,138,.14)}
.opt.bad{border-color:var(--bad);background:rgba(239,107,91,.14)}
.opt[disabled]{cursor:default}
.verdict{font-weight:600;margin:12px 0 6px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}

/* Controls */
.ctl-h{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ctl-h output{color:var(--accent);font-variant-numeric:tabular-nums;font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg3 .btn{padding:7px 4px;text-align:center}
.tog{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.02);cursor:pointer;font-size:12.5px;text-align:left}
.tog::after{content:"";flex:none;width:26px;height:14px;border-radius:999px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px var(--line-strong);
  background-image:radial-gradient(circle at 7px 7px,var(--muted) 4.5px,transparent 5px);transition:background .2s}
.tog[aria-pressed="true"]{border-color:rgba(240,180,60,.5)}
.tog[aria-pressed="true"]::after{background-color:rgba(240,180,60,.3);background-image:radial-gradient(circle at 19px 7px,var(--accent) 4.5px,transparent 5px)}
.legend{display:grid;gap:4px}
.leg{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:10px;border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 9px;cursor:pointer;text-align:left;font-size:13px}
.leg:hover{background:rgba(255,255,255,.05)}
.leg i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.leg small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.leg[aria-pressed="true"]{border-color:var(--c);background:rgba(255,255,255,.05)}
.swatches{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:9px;border:1px solid var(--line-strong);cursor:pointer;background:var(--c);padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.pick{position:relative;width:30px;height:30px;border-radius:9px;border:1px dashed var(--line-strong);overflow:hidden;display:grid;place-items:center;font-size:15px;color:var(--muted);cursor:pointer}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.help{font-size:11.5px;color:var(--muted);margin:0;line-height:1.55}
.help kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line-strong);border-radius:4px;padding:0 4px}

/* Tour strip */
.tour .arrow{flex:none;width:36px;height:52px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;font-size:18px}
.tour .arrow:hover{background:rgba(255,255,255,.08)}
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0;scroll-behavior:smooth}
.step{flex:none;display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-width:104px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);cursor:pointer;text-align:left}
.step .n{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
.step .t{font-size:12.5px;white-space:nowrap}
.step:hover{background:rgba(255,255,255,.06)}
.step[aria-current="step"]{border-color:var(--accent);background:rgba(240,180,60,.12);box-shadow:0 0 0 1px rgba(240,180,60,.25),0 0 22px rgba(240,180,60,.18)}
.step[aria-current="step"] .n{color:var(--accent)}

/* 3D labels */
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.flowcap{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));box-sizing:border-box;background:rgba(10,17,24,.9);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:9px 13px;font-size:13px;line-height:1.45;color:#e8eef3;pointer-events:none;z-index:4}
.locotag{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#f0b43c;color:#1a1408;z-index:3;transform:translate(-50%,-150%)}
.flowcap .tp-cap{min-height:2.9em}
.flowcap .tp-g{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:#aab8c4}
.flowcap .tp-h{width:72px;flex:none}
.flowcap .tp-c{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.flowcap .tp-c em{font-style:normal;opacity:.8}
.flowcap .tp-bar{display:block;width:100%;height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.flowcap .tp-bar i{display:block;height:100%;width:0;background:#ff8a2a}
.flowcap .tp-st{font-weight:600;font-size:11px;white-space:nowrap}
.flowcap .tp-sp{margin-top:6px;font-size:11px;color:#8b9aa6}
.flowcap .hm-r{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.flowcap .hm-r span{color:#aab8c4}
.flowcap .hm-r b{color:#e8eef3}
.flowcap .hm-r b.hm-bad{color:#ff6a5a}
.flowcap b{color:#f0b43c;font-weight:600}
.flowcap .fl{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:11.5px;color:#aab8c4}
.flowcap .fl i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:none;padding:0;cursor:pointer}
.lbl .dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 0 3px rgba(13,22,32,.7),0 0 12px var(--c,var(--accent))}
.lbl .stem{position:absolute;left:0;top:-30px;width:1px;height:30px;background:linear-gradient(transparent,var(--c,var(--accent)))}
.lbl .tag{position:absolute;left:-2px;top:-52px;white-space:nowrap;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:rgba(10,17,24,.9);border:1px solid var(--c,var(--accent));color:var(--fg)}
.lbl.sel .tag{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.lbl:hover .tag{background:#1b2a37}
.lbl.sel:hover .tag{background:var(--accent)}
.tip{position:absolute;left:0;top:0;pointer-events:none;font-size:12px;padding:4px 9px;border-radius:8px;background:rgba(10,17,24,.92);border:1px solid var(--line-strong);white-space:nowrap;transform:translate(14px,14px)}
.err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}

@media (max-width:1180px){
  .col-left{width:300px}
  .col-right{width:260px}
  .tour{left:calc(max(16px,env(safe-area-inset-left,0px)) + 332px);right:calc(max(16px,env(safe-area-inset-right,0px)) + 292px)}
}
@media (max-width:900px){
  html,body{height:auto}
  body{overflow:auto}
  .app{height:auto;display:flex;flex-direction:column;gap:12px}
  .viewport{position:relative;inset:auto;height:62vh;min-height:360px;order:1}
  .tour{position:static;order:2;padding:6px}
  .col-left{display:contents}
  .info{order:3}
  .col-right{position:static;width:auto;max-height:none;order:4}
  .title{order:0}
  .tour .arrow{height:48px;width:32px}
  h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* base reset for standalone hosting */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>


<div class="app">
  <div class="viewport" id="viewport">
    <div class="labels" id="labels"></div>
    <div class="flowcap" id="flowcap" hidden></div>
    <div class="locotag" id="locoTag" hidden></div>
    <div class="tip" id="tip" hidden></div>
  </div>

  <div class="col-left">
    <section class="panel title" aria-label="О стенде">
      <div class="langsw" role="group" aria-label="Language"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" id="tab-gondola" data-w="gondola" aria-selected="true" data-i18n>Полувагон<small>открытый</small></button>
        <button role="tab" id="tab-dumpcar" data-w="dumpcar" aria-selected="false" data-i18n>Думпкар<small>самосвал</small></button>
        <button role="tab" id="tab-hopper" data-w="hopper" aria-selected="false" data-i18n>Хоппер<small>крытый</small></button>
        <button role="tab" id="tab-platform" data-w="platform" aria-selected="false" data-i18n>Платформа<small>универсальная</small></button>
        <button role="tab" id="tab-tank" data-w="tank" aria-selected="false" data-i18n>Цистерна<small>нефтепродукты</small></button>
        <button role="tab" id="tab-boxcar" data-w="boxcar" aria-selected="false" data-i18n>Крытый<small>вагон</small></button>
        <button role="tab" id="tab-reefer" data-w="reefer" aria-selected="false" data-i18n>Рефрижератор<small>АРВ</small></button>
        <button role="tab" id="tab-transporter" data-w="transporter" aria-selected="false" data-i18n>Транспортёр<small>пониженный</small></button>
        <button role="tab" id="tab-bogie" data-w="bogie" aria-selected="false" data-i18n>Тележка<small>23,5 т/ось</small></button>
        <button role="tab" id="tab-brake" data-w="brake" aria-selected="false" data-i18n>Тормоз<small>рычажная передача</small></button>
        <button role="tab" id="tab-motion" data-w="motion" aria-selected="false" data-i18n>В пути<small>поезд, кривые, горка</small></button>
      </div>
      <div class="subtabs" id="subtabs" role="tablist" aria-label="Вариант груза" hidden></div>
      <h1 id="h1">Полувагон</h1>
      <p class="sub" id="sub"></p>
      <p class="note" id="note"></p>
      <a class="applink" id="appLink" href="https://play.google.com/store/apps/details?id=com.hfad.smgrapp&amp;hl=ru" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 18.2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n>Скачать приложение в&nbsp;Google&nbsp;Play</span><span aria-hidden="true">→</span></a>
      <p class="copy" data-i18n>© 2026 Вячеслав Шумилов. Все права защищены.</p>
    </section>
    <section class="panel info" id="info" aria-live="polite"></section>
  </div>

  <aside class="panel col-right" aria-label="Управление">
    <div>
      <div class="ctl-h"><label for="explode" data-i18n>Разборка</label><output id="exOut">0%</output></div>
      <input type="range" id="explode" min="0" max="100" value="0">
      <div class="seg">
        <button class="btn" id="btnAssemble" data-i18n>Собрать</button>
        <button class="btn" id="btnExplode" data-i18n>Разобрать</button>
      </div>
    </div>
    <div class="seg" id="tg" style="margin-top:0"></div>
    <div id="wseg"></div>
    <div>
      <div class="ctl-h"><span data-i18n>Узлы вагона</span><button class="btn" id="btnAll" style="padding:2px 8px;font-size:11px" data-i18n>Все</button></div>
      <div class="legend" id="legend"></div>
    </div>
    <div>
      <div class="ctl-h"><span data-i18n>Фон стенда</span></div>
      <div class="swatches" id="swatches"></div>

<script>
(function(){
"use strict";
const I18N_EN={"Тормозное оборудование собрано на одном конце вагона, над тележкой, под наклонным торцевым листом: запасный резервуар лежит поперёк вагона, рядом — воздухораспределитель на кронштейне и тормозной цилиндр. От цилиндра рычажная передача идёт к обеим тележкам. На другом конце, на концевой площадке, — штурвал стояночного тормоза.": "The brake equipment is grouped at one end of the car, above the bogie, under the sloped end sheet: the auxiliary reservoir lies across the car, with the control valve on a bracket and the brake cylinder next to it. From the cylinder the rigging runs to both bogies. At the other end, on the end platform, is the hand brake wheel.","Скачать приложение в&nbsp;Google&nbsp;Play":"Get the app on&nbsp;Google&nbsp;Play","<div class=\"err\">Не удалось загрузить 3D-движок. Проверьте подключение и обновите страницу.</div>": "<div class=\"err\">Couldn't load the 3D engine. Check your connection and reload the page.</div>", "Боковая рама": "Side frame", "Литая стальная рама сбоку тележки. Концами опирается на буксы, а в её центральное окно входит надрессорная балка.": "Cast steel frame on the side of the bogie. Its ends rest on the axle boxes, and the bolster fits into its central window.", "Боковые рамы и надрессорную балку отливают из стали — это самые массивные детали тележки.": "Side frames and the bolster are cast from steel — they are the heaviest parts of the bogie.", "Надрессорная балка": "Bolster", "Литая поперечная балка. На ней подпятник и скользуны, а сама она лежит на рессорных комплектах.": "Cast cross beam. It carries the centre bowl and side bearers and itself rests on the spring sets.", "Балка «плавает» на пружинах — так кузов отделён от ударов, которые идут от колёс.": "The bolster \"floats\" on springs — this isolates the body from shocks coming from the wheels.", "Подпятник": "Centre bowl", "Чашеобразная опора в центре надрессорной балки. В неё входит пятник вагона.": "Bowl-shaped support in the middle of the bolster. The car's centre plate sits in it.", "Трущиеся поверхности пятника и подпятника смазывают или ставят износостойкие вкладыши, чтобы тележка легко поворачивалась.": "The rubbing surfaces of the centre plate and bowl are lubricated or fitted with wear liners so the bogie turns easily.", "Скользуны": "Side bearers", "Опоры по краям надрессорной балки. Ограничивают боковой наклон кузова.": "Supports at the ends of the bolster. They limit the sideways roll of the body.", "Зазоры в скользунах нормированы и проверяются при каждом техническом обслуживании.": "Side bearer clearances are regulated and checked at every inspection.", "Рессорный комплект": "Spring set", "Цилиндрические пружины между боковой рамой и надрессорной балкой. Смягчают толчки от неровностей пути.": "Coil springs between the side frame and the bolster. They soften shocks from track irregularities.", "В тележке в каждом комплекте по семь двухрядных пружин (на модели показаны не все).": "Each set in this bogie has seven double coil springs (not all are shown on the model).", "Клиновой гаситель колебаний": "Friction wedge damper", "Фрикционные клинья между надрессорной балкой и боковой рамой. Трением гасят раскачивание вагона на пружинах.": "Friction wedges between the bolster and the side frame. Friction damps the rocking of the car on its springs.", "Без гасителя вагон раскачивался бы всё сильнее — как автомобиль без амортизаторов.": "Without a damper the car would rock more and more — like a car without shock absorbers.", "Буксовый узел": "Axle box", "Корпус с подшипниками на конце оси. Передаёт нагрузку от боковой рамы на шейку оси и даёт колёсной паре вращаться.": "Bearing unit on the end of the axle. It transfers the load from the side frame to the axle journal and lets the wheelset turn.", "В современных вагонах применяют кассетные подшипники: они долго работают без обслуживания.": "Modern cars use cartridge bearings: they run for a long time without maintenance.", "Колёсная пара": "Wheelset", "Ось и два колеса, напрессованных на неё наглухо. Колёса вращаются только вместе с осью.": "An axle with two wheels pressed on tightly. The wheels turn only together with the axle.", "Диаметр нового колеса по кругу катания — 957 мм. Между внутренними гранями колёс — 1440 мм, под колею 1520 мм.": "A new wheel is 957 mm in diameter at the tread. The distance between the inner wheel faces is 1440 mm, for 1520 mm gauge.", "Автосцепка СА-3": "SA-3 automatic coupler", "Сцепляет вагоны автоматически при соударении: замок одной автосцепки заходит за зуб другой.": "Couples cars automatically on impact: the lock of one coupler engages behind the knuckle of the other.", "Чтобы расцепить вагоны, людям не нужно заходить между ними — достаточно повернуть рычаг расцепного привода.": "To uncouple cars, nobody has to step between them — it's enough to turn the uncoupling lever.", "Поглощающий аппарат": "Draft gear", "Стоит в хребтовой балке за автосцепкой, в тяговом хомуте. Поглощает энергию ударов и рывков при трогании и торможении.": "Sits in the centre sill behind the coupler, in the yoke. It absorbs the energy of impacts and jerks when starting and braking.", "Бывают пружинно-фрикционные, эластомерные и гидравлические поглощающие аппараты.": "Draft gears can be spring-friction, elastomer or hydraulic.", "Расцепной привод": "Uncoupling lever", "Рычаг на концевой балке. Поворотом рукоятки поднимают замок автосцепки и расцепляют вагоны.": "Lever on the end sill. Turning the handle lifts the coupler lock and separates the cars.", "Рукоятка выведена к углу вагона, чтобы составитель работал сбоку, вне опасной зоны между вагонами.": "The handle is brought out to the corner of the car so the shunter works from the side, outside the danger zone between cars.", "Тормозная магистраль": "Brake pipe", "Труба вдоль всего вагона, соединённая рукавами с соседними. Через неё машинист управляет тормозами всего поезда.": "A pipe along the whole car, connected by hoses to the neighbouring cars. Through it the driver controls the brakes of the whole train.", "В отпущенном состоянии магистраль заряжена сжатым воздухом примерно до 5 кгс/см². Тормоз срабатывает, когда давление снижают.": "When released, the brake pipe is charged with compressed air to about 5 kgf/cm². The brake applies when the pressure is reduced.", "Концевой кран и рукав": "Angle cock and hose", "Перекрывают магистраль на конце вагона и соединяют её с магистралью соседнего вагона.": "Shut off the brake pipe at the end of the car and connect it to the brake pipe of the next car.", "Перекрытый концевой кран в середине поезда опасен: вагоны за ним остаются без управления тормозами.": "A closed angle cock in the middle of a train is dangerous: the cars behind it lose brake control.", "Воздухораспределитель": "Control valve", "«Мозг» тормоза вагона. При снижении давления в магистрали направляет воздух из запасного резервуара в тормозной цилиндр.": "The \"brain\" of the car's brake. When brake pipe pressure drops, it sends air from the auxiliary reservoir to the brake cylinder.", "На грузовых вагонах широко применяется воздухораспределитель усл. № 483.": "Freight cars widely use control valve No. 483.", "Запасный резервуар": "Auxiliary reservoir", "Баллон со сжатым воздухом на вагоне. Из него воздух идёт в тормозной цилиндр при торможении.": "A compressed-air tank on the car. When braking, air flows from it into the brake cylinder.", "В технической документации пишут именно «запасный», а не «запасной».": "Russian technical documents use a specific, slightly old-fashioned form of the word for this reservoir — a classic detail newcomers get wrong.", "Тормозной цилиндр": "Brake cylinder", "Сжатый воздух давит на поршень, шток выдвигается и через рычаги прижимает колодки к колёсам.": "Compressed air pushes the piston, the rod extends and, through levers, presses the brake shoes against the wheels.", "Один цилиндр тормозит обе тележки — усилие расходится по рычажной передаче.": "One cylinder brakes both bogies — the force is distributed through the brake rigging.", "Рычажная передача": "Brake rigging", "Система тяг и рычагов под рамой. Передаёт и распределяет усилие от штока цилиндра на тележки.": "A system of rods and levers under the frame. It transmits and distributes the force from the cylinder rod to the bogies.", "Авторегулятор в рычажной передаче сам компенсирует износ колодок.": "A slack adjuster in the rigging compensates for brake shoe wear automatically.", "Тормозные колодки": "Brake shoes", "Прижимаются к поверхности катания колёс и останавливают вагон трением. Закреплены на триангелях тележки.": "Pressed against the wheel treads, they stop the car by friction. Mounted on the bogie's brake beams.", "На грузовых вагонах обычно ставят композиционные колодки: они легче чугунных и служат дольше.": "Freight cars usually use composition shoes: they are lighter than cast iron ones and last longer.", "Тележки 23,5 т/ось": "Bogies, 23.5 t/axle", "Ходовая часть: две двухосные тележки, на которые кузов опирается пятниками.": "Running gear: two two-axle bogies that the body rests on through centre plates.", "Автосцепное устройство": "Coupling equipment", "Соединяет вагоны в поезд и смягчает удары между ними.": "Joins cars into a train and softens the impacts between them.", "Тормозное оборудование": "Brake equipment", "Автоматический пневматический тормоз: срабатывает на всех вагонах поезда сразу.": "Automatic air brake: it acts on every car of the train at once.", "<div class=\"err\">Ваш браузер не поддерживает WebGL, поэтому 3D-модель не показывается.</div>": "<div class=\"err\">Your browser doesn't support WebGL, so the 3D model can't be shown.</div>", "Общий вид": "Overview", "Полувагон: общий вид": "Gondola car: overview", "Полувагон — грузовой вагон с открытым верхом для сыпучих и навалочных грузов: угля, руды, щебня, металлолома, леса. Грузят его сверху, а разгружают через люки в полу или на вагоноопрокидывателе. Ниже — шесть основных узлов: нажмите любой, чтобы рассмотреть его отдельно.": "A gondola is an open-top freight car for bulk and loose cargo: coal, ore, crushed stone, scrap, timber. It is loaded from above and unloaded through floor hatches or on a rotary car dumper. Below are its six main assemblies: tap any to look at it separately.", "Кузов": "Body", "Кузов — «ящик» для груза: две боковые и две торцевые стены, стойки и верхняя обвязка. Вместе с рамой он работает как одна несущая конструкция: стены не только ограждают груз, но и помогают раме держать нагрузку.": "The body is the \"box\" for the cargo: two side walls, two end walls, stanchions and the top chord. Together with the frame it works as one load-bearing structure: the walls don't just hold the cargo, they also help the frame carry the load.", "Рама": "Frame", "Кузов поднят, чтобы показать раму. Её основа — хребтовая балка по всей длине вагона. Поперёк идут шкворневые и промежуточные балки, по краям — нижняя обвязка, по торцам — концевые балки. Через раму проходят все силы: и вес груза, и рывки при тяге.": "The body is lifted to show the frame. Its backbone is the centre sill running the full length of the car. Across it are the body bolsters and cross bearers, along the edges the side sills, and at the ends the end sills. All forces pass through the frame — both the weight of the cargo and the jerks of traction.", "Люки": "Hatches", "Разгрузочные люки": "Discharge hatches", "Пол полувагона почти целиком состоит из крышек люков. Они крепятся петлями у хребтовой балки и открываются вниз — груз высыпается сам. Так разгружают на эстакадах и над приёмными бункерами.": "The floor of a gondola is almost entirely made of hatch doors. They are hinged at the centre sill and open downwards — the cargo falls out by itself. This is how cars are unloaded on trestles and over receiving pits.", "Тележка": "Bogie", "Тележка 23,5 т/ось": "Bogie, 23.5 t/axle", "Кузов опирается на две двухосные тележки с осевой нагрузкой 23,5 т/ось — основной тележки грузовых вагонов колеи 1520 мм. В каждой: две колёсные пары, две боковые рамы, надрессорная балка и рессорное подвешивание.": "The body rests on two two-axle bogies with a 23.5 t axle load — the main freight car bogie on 1520 mm gauge. Each has two wheelsets, two side frames, a bolster and spring suspension.", "Тележка подробно": "Bogie in detail", "Как нагрузка доходит до рельса": "How the load reaches the rail", "Кузов → пятник → подпятник надрессорной балки → пружины → боковые рамы → буксы → колёсные пары → рельсы. Клиновые гасители рядом с пружинами не дают вагону раскачиваться.": "Body → centre plate → bolster centre bowl → springs → side frames → axle boxes → wheelsets → rails. The friction wedges next to the springs stop the car from rocking.", "Автосцепка": "Coupler", "На каждом конце вагона — автосцепка СА-3. За ней, внутри хребтовой балки, стоит поглощающий аппарат: он гасит удары при сцеплении и рывки при трогании. Рычаг расцепного привода позволяет расцепить вагоны, не заходя между ними.": "At each end of the car is an SA-3 coupler. Behind it, inside the centre sill, is the draft gear: it absorbs impacts when coupling and jerks when starting. The uncoupling lever lets you separate cars without stepping between them.", "Тормоз": "Brake", "Пневматический тормоз вынесен в сторону, чтобы его было видно. Магистраль заряжена сжатым воздухом; когда машинист снижает в ней давление, воздухораспределитель пускает воздух из запасного резервуара в тормозной цилиндр, а рычажная передача прижимает колодки к колёсам.": "The air brake equipment is moved aside so you can see it. The brake pipe is charged with compressed air; when the driver reduces the pressure, the control valve lets air from the auxiliary reservoir into the brake cylinder, and the rigging presses the shoes against the wheels.", "Разгрузка": "Unloading", "Разгрузка в действии": "Unloading in action", "Полувагон загружен углём. Крышки люков открываются, и груз уходит вниз, в приёмный бункер под путём. Вагоноопрокидыватель для этого не нужен.": "The gondola is loaded with coal. The hatch doors open and the cargo falls down into a receiving pit under the track. No rotary dumper is needed.", "Полувагон с глухим кузовом": "Solid-bottom gondola", "У этого полувагона нет люков в полу — кузов сплошной, «глухой». Такой кузов проще и прочнее, груз не просыпается в пути. Но разгрузить вагон можно только опрокидыванием — на вагоноопрокидывателе.": "This gondola has no floor hatches — the body is solid. Such a body is simpler and stronger, and no cargo leaks out in transit. But the car can only be unloaded by tipping it over — on a rotary car dumper.", "Глухой пол": "Solid floor", "Вместо крышек люков — сплошной стальной пол на поперечных балках рамы. Нет люков — нет и запоров, которые нужно проверять перед каждым рейсом.": "Instead of hatch doors there is a solid steel floor on the frame cross bearers. No hatches means no locks to check before every trip.", "Вагоноопрокидыватель": "Rotary dumper", "Опрокинуть ещё раз": "Tip again", "Разгрузка на вагоноопрокидывателе": "Unloading on a rotary car dumper", "Полувагон заезжает в ротор вагоноопрокидывателя. Сверху его прижимают к рельсам прижимными балками, сбоку он ложится на привалочную стенку. Ротор поворачивается почти вверх дном, и уголь высыпается в приёмный бункер под путём. Затем ротор возвращается, и прижимы поднимаются.": "The gondola runs into the rotor of the car dumper. Clamps press it down onto the rails from above, and it leans against the side wall. The rotor turns almost upside down and the coal falls into the receiving hopper under the track. Then the rotor turns back and the clamps lift.", "Полувагон": "Gondola car", "С люками": "With hatches", "Глухой кузов": "Solid body", "Полувагон с глухим кузовом: сплошной пол без люков, разгрузка — на вагоноопрокидывателе.": "Gondola with a solid body: a solid floor without hatches, unloaded on a rotary car dumper.", "Из каких узлов состоит четырёхосный полувагон для колеи 1520 мм. Нажмите на любую деталь модели.": "What a four-axle gondola car for 1520 mm gauge is made of. Tap any part of the model.", "Упрощённая модель: показывает общее устройство полувагона, без точных размеров.": "Simplified model: shows the general design of a gondola car, without exact dimensions.", "Кузов — это «ящик» для груза: стены, стойки и обвязка. Открыт сверху, поэтому грузить можно краном, грейфером, экскаватором или из бункера.": "The body is the \"box\" for the cargo: walls, stanchions and chords. It is open at the top, so it can be loaded by crane, grab, excavator or from a bunker.", "Рама — силовая основа вагона. Она несёт вес груза и передаёт все продольные силы в поезде.": "The frame is the structural base of the car. It carries the weight of the cargo and transmits all longitudinal forces in the train.", "Пол, который открывается вниз: груз высыпается сам, под действием силы тяжести.": "A floor that opens downwards: the cargo falls out by itself, under gravity.", "Боковая стена": "Side wall", "Обшивка из стального листа между стойками. Удерживает груз с боков и вместе с рамой работает как единая несущая конструкция.": "Steel sheet panels between the stanchions. They hold the cargo at the sides and work together with the frame as one load-bearing structure.", "Горизонтальные гофры на листе повышают жёсткость стены без лишней массы.": "Horizontal corrugations stiffen the wall without adding weight.", "Стойки боковой стены": "Side wall stanchions", "Вертикальные профили, приваренные снизу к нижней обвязке рамы, а сверху — к верхней обвязке. Принимают распор от груза.": "Vertical sections welded at the bottom to the side sill and at the top to the top chord. They resist the outward pressure of the cargo.", "Стойки ставят снаружи, чтобы внутренняя поверхность стены оставалась гладкой и груз не застревал при разгрузке.": "Stanchions are placed outside so the inner wall stays smooth and cargo doesn't get stuck when unloading.", "Верхняя обвязка": "Top chord", "Профиль по верхнему краю стен. Связывает стойки между собой и не даёт кузову «раскрываться» под нагрузкой.": "A section along the top edge of the walls. It ties the stanchions together and stops the body from \"opening up\" under load.", "При погрузке ковшом или грейфером удары чаще всего приходятся именно на верхнюю обвязку.": "When loading with a bucket or grab, impacts most often hit the top chord.", "Торцевая стена": "End wall", "Закрывает кузов с торцов. В современных моделях — глухая, усилена горизонтальными поясами.": "Closes the body at the ends. In modern designs it is solid and reinforced with horizontal belts.", "У старых полувагонов на торцах вместо глухих стен были двустворчатые двери.": "Older gondolas had double doors at the ends instead of solid walls.", "Лестницы и подножки": "Ladders and steps", "По ним поднимаются, чтобы осмотреть груз и проверить загрузку, а составитель держится за поручни при манёврах.": "Used to climb up to inspect the cargo and check the loading; the shunter holds the grab irons during switching.", "Лестницы ставят на торцах: там человек находится вне габарита соседнего пути.": "Ladders are placed at the ends: there a person stays clear of the adjacent track's clearance.", "Трафареты и знаки": "Stencils and markings", "Номер вагона, грузоподъёмность, масса тары, объём кузова, сведения о ремонтах.": "Car number, load capacity, tare weight, body volume, repair records.", "Номер полувагона на сети колеи 1520 мм восьмизначный и начинается с цифры 6 — по первой цифре определяют род вагона.": "A gondola number on the 1520 mm network has eight digits and starts with 6 — the first digit tells the car type.", "Хребтовая балка": "Centre sill", "Главная продольная балка рамы, проходит по всей длине вагона. Через неё от автосцепки передаются силы тяги и удара.": "The main longitudinal beam of the frame, running the full length of the car. Pulling and buffing forces from the coupler pass through it.", "Обычно её сваривают из двух Z-образных профилей; на концах внутри неё стоят поглощающие аппараты.": "It is usually welded from two Z-sections; the draft gears sit inside it at the ends.", "Шкворневая балка": "Body bolster", "Поперечная балка над тележкой. Собирает вес кузова и груза и передаёт его на тележку через пятник.": "Cross beam above the bogie. It collects the weight of the body and cargo and transfers it to the bogie through the centre plate.", "Расстояние между шкворневыми балками называют базой вагона.": "The distance between the body bolsters is called the car's truck centres (base).", "Пятник": "Centre plate", "Опора под шкворневой балкой. Входит в подпятник тележки — вокруг него тележка поворачивается в кривых.": "Support under the body bolster. It sits in the bogie's centre bowl — the bogie turns around it on curves.", "Пятник и подпятник — главная пара, через которую вес вагона уходит на тележку.": "The centre plate and centre bowl are the main pair through which the car's weight goes to the bogie.", "Поперечные балки": "Cross bearers", "Связывают хребтовую балку с нижними обвязками и служат опорой для крышек люков.": "They connect the centre sill to the side sills and support the hatch doors.", "Без поперечных балок рама работала бы как три отдельные балки; с ними она сопротивляется изгибу и кручению как одно целое.": "Without cross bearers the frame would act as three separate beams; with them it resists bending and twisting as one.", "Нижняя обвязка": "Side sill", "Продольные балки по краям рамы. К ним приварены стойки кузова и закреплены запоры люков.": "Longitudinal beams along the edges of the frame. The body stanchions are welded to them and the hatch locks are mounted on them.", "Нижняя обвязка одновременно служит нижним поясом боковой стены.": "The side sill also serves as the bottom chord of the side wall.", "Концевая балка": "End sill", "Замыкает раму с торца. На ней — ударная розетка автосцепки, кронштейны расцепного привода, подножки.": "Closes the frame at the end. It carries the coupler striker, the uncoupling lever brackets and steps.", "Ударная розетка принимает удар, если автосцепки сблизились сильнее допустимого, и защищает раму.": "The striker takes the blow if the couplers close up more than allowed, and protects the frame.", "Крышки люков": "Hatch doors", "Пол полувагона почти целиком состоит из крышек люков — на модели их 14. Они крепятся петлями у хребтовой балки и открываются вниз. На модели крышки над тележками открываются на меньший угол, чтобы не задевать тележку.": "The floor of a gondola is almost entirely made of hatch doors — 14 on the model. They are hinged at the centre sill and open downwards. On the model, doors above the bogies open to a smaller angle so they don't hit the bogie.", "Так разгружают на эстакадах и над приёмными бункерами, без вагоноопрокидывателя.": "This is how cars are unloaded on trestles and over receiving pits, without a rotary dumper.", "Сплошной стальной пол без люков, уложенный на поперечные балки рамы.": "A solid steel floor without hatches, laid on the frame cross bearers.", "Глухой кузов разгружают только опрокидыванием: на вагоноопрокидывателе вагон поворачивают почти вверх дном.": "A solid-body car can only be unloaded by tipping: on a rotary dumper the car is turned almost upside down.", "Запоры люков": "Hatch locks", "Удерживают крышку закрытой. Запорный механизм опирается на нижнюю обвязку рамы.": "Keep the door closed. The locking mechanism bears against the side sill.", "Незакрытый люк в пути — опасная неисправность: груз высыпается на путь, крышка может задеть стрелочный перевод.": "An unlocked hatch in transit is a dangerous fault: cargo spills onto the track and the door can hit a switch.", "Авторежим": "Empty/load device", "Автоматически меняет давление в тормозном цилиндре в зависимости от загрузки вагона.": "Automatically changes the brake cylinder pressure depending on how loaded the car is.", "Порожний вагон нельзя тормозить так же сильно, как гружёный: колёса пойдут юзом.": "An empty car can't be braked as hard as a loaded one: the wheels would slide.", "Уголь": "Coal", "Повторить разгрузку": "Repeat unloading", "Думпкар": "Dump car", "Четырёхосный вагон-самосвал для руды и скальных пород: кузов наклоняется сжатым воздухом и разгружается на любую сторону от пути.": "A four-axle tipping car for ore and rock: the body is tilted by compressed air and unloads to either side of the track.", "Упрощённая модель: показывает общее устройство думпкара, без точных размеров.": "Simplified model: shows the general design of a dump car, without exact dimensions.", "Опрокидывающийся «лоток» со своей рамой, полом и торцевыми стенками. Лежит на опорах рамы вагона и поворачивается относительно неё.": "A tipping \"tray\" with its own frame, floor and end walls. It rests on supports on the car frame and rotates relative to it.", "Борта": "Side doors", "Продольные откидные борта и механизм, который открывает их при наклоне кузова.": "Longitudinal drop sides and the mechanism that opens them when the body tilts.", "Рама вагона": "Car frame", "Неподвижная силовая основа: несёт кузов, опирается на тележки и передаёт силы в поезде.": "The fixed structural base: it carries the body, rests on the bogies and transmits forces in the train.", "Система опрокидывания": "Tipping system", "Пневматические цилиндры и отдельная разгрузочная магистраль, которые наклоняют кузов на 45°.": "Air cylinders and a separate unloading air line that tilt the body by 45°.", "Пол кузова": "Body floor", "Стальной настил, по которому груз съезжает при наклоне кузова.": "Steel deck down which the cargo slides when the body tilts.", "Пол думпкара поднят высоко над рельсами: под кузовом нужно место для цилиндров опрокидывания.": "The dump car floor is high above the rails: room is needed under the body for the tipping cylinders.", "Рама кузова": "Body frame", "Продольные и поперечные балки под полом. Лежат на опорах рамы вагона; в них упираются штоки цилиндров.": "Longitudinal and cross beams under the floor. They rest on supports on the car frame; the cylinder rods push against them.", "Кузов думпкара — отдельная конструкция со своей рамой: при разгрузке он поворачивается относительно рамы вагона.": "The dump car body is a separate structure with its own frame: when unloading it rotates relative to the car frame.", "Торцевые стенки": "End walls", "Закрывают кузов с торцов и усилены вертикальными рёбрами.": "Close the body at the ends and are reinforced with vertical ribs.", "Торцевые стенки не открываются: груз уходит только в сторону от пути.": "The end walls don't open: the cargo goes only to the side of the track.", "Номер вагона, грузоподъёмность, тара, объём кузова, модель и данные о ремонтах.": "Car number, load capacity, tare, body volume, model and repair records.", "Номер, который начинается с цифры 5, обычно означает собственный вагон: он принадлежит предприятию, а не парку перевозчика.": "A number starting with 5 usually means a privately owned car: it belongs to a company, not to the carrier's fleet.", "Продольные борта": "Drop sides", "Ограждают груз с боков. Закреплены шарнирно у пола: со стороны разгрузки борт откидывается и становится продолжением пола.": "Hold the cargo at the sides. They are hinged at the floor: on the unloading side the side drops and becomes an extension of the floor.", "Откинутый борт отводит груз дальше от пути, чтобы он не засыпал рельсы и шпалы.": "The dropped side throws the cargo further from the track so it doesn't bury the rails and sleepers.", "Шарниры бортов": "Side hinges", "Петли по нижнему краю борта, вокруг которых он поворачивается.": "Hinges along the bottom edge of the side that it pivots around.", "Шарниры работают в абразивной пыли руды и щебня, поэтому за их износом следят особенно внимательно.": "The hinges work in abrasive ore and stone dust, so their wear is watched especially closely.", "Механизм открывания бортов": "Side opening mechanism", "Рычаги и тяги, связанные с рамой вагона. При наклоне кузова они сами открывают борт со стороны разгрузки, а при возврате закрывают его.": "Levers and rods linked to the car frame. When the body tilts they open the side on the unloading side automatically, and close it when the body returns.", "Борт открывается автоматически: людям не нужно подходить к вагону во время разгрузки.": "The side opens automatically: nobody has to approach the car during unloading.", "Главная продольная балка рамы. Через неё от автосцепки передаются силы тяги и удара.": "The main longitudinal beam of the frame. Pulling and buffing forces from the coupler pass through it.", "Внутри хребтовой балки на обоих концах стоят поглощающие аппараты автосцепки.": "The coupler draft gears sit inside the centre sill at both ends.", "Шкворневые балки": "Body bolsters", "Поперечные балки над тележками. Передают вес кузова и груза на тележки через пятники.": "Cross beams above the bogies. They transfer the weight of the body and cargo to the bogies through the centre plates.", "Расстояние между ними называют базой вагона. У думпкара она короче, чем у полувагона: сам вагон короче.": "The distance between them is called the car's base. A dump car's base is shorter than a gondola's because the car itself is shorter.", "Связывают хребтовую балку с продольными. На двух из них, опущенных ниже, стоят цилиндры опрокидывания.": "They connect the centre sill to the side beams. Two of them, set lower, carry the tipping cylinders.", "Балки под цилиндрами принимают всю реакцию от подъёма гружёного кузова.": "The beams under the cylinders take the full reaction of lifting a loaded body.", "Продольные балки рамы": "Frame side beams", "Балки по краям рамы между тележками. Вместе с поперечными балками несут опоры кузова.": "Beams along the edges of the frame between the bogies. Together with the cross bearers they carry the body supports.", "Рама думпкара остаётся неподвижной при разгрузке — наклоняется только кузов.": "The dump car frame stays still during unloading — only the body tilts.", "Замыкает раму с торца. На ней — ударная розетка автосцепки и кронштейны расцепного привода.": "Closes the frame at the end. It carries the coupler striker and the uncoupling lever brackets.", "Опоры кузова": "Body supports", "Кронштейны по краям рамы, на которых лежит кузов. Со стороны разгрузки они работают как шарниры поворота, с другой стороны кузов от них приподнимается.": "Brackets along the edges of the frame on which the body rests. On the unloading side they act as pivot hinges; on the other side the body lifts off them.", "Ось поворота проходит через опоры той стороны, куда идёт разгрузка, — поэтому разгружать можно на обе стороны.": "The pivot axis passes through the supports on the unloading side — that's why the car can unload to either side.", "Переходная площадка": "End platform", "Площадка с ограждением только на одном конце вагона. На ней стоит штурвал стояночного тормоза. С другого конца площадки нет: кузов доходит до края концевой балки рамы.": "A platform with railings at one end of the car only. The hand brake wheel is on it. There is no platform at the other end: the body reaches the edge of the end sill.", "С площадки составитель работает на торце вагона, не спускаясь на междупутье.": "From the platform the shunter works at the end of the car without stepping down between the tracks.", "Подножки и поручни": "Steps and grab irons", "Ступени на углах рамы и поручни: на ограждении площадки с одного конца и на торцевой стенке кузова с другого. Нужны для подъёма на площадку и работы при манёврах.": "Steps at the corners of the frame and grab irons: on the platform railing at one end and on the body end wall at the other. Used to climb onto the platform and during switching.", "Поручни и подножки нельзя загораживать грузом или снимать — это требование безопасности.": "Grab irons and steps must not be blocked by cargo or removed — this is a safety requirement.", "Цилиндры опрокидывания": "Tipping cylinders", "Четыре пневматических цилиндра, по два с каждой стороны. Чтобы разгрузить вагон на одну сторону, воздух подают в цилиндры противоположной стороны — они поднимают кузов.": "Four air cylinders, two on each side. To unload to one side, air is fed to the cylinders on the opposite side — they lift the body.", "Рабочее давление — 0,6 МПа (6 кгс/см²); кузов наклоняется на 45°.": "Working pressure is 0.6 MPa (6 kgf/cm²); the body tilts by 45°.", "Разгрузочная магистраль": "Unloading air line", "Отдельная от тормозной магистраль сжатого воздуха вдоль вагона. По ней воздух для разгрузки идёт от локомотива ко всем думпкарам состава.": "A compressed-air line along the car, separate from the brake pipe. Through it, air for unloading goes from the locomotive to every dump car in the train.", "Поэтому на каждом торце думпкара два рукава: тормозной и разгрузочной магистрали.": "That's why each end of a dump car has two hoses: for the brake pipe and for the unloading line.", "Краны управления разгрузкой": "Unloading control valves", "Направляют воздух из разгрузочной магистрали в цилиндры нужной стороны и выпускают его при возврате кузова.": "Send air from the unloading line to the cylinders on the required side and release it when the body returns.", "Когда воздух из цилиндров выпускают, пустой кузов возвращается на место под собственным весом.": "When air is released from the cylinders, the empty body returns to place under its own weight.", "Стояночный тормоз": "Hand brake", "Штурвал на переходной площадке. Через винт, цепь и рычаги прижимает колодки без сжатого воздуха.": "A wheel on the end platform. Through a screw, chain and levers it applies the brake shoes without compressed air.", "Стояночный тормоз удерживает вагон на уклоне и после отцепки от состава.": "The hand brake holds the car on a gradient and after it is uncoupled from the train.", "Думпкар: общий вид": "Dump car: overview", "Думпкар — вагон-самосвал для руды, щебня и вскрышных пород. Люков в полу у него нет: весь кузов наклоняется на 45° на любую сторону от пути, а борт со стороны разгрузки откидывается. Нажмите на узел, чтобы рассмотреть его отдельно.": "A dump car is a tipping wagon for ore, crushed stone and overburden. It has no floor hatches: the whole body tilts 45° to either side of the track, and the side on the unloading side drops. Tap an assembly to look at it separately.", "Кузов думпкара — отдельный «лоток» со своей рамой, полом и торцевыми стенками. Он не приварен к раме вагона, а лежит на опорах и может поворачиваться относительно неё.": "The dump car body is a separate \"tray\" with its own frame, floor and end walls. It isn't welded to the car frame — it rests on supports and can rotate relative to it.", "Откидные борта": "Drop sides", "Продольные борта закреплены шарнирами у пола. Когда кузов наклоняется, механизм открывания сам откидывает борт со стороны разгрузки, и борт становится продолжением пола.": "The longitudinal sides are hinged at the floor. When the body tilts, the opening mechanism drops the side on the unloading side, and the side becomes an extension of the floor.", "Кузов поднят, чтобы показать раму. Как и у полувагона, её основа — хребтовая балка, а вес на тележки передают шкворневые балки. По краям — опоры кузова, ближе к середине — опущенные балки с цилиндрами опрокидывания.": "The body is lifted to show the frame. As on a gondola, its backbone is the centre sill, and the body bolsters carry the weight to the bogies. Along the edges are the body supports; nearer the middle are the lowered beams with the tipping cylinders.", "Опрокидывание": "Tipping", "Как наклоняется кузов": "How the body tilts", "Цилиндров четыре — по два с каждой стороны. Воздух подают в цилиндры стороны, противоположной разгрузке: они выдвигаются и поворачивают кузов вокруг опор. Когда воздух выпускают, пустой кузов возвращается на место под собственным весом.": "There are four cylinders — two on each side. Air is fed to the cylinders on the side opposite to unloading: they extend and rotate the body around the supports. When the air is released, the empty body returns under its own weight.", "Ходовая часть та же, что у полувагона: две тележки 23,5 т/ось.": "The running gear is the same as on the gondola: two 23.5 t/axle bogies.", "Автосцепка СА-3, поглощающий аппарат и расцепной привод — такие же, как у полувагона. Буферов у думпкара нет.": "The SA-3 coupler, draft gear and uncoupling lever are the same as on the gondola. A dump car has no buffers.", "Тормоз и стояночный тормоз": "Brake and hand brake", "Автоматический пневматический тормоз устроен как у полувагона. Дополнительно есть стояночный тормоз: его штурвал стоит на переходной площадке. Тормозное оборудование выдвинуто вперёд, а разгрузочная магистраль опущена, чтобы их было видно.": "The automatic air brake works as on the gondola. There is also a hand brake: its wheel is on the end platform. The brake equipment is moved forward and the unloading line lowered so you can see them.", "Думпкар загружен рудой. Цилиндры поднимают кузов, борт откидывается, и груз ложится рядом с путём, а пустой кузов возвращается на место. Попробуйте разгрузить на другую сторону.": "The dump car is loaded with ore. The cylinders lift the body, the side drops and the cargo lands beside the track, then the empty body returns. Try unloading to the other side.", "Руда": "Ore", "Наклон кузова": "Body tilt", "К нам": "Towards us", "Ровно": "Level", "От нас": "Away", "Разгрузить к нам": "Unload towards us", "Разгрузить от нас": "Unload away", "Загрузить снова": "Reload", "Хоппер": "Hopper car", "Крытый вагон-бункер для зерна и других сыпучих грузов, которые нужно беречь от влаги. Грузят сверху, разгружают вниз через люки бункеров.": "A covered hopper car for grain and other bulk cargo that must be kept dry. Loaded from above, unloaded downwards through the hopper outlets.", "Упрощённая модель: показывает общее устройство крытого хоппера-зерновоза, без точных размеров.": "Simplified model: shows the general design of a covered grain hopper, without exact dimensions.", "Закрытый несущий кузов: боковые и торцевые стены, наклонные торцевые листы и бункеры. У хоппера кузов сам работает как главная несущая балка вагона.": "An enclosed load-bearing body: side and end walls, sloped end sheets and hoppers. In a hopper car the body itself works as the main load-bearing beam.", "Крыша и загрузка": "Roof and loading", "Крыша защищает груз от дождя и снега. В ней загрузочные люки, а сверху проложены ходовые мостики.": "The roof protects the cargo from rain and snow. It has loading hatches, and running boards along the top.", "Разгрузочные устройства": "Discharge equipment", "Люки в днище бункеров и привод, который их открывает. Груз высыпается вниз самотёком.": "Outlets in the bottom of the hoppers and the drive that opens them. The cargo flows down by gravity.", "Рама и площадки": "Frame and platforms", "Две консольные части рамы над тележками, концевые площадки и лестницы на крышу.": "Two stub frame sections over the bogies, end platforms and ladders to the roof.", "Гладкий стальной лист. Вместе с обвязками и стойками образует высокую балку, которая несёт груз между тележками.": "Smooth steel sheet. Together with the chords and stanchions it forms a deep beam that carries the cargo between the bogies.", "Над тележками нижний край стены поднимается вслед за наклонными торцевыми листами, освобождая место для тележки.": "Over the bogies the bottom edge of the wall rises along the sloped end sheets, making room for the bogie.", "Стойки": "Stanchions", "Вертикальные профили снаружи боковых стен. Связывают верхнюю и нижнюю обвязки и не дают стене выпучиваться под давлением груза.": "Vertical sections outside the side walls. They tie the top and bottom chords together and stop the wall bulging under cargo pressure.", "Давление сыпучего груза на стены растёт с глубиной, поэтому внизу стены нагружены сильнее всего.": "Bulk cargo pressure on the walls grows with depth, so the walls are loaded most at the bottom.", "Продольный профиль по верху боковых стен. На него опирается крыша.": "A longitudinal section along the top of the side walls. The roof rests on it.", "Верхняя и нижняя обвязки работают как пояса балки: при изгибе кузова одна сжимается, другая растягивается.": "The top and bottom chords work as the flanges of a beam: when the body bends, one is compressed and the other stretched.", "Профиль по нижнему краю боковой стены. Над тележками он идёт под углом, вдоль наклонного края стены.": "A section along the bottom edge of the side wall. Over the bogies it runs at an angle, along the sloped edge of the wall.", "Нижняя обвязка — растянутый пояс кузова: под весом груза кузов прогибается, и она работает на растяжение.": "The bottom chord is the tension flange of the body: under the cargo weight the body sags and the chord works in tension.", "Вертикальная верхняя часть торца кузова. Ниже неё начинается наклонный торцевой лист.": "The vertical upper part of the body end. Below it the sloped end sheet begins.", "Рядом с торцевой стеной стоит лестница для подъёма на крышу.": "Next to the end wall is the ladder to the roof.", "Наклонный торцевой лист": "Sloped end sheet", "Лист, наклонённый над тележкой. Направляет груз из концевой части кузова к крайнему бункеру.": "A sheet sloping over the bogie. It guides cargo from the end of the body to the outer hopper.", "Наклон делают круче угла естественного откоса груза, иначе часть груза останется лежать в вагоне.": "The slope is steeper than the cargo's angle of repose, otherwise some cargo would stay in the car.", "Бункеры": "Hoppers", "Нижняя часть кузова — шесть воронок: три вдоль вагона и по две поперёк, по обе стороны от его оси. Наклонные стенки сводят груз к разгрузочным люкам.": "The lower part of the body is six funnels: three along the car and two across, on either side of its centre line. The sloped walls guide the cargo to the outlets.", "Слово «хоппер» пришло из английского: hopper — бункер, воронка.": "The word \"hopper\" comes from English and means a funnel-shaped bin.", "Подкосы": "Diagonal braces", "Наклонные стойки по бокам вагона. Верхним концом крепятся к боковой стене кузова, нижним — к концу шкворневой балки. Наклонены от кузова к концу вагона.": "Sloping struts on the sides of the car. The top end is fixed to the body side wall, the bottom end to the end of the body bolster. They slope from the body towards the end of the car.", "Подкосы передают часть веса кузова на шкворневую балку: стена, балка и подкос образуют жёсткий треугольник.": "The braces carry part of the body weight to the bolster: wall, bolster and brace form a rigid triangle.", "Номер вагона, грузоподъёмность, тара, объём кузова, род груза, сведения о ремонтах.": "Car number, load capacity, tare, body volume, cargo type, repair records.", "На специализированных хопперах пишут род груза, например «Для зерна»: в такой вагон нельзя грузить удобрения или цемент.": "Specialised hoppers are marked with the cargo type, e.g. \"For grain\": such a car must not be loaded with fertiliser or cement.", "Крыша": "Roof", "Сплошная крыша из стальных листов с подъёмом к середине, чтобы вода стекала к краям.": "A solid steel roof that rises towards the middle so water runs off to the edges.", "Защита от влаги — главная причина возить зерно в крытых хопперах, а не в полувагонах.": "Protection from moisture is the main reason grain travels in covered hoppers rather than gondolas.", "Загрузочные люки": "Loading hatches", "Через них вагон загружают сверху — из рукавов элеватора или по транспортёру. На модели четыре люка; откройте их, чтобы увидеть загрузку.": "The car is loaded through them from above — from elevator spouts or a conveyor. The model has four hatches; open them to see loading.", "Крышки люков закрывают на уплотнение и пломбируют, чтобы груз не намок и не пропал в пути.": "The hatch covers close on a seal and are sealed so the cargo doesn't get wet or go missing in transit.", "Ходовые мостики": "Running boards", "Решётчатые настилы на крыше. По ним проходят к загрузочным люкам.": "Grating walkways on the roof. They lead to the loading hatches.", "Подниматься на крышу под контактным проводом нельзя: на электрифицированных путях это смертельно опасно даже без касания провода.": "Never climb onto the roof under an overhead contact wire: on electrified track it is deadly even without touching the wire.", "Горловины внизу каждого из шести бункеров. Через них груз высыпается в приёмный бункер между рельсами.": "Outlets at the bottom of each of the six hoppers. Through them the cargo falls into a receiving pit between the rails.", "Разгружают на эстакадах или над приёмными ямами: груз уходит самотёком, вагон не нужно опрокидывать.": "Unloading takes place on trestles or over receiving pits: the cargo flows out by gravity, the car doesn't need tipping.", "Крышки разгрузочных люков": "Outlet gates", "Две створки на каждом люке. В пути они закрыты и заперты, при разгрузке открываются вниз.": "Two gate leaves on each outlet. In transit they are closed and locked; when unloading they open downwards.", "Перед отправкой проверяют, что все крышки закрыты и заперты: открытая в пути створка — потеря груза и опасность для пути.": "Before departure all gates are checked to be closed and locked: a gate opening in transit means lost cargo and a danger to the track.", "Привод люков": "Outlet drive", "Поперечный вал с рычагами открывает пару люков, стоящих рядом поперёк вагона. На одной стороне вагона вал выведен в кронштейн со штурвалом: люки открывают, вращая штурвал сбоку вагона.": "A transverse shaft with levers opens a pair of outlets standing side by side across the car. On one side of the car the shaft ends in a bracket with a handwheel: the outlets are opened by turning the handwheel from the side of the car.", "Так работник стоит сбоку вагона, а не под ним, — вне зоны падающего груза.": "This way the worker stands beside the car, not under it — out of the way of falling cargo.", "Хребтовая балка консоли": "Stub centre sill", "Короткая хребтовая балка в концевой части рамы. В ней стоят поглощающий аппарат и хвостовик автосцепки.": "A short centre sill in the end section of the frame. It houses the draft gear and coupler shank.", "У многих хопперов хребтовая балка есть только в консольных частях рамы. Между тележками продольные силы передаёт сам кузов.": "Many hopper cars have a centre sill only in the stub sections of the frame. Between the bogies the body itself carries the longitudinal forces.", "Расстояние между шкворневыми балками — база вагона.": "The distance between the body bolsters is the car's base.", "Замыкает раму с торца. На ней ударная розетка автосцепки и кронштейны расцепного привода.": "Closes the frame at the end. It carries the coupler striker and the uncoupling lever brackets.", "Концевые площадки": "End platforms", "Площадки с ограждением на обоих концах вагона. С них поднимаются на крышу, на одной стоит штурвал стояночного тормоза.": "Platforms with railings at both ends of the car. From them you climb onto the roof; one carries the hand brake wheel.", "С площадки работают на торце вагона, не спускаясь на междупутье.": "From the platform you work at the end of the car without stepping down between the tracks.", "Подножки под концевыми балками и вертикальные лестницы у торцевых стен — путь на площадку и на крышу.": "Steps under the end sills and vertical ladders at the end walls — the way up to the platform and the roof.", "Лестницы стоят на разных концах по диагонали вагона, и каждая выводит к поперечному мостику на крыше.": "The ladders are at opposite ends, diagonally across the car, and each leads to a cross walkway on the roof.", "Штурвал на концевой площадке. Через винт, цепь и рычаги прижимает колодки без сжатого воздуха.": "A wheel on the end platform. Through a screw, chain and levers it applies the brake shoes without compressed air.", "Стояночный тормоз удерживает вагон, например, на разгрузочной эстакаде, когда локомотив отцеплен.": "The hand brake holds the car, for example on an unloading trestle when the locomotive is uncoupled.", "Хоппер: общий вид": "Hopper car: overview", "Хоппер — вагон-бункер для сыпучих грузов, которые нужно беречь от влаги: зерна, цемента, минеральных удобрений. Грузят его сверху через люки в крыше, а разгружают вниз, через люки в днище бункеров. На стенде — крытый хоппер для зерна.": "A hopper is a bin car for bulk cargo that must be kept dry: grain, cement, mineral fertiliser. It is loaded from above through roof hatches and unloaded downwards through outlets in the bottom of the hoppers. Shown here is a covered grain hopper.", "Кузов хоппера закрытый и несущий. Боковые стены вместе с обвязками и стойками работают как высокая балка между тележками. Над тележками кузов сужается книзу: наклонные торцевые листы сводят груз к крайним бункерам.": "The hopper's body is enclosed and load-bearing. The side walls with their chords and stanchions work as a deep beam between the bogies. Over the bogies the body narrows downwards: the sloped end sheets guide the cargo to the outer hoppers.", "Включён рентген: нижняя часть кузова — шесть воронок-бункеров, три вдоль вагона и по две поперёк. Их стенки наклонены круче угла естественного откоса груза, поэтому зерно ссыпается к люкам само.": "X-ray is on: the lower part of the body is six hopper funnels, three along the car and two across. Their walls are steeper than the cargo's angle of repose, so the grain slides to the outlets by itself.", "Крыша и загрузочные люки": "Roof and loading hatches", "Крыша защищает зерно от дождя и снега. В ней четыре загрузочных люка с откидными крышками — сейчас они открыты. Вдоль люков проложены ходовые мостики, на крышу поднимаются по лестницам с концевых площадок. Подниматься на крышу под контактным проводом нельзя.": "The roof protects the grain from rain and snow. It has four loading hatches with hinged covers — they are open now. Running boards run along the hatches; you climb onto the roof by ladders from the end platforms. Never climb onto the roof under an overhead contact wire.", "Кузов поднят. Рама хоппера — две консольные части над тележками: короткая хребтовая балка, шкворневая и концевая балки. Здесь же концевые площадки, подножки и лестницы на крышу.": "The body is lifted. The hopper's frame is two stub sections over the bogies: a short centre sill, body bolster and end sill. Here too are the end platforms, steps and roof ladders.", "Под каждым из шести бункеров — люк с двумя створками. Три поперечных вала привода заканчиваются штурвалами на одной стороне вагона: люки открывают сбоку, не подлезая под вагон.": "Under each of the six hoppers is an outlet with two gate leaves. Three transverse drive shafts end in handwheels on one side of the car: the outlets are opened from the side, without crawling under the car.", "Ходовая часть та же, что у полувагона и думпкара: две тележки 23,5 т/ось с колёсными парами, боковыми рамами, надрессорной балкой и рессорным подвешиванием.": "The running gear is the same as on the gondola and dump car: two 23.5 t/axle bogies with wheelsets, side frames, bolster and spring suspension.", "Автосцепка СА-3 и поглощающий аппарат стоят в короткой хребтовой балке консоли. Расцепной привод проходит под концевой площадкой.": "The SA-3 coupler and draft gear sit in the short stub centre sill. The uncoupling lever runs under the end platform.", "Пневматический тормоз устроен как у других грузовых вагонов; его оборудование выдвинуто в сторону. На одной из концевых площадок — штурвал стояночного тормоза.": "The air brake works as on other freight cars; its equipment is moved aside. One of the end platforms carries the hand brake wheel.", "Хоппер загружен зерном, рентген показывает его уровень. Створки люков открываются, и зерно уходит вниз, в приёмный бункер между рельсами. Наклонные стенки бункеров не оставляют груза в вагоне.": "The hopper is loaded with grain; x-ray shows its level. The outlet gates open and the grain falls into a receiving pit between the rails. The sloped hopper walls leave no cargo in the car.", "Загрузка": "Loading", "Загрузить заново": "Load again", "Загрузка через люки в крыше": "Loading through roof hatches", "Пустой хоппер ставят под элеватор. Крышки загрузочных люков открывают, сверху опускаются загрузочные рукава, и зерно сыплется в вагон. Рентген показывает, как зерно заполняет бункеры и поднимается до крыши. Когда вагон полон, рукава поднимают, а крышки люков закрывают и пломбируют.": "The empty hopper is placed under an elevator. The loading hatch covers are opened, loading spouts come down from above and grain pours into the car. X-ray shows the grain filling the hoppers and rising to the roof. When the car is full, the spouts are raised and the hatch covers are closed and sealed.", "Зерно": "Grain", "Люки сверху": "Top hatches", "Люки снизу": "Bottom outlets", "Разгрузить": "Unload", "Кузова у платформы нет, всю нагрузку несёт рама. Хребтовая и боковые балки рыбообразные: в середине выше, к концам ниже, потому что сильнее всего рама изгибается посередине между тележками. Поперечные балки связывают их в одно целое.": "A flat car has no body; the frame carries the whole load. The centre and side sills are fish-belly shaped: deeper in the middle and shallower at the ends, because the frame bends most in the middle between the bogies. Cross bearers tie them together.", "Ходовая часть та же, что у других вагонов на стенде: две тележки 23,5 т/ось с колёсными парами, боковыми рамами, надрессорной балкой и рессорным подвешиванием.": "The running gear is the same as on the other cars here: two 23.5 t/axle bogies with wheelsets, side frames, bolster and spring suspension.", "Автосцепка СА-3 и поглощающий аппарат стоят в хребтовой балке на концах рамы. Рычаг расцепного привода выведен к углу платформы.": "The SA-3 coupler and draft gear sit in the centre sill at the ends of the frame. The uncoupling lever is brought out to the corner of the flat car.", "Пневматический тормоз устроен как у других грузовых вагонов; оборудование выдвинуто в сторону. Штурвал стояночного тормоза стоит на углу рамы, у тележки.": "The air brake works as on other freight cars; the equipment is moved aside. The hand brake wheel is at the corner of the frame, by the bogie.", "Платформа: общий вид": "Flat car: overview", "Универсальная платформа — вагон без кузова, с деревянным полом и невысокими откидными бортами. Возит металл, технику, контейнеры, лес и колёсные пары. Грузят её краном сверху, а технику — своим ходом через торцевые борта. Здесь груз — колёсные пары; вариант для леса — на вкладке «Лес».": "A general-purpose flat car has no body, a wooden deck and low drop sides. It carries metal, machinery, containers, timber and wheelsets. It is loaded by crane from above, and vehicles drive on over the end boards. Here the load is wheelsets; the timber version is under the «Timber» tab.", "Пол и борта": "Deck and sides", "Пол — деревянный настил на балках рамы: к нему прибивают бруски, которыми крепят груз. По краям стоят невысокие откидные борта — продольные и торцевые. В поднятом положении их держат запоры.": "The deck is wooden planking on the frame beams: blocks that secure the cargo are nailed to it. Along the edges are low drop sides — longitudinal and end. In the raised position they are held by locks.", "Борта откинуты": "Sides dropped", "Откинутые борта": "Dropped sides", "Продольные борта опускаются вниз вдоль рамы, если груз шире пола. Торцевые ложатся горизонтально и служат переездным мостиком: по ним техника переезжает с платформы на платформу через весь состав.": "The side boards drop down along the frame if the load is wider than the deck. The end boards fold flat and act as bridge plates: vehicles drive from car to car along the whole train over them.", "Погрузка": "Loading", "Погрузить заново": "Load again", "Погрузка колёсных пар": "Loading wheelsets", "Колёсные пары грузят краном по одной, на траверсе с двумя стропами. Их ставят поперёк платформы, вплотную друг к другу, и сразу подбивают упорными брусками.": "Wheelsets are loaded by crane one at a time on a spreader bar with two slings. They are placed across the car, tight against each other, and chocked straight away.", "Крепление": "Securing", "Крепление груза": "Securing the load", "Каждую колёсную пару держат упорные бруски, прибитые к деревянному полу между колёсами. Крайние пары дополнительно удерживают проволочные растяжки к раме. Схему крепления для каждого груза задают технические условия размещения и крепления грузов.": "Each wheelset is held by chocks nailed to the wooden deck between the wheels. The end wheelsets are also held by wire lashings to the frame. The securing scheme for each load is set by the technical rules for loading and securing cargo.", "Платформа для леса": "Timber flat car", "Ту же универсальную платформу оборудуют для перевозки леса: в стоечные скобы вставляют стойки, а на концах ставят решётчатые торцевые стены. Брёвна укладывают вдоль платформы в два штабеля.": "The same general-purpose flat car is equipped for timber: stakes go into the stake pockets and lattice bulkheads are fitted at the ends. Logs are stacked lengthwise in two piles.", "Стойки и стяжки": "Stakes and ties", "Стойки вставляют в стоечные скобы на боковых балках рамы — по восемь с каждой стороны. Они не дают брёвнам раскатиться в стороны. Верхушки противоположных стоек связывают проволочными стяжками, чтобы под давлением груза стойки не разошлись.": "Stakes go into the stake pockets on the side sills — eight on each side. They stop logs rolling off sideways. The tops of opposite stakes are tied together with wire so they don't spread under the load.", "Торцевые стены": "End bulkheads", "На концах платформы стоят решётчатые торцевые стены. При толчках и торможении брёвна по инерции стремятся сдвинуться вдоль вагона — стена принимает этот удар на себя. Решётка не мешает видеть груз и легче сплошного листа.": "Lattic
