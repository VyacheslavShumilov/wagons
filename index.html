  },
  /* trigger time of each vehicle's brake and its target deceleration */
  brakeOf(ctx,i,t){
    const r=x=>clamp(x,0,1);
    if(ctx.mode==='ept')return TN_A*r(t/TN_FILL);
    if(ctx.mode==='pre'){const T0=ctx.preT;if(T0==null)return i===0?.06*r(t/1):0;if(i===0)return .06+(TN_A-.06)*r((t-T0)/TN_FILL);return TN_A*r((t-T0-i*TN_TAU)/TN_FILL);}
    return TN_A*r((t-i*TN_TAU)/TN_FILL);
  },
  trigT(ctx,i){return ctx.mode==='ept'?0:ctx.mode==='pre'?(ctx.preT==null?99:ctx.preT)+i*TN_TAU:i*TN_TAU;},
  simStep(ctx,h){
    const n=ctx.veh.length,F=new Array(n).fill(0),t=ctx.st;
    for(let j=0;j<n-1;j++){
      const e=TN_G-(ctx.u[j+1]-ctx.u[j]),vr=ctx.v[j+1]-ctx.v[j];let f=0;
      if(e<-TN_G)f=TN_K*(-TN_G-e)+TN_C*vr;else if(e>TN_G)f=-TN_K*(e-TN_G)+TN_C*vr;
      if(e<-TN_G&&f<0)f=0;if(e>TN_G&&f>0)f=0;
      /* f>0 pushes rear back and front forward */
      F[j]+=f;F[j+1]-=f;
      const J=ctx.junc[j];if(ctx.e[j]>=-TN_G&&e<-TN_G&&vr>.04){J.max=Math.max(J.max,vr);if(vr>.3){J.fl=Math.min(1,vr*1.4);J.hit=1;}}
      ctx.e[j]=e;
    }
    if(ctx.mode==='pre'&&ctx.preT==null&&t>1&&(ctx.e.every(x=>x<-TN_G*.8)||t>26))ctx.preT=t;
    for(let i=0;i<n;i++){
      const V=ctx.veh[i],ac=F[i]/V.m,b=t>0?this.brakeOf(ctx,i,t):0;
      let a;
      if(ctx.v[i]>1e-3)a=ac-b;else{a=Math.abs(ac)<=b?0:ac-Math.sign(ac)*b;if(a<0&&ctx.v[i]<=0)a=0;}
      ctx.v[i]=Math.max(0,ctx.v[i]+a*h);ctx.u[i]+=ctx.v[i]*h;
    }
  },
  CAP:{
    run:'Поезд идёт в тяге, автосцепки растянуты. Сейчас машинист затормозит…',
    pn1:'Машинист снизил давление в магистрали. Волна разрядки бежит от локомотива к хвосту — вагоны начинают тормозить по очереди.',
    pn2:'Голова поезда уже тормозит, а хвост ещё катится — задние вагоны набегают на передние, зазоры в автосцепках закрываются с ударом.',
    ept:'ЭПТ: команда на торможение пришла по проводу на все вагоны сразу. Вагоны тормозят вместе и не набегают друг на друга.',
    pre1:'Сначала локомотив слегка подтормаживает: вагоны мягко, без ударов набегают друг на друга и сжимают состав (этот этап показан ускоренно).',
    pre2:'Теперь пневматическое торможение: зазоры уже выбраны, поэтому удары слабые.',
    stop:'Поезд остановился.'
  },
  renderPanel(ctx){
    const names=['Лок.','1','2','3','4'],jn=['Л–1','1–2','2–3','3–4'];
    flowCap.innerHTML=`<div class="tp-cap"></div><div class="tp-g"><span class="tp-h">${esc('Цилиндры')}</span>`+names.map(n=>`<span class="tp-c"><i class="tp-bar"><i></i></i><em>${esc(n)}</em></span>`).join('')+
      `</div><div class="tp-g"><span class="tp-h">${esc('Сцепки')}</span>`+jn.map(n=>`<span class="tp-c tp-j"><b class="tp-st"></b><em>${esc(n)}</em></span>`).join('')+`</div><div class="tp-sp"></div>`;
    ctx.ui={cap:flowCap.querySelector('.tp-cap'),bars:[...flowCap.querySelectorAll('.tp-bar i')],js:[...flowCap.querySelectorAll('.tp-st')],sp:flowCap.querySelector('.tp-sp'),key:'',lang:LANG};
  },
  anim(ctx,dt,e,w){
    ctx.t+=dt;
    const sim=!!ctx.mode,n=ctx.veh.length;
    if(sim){
      if(ctx.st>=0||ctx.phase!=='run'||!ctx.hold)ctx.st+=dt;
      if(ctx.st>=0){const sc=ctx.mode==='pre'&&ctx.preT==null?2.5:1,D=dt*sc,H=1/240,K=Math.ceil(D/H);if(sc>1)ctx.st+=dt*(sc-1);for(let k=0;k<K;k++)this.simStep(ctx,D/K);}
      else for(let i=0;i<n;i++)ctx.u[i]+=ctx.v[i]*dt;
      if(ctx.st>=0&&ctx.v.every(v=>v<1e-3)){ctx.stopT+=dt;if(ctx.stopT>4.5&&!ctx.hold){ctx.reset();}}
    }else{for(let i=0;i<n;i++)ctx.u[i]+=TN_V0*dt;}
    /* scroll track with the locomotive */
    const v0=sim?ctx.v[0]:TN_V0;ctx.dist=(ctx.dist+v0*dt)%5.5;ctx.slp.position.x=ctx.dist%.55;
    /* place vehicles relative to the locomotive */
    const u0=sim?ctx.u[0]:0;
    ctx.veh.forEach((V,i)=>{V.g.position.x=V.X-(sim?ctx.u[i]-u0:0);});
    for(let j=0;j<n-1;j++){
      const A=ctx.veh[j],B=ctx.veh[j+1],J=ctx.junc[j];
      const pa=new V3(A.g.position.x+A.half,1.06,0),pb=new V3(B.g.position.x-B.half,1.06,0);
      seg(J.bar,pa,pb);
      const ej=sim?ctx.e[j]:TN_G;
      J.bar.material.color.copy(lin(ej>TN_G*.6?0x4fbf6a:ej<-TN_G*.6?0xe0473a:0x8a8f94));
      seg(J.hose,new V3(pa.x-.15,1.0,1.68),new V3(pb.x+.15,1.0,1.68));
      J.fl=Math.max(0,J.fl-dt*1.6);J.flash.visible=J.fl>.01;
      if(J.flash.visible){J.flash.position.set((pa.x+pb.x)/2,1.1,0);J.flash.scale.setScalar(.6+1.6*(1-J.fl)*Math.min(1.4,.4+J.max));J.flash.material.opacity=J.fl*.9;}
      J.hit=Math.max(0,(J.hit||0)-dt*1.2);
    }
    /* pressures */
    const t=sim?ctx.st:-1;
    ctx.veh.forEach((V,i)=>{
      const tt=this.trigT(ctx,i);
      const pp=sim&&ctx.mode!=='ept'&&t>tt?clamp((t-tt)/.5,0,1):0;
      V.pipe.material.color.copy(lin(TRN.PIPE)).lerp(lin(TRN.PIPE_LO),pp);
      const cf=sim&&t>0?this.brakeOf(ctx,i,t)/TN_A:0;V.cf=cf;
      V.cyl.material.color.copy(lin(TRN.CYL)).lerp(lin(TRN.CYL_ON),cf);
      const hot=cf*(ctx.v[i]>1e-3||!sim?1:.3);
      for(const m of V.shoes)m.material.color.copy(lin(TRN.SHOE)).lerp(lin(TRN.SHOE_ON),hot);
    });
    ctx.junc.forEach((J,j)=>{J.hose.material.color.copy(ctx.veh[j].pipe.material.color);});
    /* wave marker */
    const wv=sim&&ctx.mode!=='ept'&&t>=this.trigT(ctx,0)&&t<=this.trigT(ctx,n-1)+.4;
    ctx.wave.visible=wv;
    if(wv){const f=clamp((t-this.trigT(ctx,0))/TN_TAU,0,n-1+.5),i0=Math.min(n-1,Math.floor(f)),fr=f-i0;
      const A=ctx.veh[i0],B=ctx.veh[Math.min(n-1,i0+1)];
      const xa=A.g.position.x-(i0===0?A.half:0),xb=i0+1<n?B.g.position.x:B.g.position.x+B.half;
      ctx.wave.position.set(xa+(xb-xa)*Math.min(1,fr),1.0,1.68);ctx.wave.scale.setScalar(1+.25*Math.sin(ctx.t*14));}
    ctx.wire.visible=ctx.mode==='ept';
    if(ctx.wire.visible)ctx.wire.material.emissive.setHex(t>0&&t<1.2?0xffc400:0x000000),ctx.wire.material.emissiveIntensity=1;
    /* panel */
    if(sim&&ctx.ui){
      if(ctx.ui.lang!==LANG)this.renderPanel(ctx);
      let key='run';
      if(ctx.st>=0){
        if(ctx.v.every(v=>v<1e-3))key='stop';
        else if(ctx.mode==='ept')key='ept';
        else if(ctx.mode==='pre')key=ctx.preT==null?'pre1':'pre2';
        else key=ctx.st<this.trigT(ctx,n-1)?'pn1':'pn2';
      }
      let capTxt=tr(this.CAP[key]);
      if(key==='stop'){const jn=['Л–1','1–2','2–3','3–4'];let mi=-1,mv=.3;ctx.junc.forEach((J,j)=>{if(J.max>mv){mv=J.max;mi=j;}});
        capTxt+=' '+(mi<0?tr('Ударов в автосцепках не было.'):tr('Самый сильный удар — в сцепке')+' '+tr(jn[mi])+'.');}
      if(ctx.ui.key!==capTxt){ctx.ui.key=capTxt;ctx.ui.cap.textContent=capTxt;}
      ctx.veh.forEach((V,i)=>{ctx.ui.bars[i].style.width=Math.round(V.cf*100)+'%';});
      ctx.junc.forEach((J,j)=>{const el=ctx.ui.js[j],ej=ctx.e[j];
        const st=J.hit>.05?['удар!','#ff5a4a']:ej>TN_G*.6?['растянута','#4fbf6a']:ej<-TN_G*.6?['сжата','#e0873a']:['зазор','#9aa3aa'];
        const tx=tr(st[0]);if(el.textContent!==tx)el.textContent=tx;el.style.color=st[1];});
      const kmh=Math.round(ctx.v[0]/TN_V0*60);ctx.ui.sp.textContent=tr('Скорость')+': '+kmh+' '+tr('км/ч')+' · '+tr('время замедлено');
      flowCap.hidden=e>.02;
    }
    return false;
  },
  applyStep(s,w,ctx){
    ctx.mode=s.sim||null;ctx.hold=false;ctx.reset();
    for(const J of ctx.junc){J.fl=0;J.flash.visible=false;}
    if(ctx.mode){this.renderPanel(ctx);flowCap.hidden=false;}else{flowCap.hidden=true;ctx.ui=null;}
  },
  onCargo(){},
  action(name,w,ctx){
    if(!ctx.mode)return;
    if(name==='reset'){ctx.reset();ctx.hold=true;}
    else if(name==='run'){ctx.reset();ctx.st=0;ctx.hold=true;}
  }
};

      add(car,Bx(12.4,.22,.14),0x3a3f44,'car_body',0,1.2,s*1.45);

  place(ctx){
    const k=ctx.kc,a=CV_A;
    const P=(s,o,out)=>{if(Math.abs(k)<1e-6){out.set(s,0,o);return 0;}const th=k*s;out.set(Math.sin(th)/k+o*Math.sin(th),0,-(1-Math.cos(th))/k+o*Math.cos(th));return th;};
    const dz=Math.abs(k)<1e-6?0:(1-Math.cos(k*a))/k;
    ctx.trk.position.z=dz;
    const v=new V3();
    for(const r of ctx.railSeg){const th=P(r.s,r.o,v);r.m.position.set(v.x,-.08,v.z);r.m.rotation.y=th;}
    for(const b of ctx.bal){const th=P(b.s,0,v);b.m.position.set(v.x,-.31,v.z);b.m.rotation.y=th;}

  },
  anim(ctx,dt,e,w){
    ctx.t+=dt;
    const kt=w.curve?1/CV_R:0;
    if(Math.abs(ctx.kc-kt)>1e-6||ctx.k<0){ctx.kc=reduce?kt:ctx.kc+(kt-ctx.kc)*Math.min(1,dt*1.8);if(Math.abs(ctx.kc-kt)<2e-5)ctx.kc=kt;ctx.k=1;this.place(ctx);}
    const ct=w.cant&&w.curve?CV_CANT:0;

    const sp=w.roll&&!reduce&&e<.02?2.2:0;
    ctx.off=(ctx.off+sp*dt)%.55;
    const k=ctx.kc,dz=ctx.trk.position.z,n=ctx.slp.length,v=new V3();
    for(let i=0;i<n;i++){const s=-CV_L+i*.55-ctx.off;const th=k*s;
      if(Math.abs(k)<1e-6)v.set(s,0,0);else v.set(Math.sin(th)/k,0,-(1-Math.cos(th))/k);
      const m=ctx.slp[i];m.position.set(v.x,-.23,v.z);m.rotation.y=th;}
    for(const bc of ctx.bog)for(const g of bc.wsG)g.rotation.z-=sp/R*dt;
    for(const r of ctx.rings)r.visible=!!ctx.showRings;
    ctx.flange.visible=!!ctx.showFlange;
    if(ctx.flange.visible){const s=1+.25*Math.sin(ctx.t*8);ctx.flange.scale.setScalar(s);}
    /* info line */
    const ang=Math.asin(Math.min(1,CV_A*ctx.kc))*180/PI;
    const txt=tr('Радиус кривой на модели')+': '+(ctx.kc>1e-4?Math.round(1/ctx.kc)+' '+tr('м'):'∞')+' · '+tr('поворот каждой тележки относительно кузова')+': '+ang.toFixed(1).replace('.',LANG==='ru'?',':'.')+'°';
    if(ctx.cap!==txt){ctx.cap=txt;flowCap.textContent=txt;}
    flowCap.hidden=e>.02;
    return false;
  },
  applyStep(s,w,ctx){w.curve=!!s.curve;w.roll=s.roll!==false;w.cant=!!s.cant;ctx.showRings=!!s.rings;ctx.showFlange=!!s.flange;ctx.cap=null;flowCap.hidden=false;},
  onCargo(){},action(){}
};

    ctx.arrows.coup=mkArrow(0xff4a3a);ctx.arrows.cargo=mkArrow(0xffa040);ctx.arrows.cut=mkArrow(0xff4a3a);
    REG.sysAnchor={...REG.sysAnchor,yard:anchor(root,-40,hmY(-40)+.1,1.2),retarder:anchor(root,RC,.3,1),cut:anchor(ctx.cut[1].g,0,4.5,0)};
    ctx.reset=sc=>{
      ctx.sc=sc;ctx.hold=0;ctx.peakF=0;ctx.peakA=0;ctx.peakD=0;ctx.F=0;ctx.closed=false;ctx.rOn=0;ctx.done=0;ctx.dPrev=0;ctx.since=99;ctx.aCar=0;
      const st={idle:[-62,0],full:[-62,.25],ret:[-36,4.8],soft:[-11,1.39],hard:[-11,3.33]}[sc]||[-62,0];
      ctx.x=st[0];ctx.v=st[1];ctx.vt=1.42;

  },
  axles(x){const b=PL_BOG,a=.925;return [x-b-a,x-b+a,x+b-a,x+b+a];},
  step(ctx,h){

    const ax=this.axles(ctx.x);let a=-HM.G*ax.reduce((s,q)=>s+hmS(q),0)/4-(ctx.v>0?HM.FR:0);
    const inR=this.axles(ctx.x).filter(q=>q>HM.RX0&&q<HM.RX1).length;
    const brake=inR>0&&ctx.v>ctx.vt&&(ctx.sc!=='hard');
    ctx.rT=brake?1:0;
    if(brake)a-=HM.RB*inR/4*2;
    /* coupling with the first standing car */
    const n=ctx.cut.length,F=new Array(n+1).fill(0);
    const d0=(ctx.cut[0].x-ctx.cut[0].half)-(ctx.x+HM.FACE);
    const mkF=(gap,vrel,j)=>{const d=Math.max(0,-gap);if(d<=0)return 0;
      let f=d<=HM.D0?HM.K1*d:HM.K1*HM.D0+HM.K2*(d-HM.D0);if(vrel<0)f*=HM.UNL;return f;};
    const f0=mkF(d0,ctx.v-ctx.cut[0].v,0);F[0]-=f0;F[1]+=f0;
    ctx.F=f0;const dd=Math.max(0,-d0);if(dd>ctx.peakD)ctx.peakD=dd;if(dd>HM.D0)ctx.closed=true;
    for(let j=0;j<n-1;j++){const A=ctx.cut[j],B=ctx.cut[j+1];const g=(B.x-B.half)-(A.x+A.half);const f=mkF(g,A.v-B.v,j+1);F[j+1]-=f;F[j+2]+=f;}
    const mCar=90e3;
    const aCar=a+F[0]/mCar;ctx.aCar=F[0]/mCar;
    ctx.v=Math.max(0,ctx.v+aCar*h);ctx.x+=ctx.v*h;
    ctx.cut.forEach((d,i)=>{let ac=F[i+1]/d.m;if(d.v>0)ac-=HM.FS;d.v=Math.max(0,d.v+ac*h);d.x+=d.v*h;});
    if(f0>ctx.peakF)ctx.peakF=f0;
    const ag=Math.abs(ctx.aCar)/HM.G;if(ag>ctx.peakA)ctx.peakA=ag;
  },
  anim(ctx,dt,e,w){
    ctx.t+=dt;

    const K=Math.ceil(sd/.0005),h=sd/K;for(let k=0;k<K;k++)this.step(ctx,h);

    /* place the car on the profile */
    const b=PL_BOG,y1=hmY(ctx.x-b),y2=hmY(ctx.x+b);
    ctx.carG.position.set(ctx.x,(y1+y2)/2,0);ctx.carG.rotation.z=Math.atan2(y2-y1,2*b);
    ctx.cut.forEach(d=>{d.g.position.x=d.x;});
    if(!reduce)for(const m of ctx.marks)m.rotation.z-=ctx.v/R*sd;
    const axs=this.axles(ctx.x),inZ=axs.filter(q=>q>HM.RX0-.3&&q<HM.RX1+.3),fx=inZ.length?Math.max(...inZ):clamp(axs[3],HM.RX0,HM.RX1+.3);
    if(ctx.follow&&!tween){cam.t.x+=(fx-cam.t.x)*Math.min(1,dt*4);}
    ctx.clamp.visible=ctx.rOn>.5&&e<.02;if(ctx.clamp.visible)ctx.clamp.position.x=fx;
    /* retarder beams */
    const rt=ctx.rT||0;ctx.rOn+=(rt-ctx.rOn)*Math.min(1,dt*8);
    for(const B of ctx.beams){B.m.position.z=B.z0+B.dir*.026*ctx.rOn;B.m.material.color.copy(lin(0x6e7680)).lerp(lin(0xff6a2a),ctx.rOn*.7);}

      spawnP(q,.1+Math.random()*.25,z,(Math.random()-.3)*2.5,1+Math.random()*2.2,(Math.random()-.5)*1.5,-.3);}}
    /* cargo inertia nudge */
    if(ctx.pl.cargo){const s=clamp(ctx.aCar/HM.G,-6,6);ctx.pl.cargo.position.x=-.025*s;}
    /* arrows */
    const hold=ctx.peakF>2e4&&ctx.since<3,show=hold&&e<.02,FA=Math.max(ctx.F,ctx.peakF);
    const A=ctx.arrows,y0=ctx.carG.position.y;

    if(show){const L=clamp(FA/1e6*1.4,.4,6);
      A.coup.position.set(ctx.x+HM.FACE-.6,y0+1.6,1.7);A.coup.rotation.y=PI;A.coup.userData.sh.scale.y=L;A.coup.userData.sh.position.x=-.2-L/2;A.coup.userData.hd.position.x=0;
      A.coup.userData.hd.rotation.z=-PI/2;
      A.cut.position.set(ctx.cut[0].x-ctx.cut[0].half+.6,1.6,1.7);A.cut.rotation.y=0;A.cut.userData.sh.scale.y=L*.8;A.cut.userData.sh.position.x=-.2-L*.4;

    /* panel */
    if(ctx.sc!=='idle'){
      const kmh=(ctx.v*3.6).toFixed(1),fmt=x=>LANG==='ru'?String(x).replace('.',','):String(x);

        [tr('Сила в автосцепке'),fPk>.01?fmt(fNow.toFixed(2))+' '+tr('МН')+' ('+tr('пик')+' '+fmt(fPk.toFixed(2))+' '+tr('МН')+')':'—'],
        [tr('Ход поглощающих аппаратов'),ctx.peakD>.001?Math.round(ctx.peakD*1000)+' '+tr('мм')+(ctx.closed?' — '+tr('аппараты закрылись!'):''):'—'],
        [tr('Перегрузка платформы и груза'),ctx.peakA>.01?fmt(ctx.peakA.toFixed(1))+' g':'—']];
      const html=rows.map(r=>`<div class="hm-r"><span>${esc(r[0])}</span><b${r[1].includes('!')?' class="hm-bad"':''}>${esc(r[1])}</b></div>`).join('');
      if(ctx.html!==html){ctx.html=html;flowCap.innerHTML=html;}

    }else flowCap.hidden=true;

  },
  applyStep(s,w,ctx){ctx.reset(s.sc||'idle');ctx.follow=!!s.follow;ctx.html=null;clearP();},

const cam={t:new V3(0,1.7,0),th:.58,ph:1.2,r:19};
let tween=null;
function setView(v,dur=950){
  const to={t:new V3().fromArray(v.t),th:v.th,ph:v.ph,r:v.r};
  while(to.th-cam.th>PI)to.th-=2*PI;while(to.th-cam.th<-PI)to.th+=2*PI;
  if(reduce||dur===0){cam.t.copy(to.t);cam.th=to.th;cam.ph=to.ph;cam.r=to.r;tween=null;return;}
  tween={from:{t:cam.t.clone(),th:cam.th,ph:cam.ph,r:cam.r},to,start:performance.now(),dur};
}
function updateCam(){
  const sp=Math.sin(cam.ph);
  camera.position.set(cam.t.x+cam.r*sp*Math.sin(cam.th),cam.t.y+cam.r*Math.cos(cam.ph),cam.t.z+cam.r*sp*Math.cos(cam.th));
  camera.lookAt(cam.t);
}

stepsEl.addEventListener('click',e=>{const b=e.target.closest('.step');if(b)goStep(+b.dataset.i);});
tgEl.addEventListener('click',e=>{
  const b=e.target.closest('.tog');if(!b)return;const k=b.dataset.k;
  if(k==='xray'){state.xray=!state.xray;applyVisual();}
  else if(k==='labels'){state.labels=!state.labels;renderLabels();}
  else{const wk=k.slice(2);state.w[wk]=!state.w[wk];if(wk==='cargo'&&state.w.cargo)W.onCargo(state.w,CTX);}
  renderCtrl();
});
wsegEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-k]');if(!b)return;const v=+b.dataset.v;
  clearTimeout(actTimer);state.w[b.dataset.k]=v;if(CTX)CTX.returnAt=0;if(v!==0)setExplode(0);renderCtrl();
});
$('#prev').onclick=()=>goStep(Math.max(0,state.step-1));
$('#next').onclick=()=>goStep(Math.min(W.STEPS.length-1,state.step+1));
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.w!==W.id)loadWagon(b.dataset.w);}));
$('#subtabs').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b||!W.setVariant||b.dataset.v===W.variant)return;W.setVariant(b.dataset.v);loadWagon(W.id,true);});

const exInput=$('#explode'),exOut=$('#exOut');
function setExplode(v){state.explode=clamp(v,0,1);exInput.value=Math.round(state.explode*100);exOut.textContent=Math.round(state.explode*100)+'%';}
exInput.addEventListener('input',()=>setExplode(exInput.value/100));
$('#btnAssemble').onclick=()=>setExplode(0);
$('#btnExplode').onclick=()=>setExplode(1);
$('#btnAll').onclick=()=>isolate(null);
$('#btnQuiz').onclick=()=>quizStart();
$('#btnReset').onclick=()=>goStep(0);

function renderCtrl(){
  tgEl.querySelectorAll('.tog').forEach(b=>{const k=b.dataset.k;const v=k==='xray'?state.xray:k==='labels'?state.labels:!!state.w[k.slice(2)];b.setAttribute('aria-pressed',v);});
  wsegEl.querySelectorAll('[data-k]').forEach(b=>b.setAttribute('aria-pressed',state.w[b.dataset.k]===+b.dataset.v));
  legend.querySelectorAll('.leg').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===state.sys));
  stepsEl.querySelectorAll('.step').forEach((b,i)=>{if(i===state.step&&!state.quiz)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
}
function refresh(){applyVisual();renderInfo();renderLabels();renderCtrl();}

/* Background */
const BGS=[['Ночь','#0e1720'],['Графит','#1b1c1f'],['Чертёж','#0f3557'],['Цех','#c9d0d6'],['Белый','#f3f4f5']];
const swEl=$('#swatches');
swEl.innerHTML=BGS.map(b=>`<button class="sw" style="--c:${b[1]}" data-c="${b[1]}" title="${esc(b[0])}" aria-label="${L('Фон','Background')}: ${esc(b[0])}" aria-pressed="false"></button>`).join('')+`<label class="pick" title="${L('Свой цвет','Custom colour')}">+<input type="color" id="bgPick" value="#0e1720" aria-label="${L('Свой цвет фона','Custom background colour')}"></label>`;
const bgPick=$('#bgPick');
function setBg(hex){
  const c=new THREE.Color(hex),hsl={};c.getHSL(hsl);const light=hsl.l>.55;
  const center=c.clone().lerp(new THREE.Color(0xffffff),light?.45:.1);
  viewport.style.background=`radial-gradient(120% 90% at 50% 30%,#${center.getHexString()} 0%,${hex} 70%)`;
  viewport.dataset.light=light;
  scene.fog.color.copy(lin(hex));
  const tone=light?new THREE.Color(0x000000):new THREE.Color(0xffffff);
  ground.material.color.copy(c.clone().lerp(tone,light?.08:.035).convertSRGBToLinear());
  if(grid){scene.remove(grid);grid.geometry.dispose();grid.material.dispose();}
  grid=new THREE.GridHelper(80,80,c.clone().lerp(tone,.2).convertSRGBToLinear(),c.clone().lerp(tone,.1).convertSRGBToLinear());
  grid.position.y=-.365;scene.add(grid);
  swEl.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c.toLowerCase()===hex.toLowerCase()));
  bgPick.value=hex;store.set('wagonBg',hex);
}
swEl.addEventListener('click',e=>{const b=e.target.closest('.sw');if(b)setBg(b.dataset.c);});
bgPick.addEventListener('input',()=>setBg(bgPick.value));

/* ================= Actions ================= */
function ensureVisible(id){const need=W.P[id].ex||0;if(state.explode<need)setExplode(need);}
function selectPart(id,focus){state.part=id;ensureVisible(id);refresh();if(focus)focusPart(id);}
function isolate(sys){state.sys=sys;state.part=null;if(state.quiz)state.quiz=null;refresh();}
function goStep(i){
  const s=W.STEPS[i];state.step=i;state.quiz=null;state.part=null;state.sys=s.sys||null;state.xray=!!s.xray;
  clearTimeout(actTimer);setExplode(s.ex);W.applyStep(s,state.w,CTX);
  setView(s.cam);refresh();
  const b=stepsEl.children[i];if(b)stepsEl.scrollTo({left:b.offsetLeft-(stepsEl.clientWidth-b.offsetWidth)/2,behavior:reduce?'auto':'smooth'});
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function quizStart(){state.quiz={n:0,total:8,score:0,used:[],q:null,done:false};state.sys=null;state.xray=false;Object.assign(state.w,W.init(),{cargo:false});quizNext();}
function quizNext(){
  const q=state.quiz;
  if(q.n>=q.total){q.done=true;state.part=null;refresh();return;}
  const ids=Object.keys(W.P).filter(id=>!q.used.includes(id)&&id!=='marking'&&REG.meshesOf[id]&&!(W.quizSkip||[]).includes(W.P[id].sys));
  const target=ids[Math.floor(Math.random()*ids.length)];q.used.push(target);
  const same=shuffle(partsOf(W.P[target].sys).filter(x=>x!==target)).slice(0,2);
  const other=shuffle(Object.keys(W.P).filter(x=>x!==target&&!same.includes(x)&&REG.meshesOf[x]));
  q.q={target,opts:shuffle([target,...same,...other].slice(0,4)),ans:null};q.n++;
  state.part=target;ensureVisible(target);refresh();focusPart(target);
}
function quizAnswer(id){const q=state.quiz;if(!q||!q.q||q.q.ans)return;q.q.ans=id;if(id===q.q.target)q.score++;renderInfo();}
function quizExit(){state.quiz=null;goStep(state.step);}

function disposeTree(o){o.traverse(n=>{if(n.geometry&&!n.userData.glb)n.geometry.dispose();if(n.material)(Array.isArray(n.material)?n.material:[n.material]).forEach(mt=>{if(mt.map)mt.map.dispose();mt.dispose();});});}
function loadWagon(id,keepCam){
  clearTimeout(actTimer);flowCap.hidden=true;locoTag.hidden=true;
  if(curRoot){scene.remove(curRoot);disposeTree(curRoot);}
  W=WAGONS[id]||GONDOLA;
  {const fg=W.fog||[34,80];scene.fog.near=fg[0];scene.fog.far=fg[1];const sr=W.shadowR||15;Object.assign(key.shadow.camera,{left:-sr,right:sr,top:sr,bottom:-sr});key.shadow.camera.updateProjectionMatrix();
   for(const o of scene.children)if(o.userData.track)o.visible=!W.ownTrack;
   camera.far=W.camFar||200;camera.updateProjectionMatrix();}
  GLB.gen++;
  REG={meshesOf:{},pickables:[],nodes:[],partAnchor:{},sysAnchor:{}};
  curRoot=new THREE.Group();scene.add(curRoot);
  CTX=W.build(curRoot);
  for(const pid in REG.meshesOf){
    const m=REG.meshesOf[pid][0];m.geometry.computeBoundingBox();
    const c=new V3();m.geometry.boundingBox.getCenter(c);REG.partAnchor[pid]=anchor(m,c.x,c.y,c.z);
  }
  state.w=W.init();state.quiz=null;state.part=null;state.hover=null;state.sys=null;explodeCur=0;
  clearP();renderStatic();goStep(0);if(!keepCam)setView(W.STEPS[0].cam,0);
  try{history.replaceState(null,'','#'+(W.hashId?W.hashId():W.id));}catch(e){}
}

/* ================= Pointer input ================= */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),tip=$('#tip');
function isShown(o){for(;o;o=o.parent)if(!o.visible)return false;return true;}
const pointers=new Map();let downPos=null,moved=0,pinch0=0,panMode=false;
function pick(cx,cy){
  const r=canvas.getBoundingClientRect();
  ndc.set(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(REG.pickables.filter(m=>!m.userData.dim&&isShown(m)),false);
  return hits.length?hits[0].object.userData.part:null;
}
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){downPos={x:e.clientX,y:e.clientY};moved=0;panMode=e.button===2||e.shiftKey;}
  if(pointers.size===2){const [a,b]=[...pointers.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);}
  tween=null;canvas.classList.add('drag');
});
canvas.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId)){
    const id=pick(e.clientX,e.clientY);
    if(id!==state.hover){state.hover=id;applyVisual();}
    canvas.classList.toggle('hot',!!id);
    const hideName=state.quiz&&state.quiz.q&&!state.quiz.q.ans;
    if(id&&!hideName&&e.pointerType==='mouse'){const r=viewport.getBoundingClientRect();tip.textContent=tr(W.P[id].name);tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';tip.hidden=false;}
    else tip.hidden=true;
    return;
  }
  const p=pointers.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  moved+=Math.abs(dx)+Math.abs(dy);
  if(pointers.size===2){const [a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0>0&&d>0)cam.r=clamp(cam.r*pinch0/d,3,W.maxR||42);pinch0=d;return;}
  if(panMode){
    const k=cam.r*.0016,right=new V3().setFromMatrixColumn(camera.matrix,0),up=new V3().setFromMatrixColumn(camera.matrix,1);
    cam.t.addScaledVector(right,-dx*k).addScaledVector(up,dy*k);cam.t.y=clamp(cam.t.y,-1,10);
  }else{cam.th-=dx*.006;cam.ph=clamp(cam.ph-dy*.005,.18,1.52);}
});
function endPointer(e){
  if(!pointers.has(e.pointerId))return;
  pointers.delete(e.pointerId);
  if(pointers.size===0){
    canvas.classList.remove('drag');
    if(moved<6&&downPos){
      const id=pick(e.clientX,e.clientY);
      if(state.quiz&&state.quiz.q&&!state.quiz.q.ans){}
      else if(id){if(state.quiz)state.quiz=null;selectPart(id,false);}
      else if(state.part&&!state.quiz){state.part=null;refresh();}
    }
    downPos=null;
  }
  if(pointers.size<2)pinch0=0;
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('pointerleave',()=>{if(state.hover){state.hover=null;applyVisual();}tip.hidden=true;});
canvas.addEventListener('wheel',e=>{e.preventDefault();tween=null;cam.r=clamp(cam.r*Math.exp(e.deltaY*.0011),3,W.maxR||42);},{passive:false});
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight')$('#next').click();else if(e.key==='ArrowLeft')$('#prev').click();
});

/* ================= Resize & loop ================= */
function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
if(window.ResizeObserver)new ResizeObserver(resize).observe(viewport);else window.addEventListener('resize',resize);
resize();

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(tween){
    const k=clamp((now-tween.start)/tween.dur,0,1),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,f=tween.from,t=tween.to;
    cam.t.lerpVectors(f.t,t.t,e);cam.th=f.th+(t.th-f.th)*e;cam.ph=f.ph+(t.ph-f.ph)*e;cam.r=f.r+(t.r-f.r)*e;
    if(k>=1)tween=null;
  }
  explodeCur=reduce?state.explode:explodeCur+(state.explode-explodeCur)*Math.min(1,dt*3.2);
  for(const n of REG.nodes){const d=n.fn(explodeCur),b=n.g.userData.base;n.g.position.set(b.x+d[0],b.y+d[1],b.z+d[2]);}
  const unloading=W.anim(CTX,dt,explodeCur,state.w);
  let any=false;
  for(let i=0;i<PN;i++){
    const j=i*3;if(pPos[j+1]<-20)continue;any=true;
    pVel[j+1]-=9.8*dt;pPos[j]+=pVel[j]*dt;pPos[j+1]+=pVel[j+1]*dt;pPos[j+2]+=pVel[j+2]*dt;
    if(pPos[j+1]<pFloor[i])pPos[j+1]=-50;
  }
  if(any||unloading)pGeo.attributes.position.needsUpdate=true;
  updateCam();renderer.render(scene,camera);updateLabels();
  requestAnimationFrame(frame);
}
function applyLang(){
  document.documentElement.lang=LANG;
  document.title=tr('Грузовые вагоны в разборе');
  document.querySelectorAll('[data-i18n]').forEach(el=>{if(el.dataset.ru===undefined)el.dataset.ru=el.innerHTML;el.innerHTML=tr(el.dataset.ru);});
  document.querySelectorAll('[aria-label]').forEach(el=>{if(el.dataset.ruAria===undefined)el.dataset.ruAria=el.getAttribute('aria-label');el.setAttribute('aria-label',tr(el.dataset.ruAria));});
  document.querySelectorAll('.sw').forEach((b,i)=>{b.title=tr(BGS[i][0]);b.setAttribute('aria-label',L('Фон','Background')+': '+tr(BGS[i][0]));});
  const pk=document.querySelector('.pick');if(pk)pk.title=L('Свой цвет','Custom colour');
  const al=document.getElementById('appLink');if(al)al.href='https://play.google.com/store/apps/details?id=com.hfad.smgrapp&hl='+LANG;
  document.querySelectorAll('.langsw button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===LANG));
}
document.querySelectorAll('.langsw button').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.lang===LANG)return;LANG=b.dataset.lang;try{localStorage.setItem('wagonsLang',LANG);}catch(e){}
  applyLang();if(W){renderStatic();refresh();}
}));
applyLang();
setBg(store.get('wagonBg')||'#0e1720');
{let h=location.hash.slice(1);if(h==='train'||h==='curve')h='motion-'+h;const k=h.indexOf('-'),id=k>0?h.slice(0,k):h,v=k>0?h.slice(k+1):'';const Wg=WAGONS[id];if(Wg&&v&&Wg.variants&&Wg.variants.some(x=>x[0]===v))Wg.setVariant(v);loadWagon(Wg?id:'gondola');}
requestAnimationFrame(frame);
})();
</script>
